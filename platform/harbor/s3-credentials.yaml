---
# Credenciales S3 del almacén de Harbor (INFRA-482). El registry ya no escribe en la
# MinIO de sauvage —RAID1 de HDD al 100 % de io_time, cerrar una subida de capa costaba
# 1m45s y la CI cortaba con «timeout awaiting response headers», INFRA-931— sino en
# Object Storage de OVH (región sbg), dentro de la misma red que ks5, donde corre
# harbor-registry.
#
# Las genera el manager de OVH (usuario S3 `k8s-objectstore` del proyecto PCI
# 74858f325f3e49c4a3c6ae6ac70ae9a0) y viven solo en 1Password. Rotar = crear usuario y
# credenciales nuevas en el manager, actualizar el item y reiniciar harbor-registry
# (el driver `s3` lee la credencial en el arranque).
#
# Se llama `harbor-s3-ovh-credentials` y no reaprovecha el nombre viejo
# (`harbor-s3-credentials`) a proposito: ese secret quedo huerfano con un ownerRef al
# ExternalSecret de MinIO que este mismo commit borra, y ESO no adopta un secret
# controlado por otro ExternalSecret —el corte habria dejado al registry sin credencial—.
#
# 1Password item (vault k8s-pocharlies):
#   ovh-object-storage-s3
#     access_key / secret_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3-ovh-credentials
  namespace: harbor
  labels:
    security.e-dani.com/rotation-class: object-storage
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: harbor-s3-ovh-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .accessKey }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: ovh-object-storage-s3
        property: access_key
    - secretKey: secretKey
      remoteRef:
        key: ovh-object-storage-s3
        property: secret_key
