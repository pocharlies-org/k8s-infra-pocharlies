# These metadata-only resources adopt the seven manual TLS copies without
# storing certificate material in Git. Server-side apply owns only these
# annotation; Reflector owns the data and reflected-version metadata.
apiVersion: v1
kind: Secret
metadata:
  name: wildcard-lan-tls
  namespace: adguard
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: traefik-lan/wildcard-lan-tls
type: kubernetes.io/tls
