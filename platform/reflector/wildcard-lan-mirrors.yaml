# The seven target Secrets predate GitOps and cannot be recreated from Git
# because their private key must never enter the repository. Apply these
# metadata-only patches after the existing Secrets so Reflector can adopt them.
apiVersion: v1
kind: Secret
metadata:
  name: wildcard-lan-tls
  namespace: adguard
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: traefik-lan/wildcard-lan-tls
---
