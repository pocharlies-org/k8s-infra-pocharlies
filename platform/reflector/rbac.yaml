apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reflector-read
rules:
  # Reflector watches cluster-wide because Kubernetes RBAC cannot restrict a
  # list/watch to one object name. It has no cluster-wide write permission.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reflector-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reflector-read
subjects:
  - kind: ServiceAccount
    name: reflector
    namespace: reflector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reflector-wildcard-lan
  namespace: adguard
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["wildcard-lan-tls"]
    verbs: ["get", "patch"]
