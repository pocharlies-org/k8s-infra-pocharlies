---
# Credenciales del Job de migración de pins (INFRA-1365).
#
# Forma Connect (key: item + property: campo) + refreshPolicy OnChange (Kyverno
# externalsecret-onepassword-onchange), como arc-skills-eval.
#   - harbor-push: robot con PUSH (item infra-harbor-ci-robot). Con pull solo da
#     401 en el POST de CreateTag (INFRA-1273); es la credencial que retaguea.
#   - github token: PAT para clonar los repos GitOps privados (initContainer).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guarda-pins-creds
  namespace: guarda-pins
  labels:
    app.kubernetes.io/name: guarda-pins
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: guarda-pins-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
  data:
    - secretKey: HARBOR_USER
      remoteRef:
        key: infra-harbor-ci-robot
        property: username
    - secretKey: HARBOR_PASSWORD
      remoteRef:
        key: infra-harbor-ci-robot
        property: password
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: github-pat-pocharlies
        property: token
