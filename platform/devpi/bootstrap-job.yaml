# Bootstrap del índice (SKIRM-590). Determinista y en git, idempotente: deja el
# usuario `company` y el índice `company/internal` con la política fijada por el
# architect — lectura anónima, escritura solo `@company`, y SIN bases: el índice
# no es espejo del PyPI público (los paquetes públicos los resuelve uv directo
# desde pypi.org). Además BORRA el índice mirror `root/pypi` que `devpi-init`
# crea por defecto (criterio A3): mientras existe, el server se trae la lista de
# proyectos de pypi.org y la indexa (medido en el primer arranque: 946 708
# proyectos encolados). Nada del contrato lo referencia.
#
# El server fija la contraseña de root en su primer init (entrypoint de la
# imagen, desde el mismo ExternalSecret), así que el Job espera a que la API
# responda y entra con ella. No imprime secretos. Sin ttlSecondsAfterFinished:
# se lo pone la Kyverno job-ttl-default.
#
# Si el PVC se perdiera, borrar el Job y dejar que ArgoCD lo relance: vuelve a
# crear usuario e índice contra el server recién inicializado. Igual tras un
# cambio de este template: el Job es inmutable (prune=false), hay que borrar el
# viejo para que ArgoCD cree el nuevo.
apiVersion: batch/v1
kind: Job
metadata:
  name: devpi-bootstrap
  namespace: devpi
  labels:
    app.kubernetes.io/name: devpi
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpi-bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/jonasal/devpi-client:7.3.0@sha256:5988832d86d48b63934bc408c8eea210bdcb97b64de75fbc595e7900d2974fe6
          # Ojo: `command` pisa el ENTRYPOINT de la imagen (que hacía
          # `devpi use $DEVPI_URL` antes del exec), así que el script hace su
          # propio `devpi use`. La URL va sin índice: `root/pypi` se borra más
          # abajo y una URL con índice inexistente rompería el `devpi use`.
          env:
            - name: DEVPI_URL
              value: http://devpi/
            - name: HOME
              value: /tmp
            - name: DEVPI_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devpi-credentials
                  key: root_password
            - name: DEVPI_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devpi-credentials
                  key: publish_token
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              until devpi use "$DEVPI_URL" >/dev/null 2>&1 && devpi login root --password="$DEVPI_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "esperando la API de devpi..."
                sleep 5
              done
              if devpi user -c company password="$DEVPI_PUBLISH_TOKEN" >/dev/null 2>&1; then
                echo "usuario company creado"
              else
                echo "usuario company ya existía (se conserva su contraseña)"
              fi
              if devpi index -c company/internal type=stage >/dev/null 2>&1; then
                echo "índice company/internal creado (sin bases: sin mirror del PyPI público)"
              else
                echo "índice company/internal ya existía"
              fi
              # La política se pasa como keyvalues posicionales (el cliente 7.x
              # no tiene `-s` en `devpi index`).
              devpi index company/internal read=:anonymous write=@company >/dev/null
              echo "política aplicada: read=:anonymous write=@company"
              # A3: fuera el mirror por defecto del PyPI público (ver cabecera).
              if devpi index -d -y root/pypi >/dev/null 2>&1; then
                echo "mirror root/pypi eliminado"
              else
                echo "root/pypi ya no existía"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
