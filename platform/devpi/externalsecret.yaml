# Credenciales de devpi (SKIRM-590). Los items los escribe `security` en
# 1Password (vault k8s-pocharlies, tabla en nota-security-informe.md de
# SKIRM-592); nunca van a git.
#
# Forma Connect (key: item + property: campo) sobre el ClusterSecretStore
# `onepassword-connect`, y `refreshPolicy: OnChange` — lo exige la Kyverno
# externalsecret-onepassword-onchange. Los campos los consume el cluster (el de
# la réplica, `replication_secret`, va al final):
#   - `root_password`: contraseña de root (la fija el entrypoint de la imagen
#     en el init del serverdir, y con ella entra el Job de bootstrap).
#   - `publish_token`: contraseña del usuario `company` de devpi, que crea el
#     Job. Su consumidor permanente es la CI (org secret PYPI_PUBLISH_TOKEN,
#     job publish-sdk de SKIRM-587); aquí solo sirve para acuñar el usuario.
# Si el ExternalSecret solo leyera `root_password`, el token de la CI no
# coincidiría con el usuario creado (constancia de security).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devpi-credentials
  namespace: devpi
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: devpi
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: devpi-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
  data:
    - secretKey: root_password
      remoteRef:
        key: devpi-root
        property: root_password
    - secretKey: publish_token
      remoteRef:
        key: devpi-publish
        property: publish_token
    # INFRA-1533: el secreto con el que primario y réplicas se autentican entre sí (--secretfile).
    - secretKey: replication_secret
      remoteRef:
        key: devpi-replication
        property: secret
