# Cierre del índice (SKIRM-590, criterio A4). El único camino legítimo hacia
# devpi es la IngressRoute LAN: el generador de CoreDNS fija pypi.e-dani.com al
# VIP de traefik-lan, así que todo el tráfico útil llega desde pods del
# namespace traefik-lan (la CI también: los runners resuelven por ese pin). Sin
# esta política, cualquier pod del cluster golpearía el Service ClusterIP por
# detrás de Traefik.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devpi-default-deny-ingress
  namespace: devpi
  labels:
    app.kubernetes.io/name: devpi
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devpi-allow-traefik-lan
  namespace: devpi
  labels:
    app.kubernetes.io/name: devpi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devpi
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-lan
        # El Job de bootstrap (mismo namespace) entra por el Service ClusterIP.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devpi
      ports:
        - protocol: TCP
          port: 8080
