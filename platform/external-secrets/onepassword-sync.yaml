---
# onepassword-sync — pilot one-way sync 1Password -> Vault (DGX-125 phase 4).
#
# Per item: an ExternalSecret reads the item from the `onepassword`
# ClusterSecretStore into an in-namespace Secret named `<item>-op`, and a
# PushSecret writes that Secret into the `vault-backend` ClusterSecretStore at
# `op/<item>` (remoteKey is mount-relative: the store's KV v2 mount is `secret`,
# so this lands at secret/data/op/<item>). Several `property` entries sharing
# one remoteKey merge into a single KV path; the push is idempotent (no new KV
# version when nothing changed).
#
# Paths under op/ are deliberately new: pushing onto a pre-existing path that
# lacks custom_metadata.managed-by=external-secrets makes the PushSecret fail.
#
# To add a new item: copy one ExternalSecret+PushSecret pair below, replace the
# item name and its fields, and point the consumers' ClusterExternalSecret at
# secretStoreRef vault-backend with remoteRef.key `op/<item>` and
# `property: <field>`. Against the onepassword store the remoteRef.key is
# always `<item>/<field>` — never a Vault path (DGX-116).
apiVersion: v1
kind: Namespace
metadata:
  name: onepassword-sync
  labels:
    app.kubernetes.io/managed-by: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-harbor-k8s-runtime-pull-from-op
  namespace: onepassword-sync
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: infra-harbor-k8s-runtime-pull-op
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: infra-harbor-k8s-runtime-pull/dockerconfigjson
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: infra-harbor-k8s-runtime-pull-to-vault
  namespace: onepassword-sync
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: vault-backend
  selector:
    secret:
      name: infra-harbor-k8s-runtime-pull-op
  data:
    - match:
        secretKey: dockerconfigjson
        remoteRef:
          remoteKey: op/infra-harbor-k8s-runtime-pull
          property: dockerconfigjson
      conversionStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmshop-catalog-api-from-op
  namespace: onepassword-sync
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: skirmshop-catalog-api-op
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: active
      remoteRef:
        key: skirmshop-catalog-api/active
    - secretKey: previous
      remoteRef:
        key: skirmshop-catalog-api/previous
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: skirmshop-catalog-api-to-vault
  namespace: onepassword-sync
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: vault-backend
  selector:
    secret:
      name: skirmshop-catalog-api-op
  data:
    - match:
        secretKey: active
        remoteRef:
          remoteKey: op/skirmshop-catalog-api
          property: active
      conversionStrategy: None
    - match:
        secretKey: previous
        remoteRef:
          remoteKey: op/skirmshop-catalog-api
          property: previous
      conversionStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-backup-user-from-op
  namespace: onepassword-sync
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: minio-backup-user-op
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: minio-backup-user/ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: minio-backup-user/SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: minio-backup-user-to-vault
  namespace: onepassword-sync
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: vault-backend
  selector:
    secret:
      name: minio-backup-user-op
  data:
    - match:
        secretKey: ACCESS_KEY_ID
        remoteRef:
          remoteKey: op/minio-backup-user
          property: ACCESS_KEY_ID
      conversionStrategy: None
    - match:
        secretKey: SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: op/minio-backup-user
          property: SECRET_ACCESS_KEY

      conversionStrategy: None