---
# ClusterSecretStore kubernetes: que el perfil `hermes` lea los DOS secretos HMAC que el núcleo de correo
# (`correo-core`, ns `correo`) guarda para él, SIN pasar por 1Password (patrón kubernetes-control-nexus-pagos).
#
# DGX-880 (P10 de la épica DGX-870, security S20). El núcleo firma y verifica con HMAC V2 (correo.ingest.v1 y
# correo.events.v1). k8s-correo-pocharlies (P8) genera en `correo` un Secret por productor y por suscriptor (clave
# `password`, Password + ExternalSecret CreatedOnce). Hermes es productor (`correo-productor-hermes`: crea y versiona
# tarjetas de los buzones de su perfil, no aprueba nada) y suscriptor (`correo-suscriptor-hermes`: verifica los
# eventos que el núcleo le entrega). Llegan al ns `hermes` por los ExternalSecret de su chart (P13), con este store.
#
# El alcance es el mínimo: SOLO `get`, SOLO sobre esos dos Secrets por resourceNames, SOLO para la ServiceAccount de
# este store (`eso-correo-hermes-reader`, ns `hermes`) y ninguna otra. Los Secrets de Gmail y de APNs viven en el
# mismo ns `correo` y quedan fuera porque no están en resourceNames; sin `list` ni `watch`, un nombre que no está aquí
# ni se puede enumerar. La regla de `selfsubjectrulesreviews:create` la exige ESO para validar el store (igual que
# pagos y cnpg); sin ella queda en "failed to validate store".
#
# `conditions`: un ClusterSecretStore lo puede nombrar un ExternalSecret de cualquier ns. Aquí solo el de `hermes`:
# así el HMAC de Hermes no se lee desde otro ns aunque alguien cree allí un ExternalSecret que apunte a este store.
#
# ORDEN DE FUSIÓN: el ns `correo` lo crea la Application `correo` (P9, `managedNamespaceMetadata`), no este repo, y el
# Role y el RoleBinding viven en él. Esta PR se fusiona DESPUÉS del primer sync de esa Application: antes, el Role cae
# en un ns que no existe, la oleada -5 falla y k8s-infra no pasa de ella.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-correo-hermes
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  conditions:
    - namespaces: [hermes]
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-correo-hermes-reader
          namespace: hermes
      remoteNamespace: correo
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: correo
          key: ca.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # antes que el ClusterSecretStore (-4): sin la SA y su RBAC el store no queda sano y ArgoCD no pasa de esa oleada.
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-correo-hermes-reader
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-correo-hermes-reader
  namespace: correo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - correo-productor-hermes
      - correo-suscriptor-hermes
    verbs: ["get"]
  # ESO valida el store haciendo un SelfSubjectRulesReview con la SA de arriba
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-correo-hermes-reader
  namespace: correo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-correo-hermes-reader
subjects:
  - kind: ServiceAccount
    name: eso-correo-hermes-reader
    namespace: hermes
