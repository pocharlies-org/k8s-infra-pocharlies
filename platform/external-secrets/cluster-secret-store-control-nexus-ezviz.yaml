---
# ClusterSecretStore kubernetes: que el `ezviz-gateway` (ns `frigate`) lea el token del control que le genera el dashboard
# en control-nexus, SIN pasar por 1Password (patrón kubernetes-control-nexus-pagos).
#
# INFRA-717, fase 2 (15-11, veredicto del architect): el gateway abre un oyente de control en :8081 (mover las cámaras,
# abrir el cerrojo del timbre, eventos y grabaciones de la SD) solo para el backend del dashboard, con un Bearer. El
# dashboard genera ese Bearer en control-nexus (`dgx-dashboard-ezviz-control`, Password + ExternalSecret CreatedOnce,
# clave `EZVIZ_CONTROL_TOKEN`) y el gateway lo lee con este store desde su ExternalSecret `ezviz-control-token`.
#
# Alcance mínimo: SOLO `get`, SOLO sobre ese Secret por resourceNames, SOLO para la ServiceAccount de este store
# (`eso-control-nexus-ezviz-reader`, ns `frigate`), y solo el ns `frigate` puede nombrar el store (`conditions`). La
# regla de `selfsubjectrulesreviews:create` la exige ESO para validar el store (igual que pagos y correo).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-control-nexus-ezviz
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  conditions:
    - namespaces: [frigate]
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-control-nexus-ezviz-reader
          namespace: frigate
      remoteNamespace: control-nexus
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: control-nexus
          key: ca.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # antes que el ClusterSecretStore (-4): sin la SA y su RBAC el store no queda sano y ArgoCD no pasa de esa oleada.
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-control-nexus-ezviz-reader
  namespace: frigate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-control-nexus-ezviz-reader
  namespace: control-nexus
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - dgx-dashboard-ezviz-control
    verbs: ["get"]
  # ESO valida el store haciendo un SelfSubjectRulesReview con la SA de arriba
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-control-nexus-ezviz-reader
  namespace: control-nexus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-control-nexus-ezviz-reader
subjects:
  - kind: ServiceAccount
    name: eso-control-nexus-ezviz-reader
    namespace: frigate
