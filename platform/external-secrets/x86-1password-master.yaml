---
# Contraseña maestra de 1Password del x86, para el ayudante de desbloqueo (INFRA-1172).
# El desbloqueo de 1Password en el display :0 era el paso humano de las ceremonias de passkey de
# agent-jake (INFRA-374). Decisión de Dani (04-11) y veredicto de security (INFRA-1172): el agente
# desbloquea solo cuando la ceremonia lo necesita. Fuente única: el item `x86-1password-master`
# (campo notas) de la bóveda k8s-pocharlies, que lee el Connect del clúster.
#
# El consumidor es el host x86 con su kubeconfig (precedente: paseo/github-token + gh-cred-sync):
# `1password-unlock.py` (x86-host-runtime) lee este Secret y teclea el valor en la ventana de
# desbloqueo por stdin — nunca a argv, al journal ni a un transcript — y registra cada desbloqueo.
#
# Rotación (lote semanal con Dani): editar el item → OnChange actualiza este Secret → el ayudante
# usa la nueva en la pasada siguiente, sin tocar el host. Mientras el item lleve `SIN-ASIGNAR`
# (antes de la primera puesta) el ayudante se niega a teclearla.
#
# 1Password item (vault k8s-pocharlies):
#   x86-1password-master
#     notas → notesPlain (etiqueta real del campo notas en la API de Connect)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x86-1password-master
  namespace: paseo
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: x86-1password-master
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: x86-1password-master
        property: notesPlain
