---
# ClusterSecretStore kubernetes: que el perfil `hermes` lea los DOS secretos HMAC del dashboard de
# pagos SIN pasar por 1Password (patrón kubernetes-cnpg, que vive en el repo de skirmbooks).
#
# dgx.app.pagos.v1 (aditivo 04-10-2026): el plugin confirmar-pago de Hermes firma sus llamadas de
# máquina al backend de control-nexus. El secreto general (`dgx-dashboard-pagos`) firma GET /esperar
# y POST /resultado; POST /decision se firma con uno PROPIO (`dgx-dashboard-pagos-decision`) —
# veredicto del architect sobre dgx-infra#961: la secretaria, que recibe el general por el skill
# pago-alerta, no puede autoaprobarse con él. Ambos Secrets los genera in-cluster el ExternalSecret
# del propio dashboard (Password generator, CreatedOnce), clave `password`.
#
# El alcance es el mínimo de la ley del maker: SOLO `get`, SOLO sobre esos dos Secrets por
# resourceNames, SOLO para la ServiceAccount de este store (`eso-control-nexus-pagos-reader` en el
# namespace `hermes`) y ninguna otra. La regla extra de `selfsubjectrulesreviews:create` en
# authorization.k8s.io la exige ESO para validar el store (igual que cnpg); sin ella el store queda
# en "failed to validate store".
#
# Si dgx-infra#961 aún no ha traído `dgx-dashboard-pagos-decision`, el ExternalSecret de Hermes que
# lo apunta queda en error (el general se sincroniza igual: son DOS ES); no bloquea nada porque el
# Deployment lo consume con secretKeyRef optional:true.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-control-nexus-pagos
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-control-nexus-pagos-reader
          namespace: hermes
      remoteNamespace: control-nexus
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: control-nexus
          key: ca.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-control-nexus-pagos-reader
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-control-nexus-pagos-reader
  namespace: control-nexus
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - dgx-dashboard-pagos
      - dgx-dashboard-pagos-decision
    verbs: ["get"]
  # ESO valida el store haciendo un SelfSubjectRulesReview con la SA de arriba (patrón kubernetes-cnpg)
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-control-nexus-pagos-reader
  namespace: control-nexus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-control-nexus-pagos-reader
subjects:
  - kind: ServiceAccount
    name: eso-control-nexus-pagos-reader
    namespace: hermes
