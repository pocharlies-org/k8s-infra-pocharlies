# ClusterSecretStore kubernetes: que el perfil `hermes` lea el HMAC de la clase `hermes` del dashboard
# de alarma SIN pasar por 1Password (mismo patrón que kubernetes-control-nexus-pagos).
#
# DGX-674/DGX-702: el plugin `alarma` de Hermes (k8s-openclaw-qwen36-pocharlies, DGX-698) firma sus
# llamadas de máquina al backend de control-nexus con `ALARMA_HMAC_HERMES`, que vive en el Secret
# `dgx-dashboard-alarma-hermes` (ns `control-nexus`, creado por dgx-infra#1062 desde 1Password
# `dashboard-alarma-hmac`/`hermes`).
#
# Un store por Secret: el de pagos NO se amplía. El alcance es el mínimo de la ley del maker: SOLO
# `get`, SOLO sobre ese Secret por resourceNames, SOLO para la ServiceAccount de este store
# (`eso-control-nexus-alarma-reader` en el namespace `hermes`) y ninguna otra. La regla extra de
# `selfsubjectrulesreviews:create` en authorization.k8s.io la exige ESO para validar el store (igual
# que cnpg y pagos); sin ella el store queda en "failed to validate store".
#
# Hasta que este store esté `Valid`, `alarma.dashboardUrl` de Hermes sigue vacío (sin ExternalSecret).
# Contrato: tests/test_alarma_hermes_reader_contract.py.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-control-nexus-alarma
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-control-nexus-alarma-reader
          namespace: hermes
      remoteNamespace: control-nexus
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: control-nexus
          key: ca.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # antes que el ClusterSecretStore (-4): sin la SA y su RBAC el store no queda sano y ArgoCD
    # no pasa de esa oleada (mismo motivo que el store de pagos).
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-control-nexus-alarma-reader
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-control-nexus-alarma-reader
  namespace: control-nexus
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - dgx-dashboard-alarma-hermes
    verbs: ["get"]
  # ESO valida el store haciendo un SelfSubjectRulesReview con la SA de arriba (patrón kubernetes-cnpg)
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-control-nexus-alarma-reader
  namespace: control-nexus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-control-nexus-alarma-reader
subjects:
  - kind: ServiceAccount
    name: eso-control-nexus-alarma-reader
    namespace: hermes
