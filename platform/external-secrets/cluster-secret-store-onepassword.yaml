---
# ClusterSecretStore: connects External Secrets Operator to the 1Password vault
# that replaces the in-cluster HashiCorp Vault as the source of truth for every
# password in the cluster.
#
# Auth is a 1Password *service account* token. Unlike the Vault store it replaces
# — which used Kubernetes ServiceAccount auth and therefore needed no stored
# credential — this one has a bootstrap secret. It is the only secret in the
# cluster that cannot come from 1Password, so it is created out of band and is
# NOT in git:
#
#   kubectl -n external-secrets-operator create secret generic \
#     onepassword-service-account --from-literal=token='ops_...'
#
# Keep a copy of that token in 1Password itself for the humans. If it expires,
# nothing refreshes: every ExternalSecret goes SecretSyncedError and stalls on its
# last value (all 214 are deletionPolicy: Retain, so nothing is deleted and no
# workload breaks — but no rotation lands either). Alert on the expiry date.
#
# `vault:` is the 1Password vault NAME or UUID, without the op:// prefix. One
# store binds to exactly one vault; a second vault needs a second store.
#
# remoteRef keys use 1Password secret-reference syntax, `<item>/[section/]<field>`
# — there is no `property`. The Vault path becomes the item title: drop the mount
# prefix, flatten the slashes. `secret/skirmshop/labels` -> `skirmshop-labels`.
#
# Dropping the prefix is not cosmetic. ESO's Vault provider DEDUPES the mount on
# read, so `infra/harbor/k8s-runtime-pull` and `secret/infra/harbor/k8s-runtime-pull`
# are the same KV path written two ways — all 35 harbor-pull secrets in the cluster
# hash identically whichever spelling their ExternalSecret uses. Two items would
# drift the first time someone rotated one of them. (PushSecret does NOT dedupe,
# which is how the two spellings got here.) 102 keys collapse to 101 items, no
# collisions.
#
# `cache` is not cosmetic, and its TTL has to be >= the refresh interval to do
# anything at all.
#
# The only client here is the ESO pod. Application pods never talk to 1Password —
# they mount a plain k8s Secret. ESO has no change feed from 1Password, so it
# re-reads every reference on every refresh, changed or not: 212 ExternalSecrets,
# 449 references, 164 of them hourly and 38 every 15 minutes.
#
#   uncached : 554 reads/hour, 13,298/day
#   cached   : 104 reads/hour,  2,497/day   (96 distinct items actually read)
#
# The 5x gap is dedupe, not time: 35 ExternalSecrets read the same harbor-pull
# item, one per namespace. A 30m TTL against a 1h refresh expires before the next
# read and buys nothing — hence 1h. Cost: a rotated secret can take up to two
# refresh intervals to land instead of one.
#
# maxSize must exceed the 101 items or the LRU evicts what it just cached.
#
# Quotas: Business 10k/hour and 50k/day per account; Teams 1k/hour and 5k/day;
# personal/Families 1k/day. Uncached this only fits Business. Cached it also fits
# Teams, at about half the daily budget — and that budget is shared with whatever
# the humans do in the 1Password app.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: k8s-pocharlies
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets-operator
          key: token
      cache:
        ttl: 1h
        maxSize: 200
