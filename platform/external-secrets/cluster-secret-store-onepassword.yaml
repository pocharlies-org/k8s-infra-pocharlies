---
# ClusterSecretStore: connects External Secrets Operator to the 1Password vault
# that replaces the in-cluster HashiCorp Vault as the source of truth for every
# password in the cluster.
#
# Auth is a 1Password *service account* token. Unlike the Vault store it replaces
# — which used Kubernetes ServiceAccount auth and therefore needed no stored
# credential — this one has a bootstrap secret. It is the only secret in the
# cluster that cannot come from 1Password, so it is created out of band and is
# NOT in git:
#
#   kubectl -n external-secrets-operator create secret generic \
#     onepassword-service-account --from-literal=token='ops_...'
#
# Keep a copy of that token in 1Password itself for the humans. If it expires,
# nothing refreshes: every ExternalSecret goes SecretSyncedError and stalls on its
# last value (all 214 are deletionPolicy: Retain, so nothing is deleted and no
# workload breaks — but no rotation lands either). Alert on the expiry date.
#
# `vault:` is the 1Password vault NAME or UUID, without the op:// prefix. One
# store binds to exactly one vault; a second vault needs a second store.
#
# remoteRef keys use 1Password secret-reference syntax, `<item>/[section/]<field>`
# — there is no `property`. The Vault path becomes the item title: drop the mount
# prefix, flatten the slashes. `secret/skirmshop/labels` -> `skirmshop-labels`.
#
# Dropping the prefix is not cosmetic. ESO's Vault provider DEDUPES the mount on
# read, so `infra/harbor/k8s-runtime-pull` and `secret/infra/harbor/k8s-runtime-pull`
# are the same KV path written two ways — all 35 harbor-pull secrets in the cluster
# hash identically whichever spelling their ExternalSecret uses. Two items would
# drift the first time someone rotated one of them. (PushSecret does NOT dedupe,
# which is how the two spellings got here.) 102 keys collapse to 101 items, no
# collisions.
#
# `cache` here is NOT optional. The 1Password account is Families: 1,000
# requests/day for the WHOLE account, shared with whatever the humans do in the
# app. (Business would be 50,000/day, but that account belongs to an employer,
# not to us.)
#
# The only client is the ESO pod. Application pods never talk to 1Password — they
# mount a plain k8s Secret. ESO has no change feed, so on every refresh it
# re-reads every reference, changed or not. Measured live 2026-09-13: 176
# ExternalSecrets on this store, 346 remoteRef fields, 74 distinct items. The
# cache dedups at ITEM granularity — 35 ES read the same harbor-pull item, one
# per namespace, and a single fetch serves all 35.
#
# The cache IS the whole budget. Because ESO refetches on every refresh, the
# daily calls are (distinct items) x (times an item is truly fetched per day),
# and an item is fetched once per CACHE EXPIRY — not once per refresh — but only
# when the TTL is STRICTLY GREATER than the refreshInterval:
#
#   ttl <= refreshInterval : the entry expires exactly when the next refresh
#       fires, so EVERY refresh misses. Operating point = uncached =
#       346 fields x 4/day ~= 1,384/day, which blows the 1,000 cap and starves
#       the account ~20h after each reset (DGX-84). THIS WAS THE BUG: the old
#       `ttl: 6h` EQUALLED the 6h refresh, so the cache bought nothing.
#   ttl  >  refreshInterval : refreshes hit the cache; each item is refetched
#       once per ttl. At `ttl: 24h` (4x the 6h refresh) that is 74 items x 1/day
#       = 74/day. Absolute worst case, if the cache were keyed per field, is
#       346/day. Both fit the 1,000 cap with >65% headroom.
#
# Hence ttl 24h and maxSize 400 (greater than the 346 fields, so the LRU never
# evicts what it just cached under either keying). Steady state ~= 74/day,
# absolute worst 346/day, against a 1,000/day cap.
#
# What it costs: a rotated secret now takes up to ~24h to reach the cluster
# (worst ~30h: cache write plus the next refresh after expiry), up from ~12h.
# For infra secrets that rotate rarely this is the accepted trade. Anything that
# must land faster needs its OWN low-ttl store (follow-up), NOT a lower
# refreshInterval — while ttl is the binding constraint a faster refresh only
# hits the cache harder, it does not fetch sooner.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: k8s-pocharlies
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets-operator
          key: token
      cache:
        ttl: 24h
        maxSize: 400
