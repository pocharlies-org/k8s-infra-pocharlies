---
# ClusterSecretStore: connects External Secrets Operator to the 1Password vault
# that replaces the in-cluster HashiCorp Vault as the source of truth for every
# password in the cluster.
#
# Auth is a 1Password *service account* token. Unlike the Vault store it replaces
# — which used Kubernetes ServiceAccount auth and therefore needed no stored
# credential — this one has a bootstrap secret. It is the only secret in the
# cluster that cannot come from 1Password, so it is created out of band and is
# NOT in git:
#
#   kubectl -n external-secrets-operator create secret generic \
#     onepassword-service-account --from-literal=token='ops_...'
#
# Keep a copy of that token in 1Password itself for the humans. If it expires,
# nothing refreshes: every ExternalSecret goes SecretSyncedError and stalls on its
# last value (all of them are deletionPolicy: Retain, so nothing is deleted and no
# workload breaks — but no rotation lands either). Alert on the expiry date.
#
# `vault:` is the 1Password vault NAME or UUID, without the op:// prefix. One
# store binds to exactly one vault; a second vault needs a second store.
#
# remoteRef keys use 1Password secret-reference syntax, `<item>/[section/]<field>`
# — there is no `property`. The Vault path becomes the item title: drop the mount
# prefix, flatten the slashes. `secret/skirmshop/labels` -> `skirmshop-labels`.
#
# Dropping the prefix is not cosmetic. ESO's Vault provider DEDUPES the mount on
# read, so `infra/harbor/k8s-runtime-pull` and `secret/infra/harbor/k8s-runtime-pull`
# are the same KV path written two ways — all 35 harbor-pull secrets in the cluster
# hash identically whichever spelling their ExternalSecret uses. Two items would
# drift the first time someone rotated one of them. (PushSecret does NOT dedupe,
# which is how the two spellings got here.) 102 keys collapse to 101 items, no
# collisions.
#
# `cache` here is NOT optional. The 1Password account is Families: 1,000
# requests/day for the WHOLE account, shared with whatever the humans do in the
# app. (Business would be 50,000/day, but that account belongs to an employer,
# not to us.)
#
# The only client is the ESO pod. Application pods never talk to 1Password — they
# mount a plain k8s Secret. ESO has no change feed, so on every refresh it
# re-reads every reference, changed or not. Measured live 2026-09-30 (DGX-188,
# `kubectl get es -A -o json`): 254 ExternalSecrets on this store, 484 `data`
# remoteRef fields + 29 `dataFrom` (513), 379 distinct keys, 142 distinct items.
#
# The cache keys by VALUE, not by item: a `data[]` field is cached under its own
# `op://vault/item/field`, a `dataFrom` under the whole item (ESO 1password-sdk
# provider docs + client.go, v2.5.0). The LRU is pure and the TTL is ABSOLUTE
# from load — a hit does not renew it — and an error is never cached. The cache
# lives in the controller process: a restart or a change to this store empties it.
#
# The cache IS the whole budget. Because ESO refetches on every refresh, each key
# is truly fetched once per CACHE EXPIRY — not once per refresh — but only when
# the TTL is STRICTLY GREATER than the refreshInterval:
#
#   ttl <= refreshInterval : the entry expires exactly when the next refresh
#       fires, so EVERY refresh misses and the cache buys nothing. This bit twice:
#       `ttl: 6h` against a 6h refresh (DGX-84, ~1,384/day, over the cap), then
#       `ttl: 24h` against the 24h refresh of fase 2b (DGX-188: 429 Resolve/day,
#       495 successful calls/day against a 250 target).
#   ttl  >  refreshInterval : refreshes hit the cache; each key is refetched once
#       per ttl. Calls/day ~= keys x 24/ttl_h: at `ttl: 96h` that is 484 fields
#       x 24/96 ~= 121 Resolve/day (~150 with the ItemsList/ItemsGet/VaultsList
#       overhead), >40% under the 250 target.
#
# Rule: keep ttl ABOVE the longest refreshInterval on this store (24h today).
# maxSize 800 covers the 513 remoteRefs plus the special "all values" key with
# room to grow; 400 was sized against 346 fields and started evicting at ~407
# live keys. Re-measure the fields when adding ExternalSecrets and keep maxSize
# above them.
#
# Applying a change here empties the cache. The ES then refill it at their own
# refresh time, so the cold start costs up to one fetch per distinct key (~379,
# at most ~513) within the next refresh window — spread across it, not all at
# once, unless every ES is forced at the same time. Merge only with that much
# daily quota left (`op service-account ratelimit`), and never annotate
# `force-reconcile` on this store without the same margin.
#
# What it costs: a rotated secret takes up to ttl + refresh ~= 96h + 24h = 120h
# to reach the cluster. For infra secrets that rotate rarely this is the
# accepted trade. Anything that must land faster goes to its OWN store with a
# short ttl — NEVER a lower refreshInterval: while ttl is the binding constraint
# a faster refresh only hits the cache harder, it does not fetch sooner, and
# refreshes under 24h break DGX-188 criterion (c).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: k8s-pocharlies
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets-operator
          key: token
      cache:
        ttl: 96h
        maxSize: 800
