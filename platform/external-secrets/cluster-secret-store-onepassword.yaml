---
# ClusterSecretStore: connects External Secrets Operator to the 1Password vault
# that replaces the in-cluster HashiCorp Vault as the source of truth for every
# password in the cluster.
#
# Auth is a 1Password *service account* token. Unlike the Vault store it replaces
# — which used Kubernetes ServiceAccount auth and therefore needed no stored
# credential — this one has a bootstrap secret. It is the only secret in the
# cluster that cannot come from 1Password, so it is created out of band and is
# NOT in git:
#
#   kubectl -n external-secrets-operator create secret generic \
#     onepassword-service-account --from-literal=token='ops_...'
#
# Keep a copy of that token in 1Password itself for the humans. If it expires,
# nothing refreshes: every ExternalSecret goes SecretSyncedError and stalls on its
# last value (all of them are deletionPolicy: Retain, so nothing is deleted and no
# workload breaks — but no rotation lands either). Alert on the expiry date.
#
# `vault:` is the 1Password vault NAME or UUID, without the op:// prefix. One
# store binds to exactly one vault; a second vault needs a second store.
#
# remoteRef keys use 1Password secret-reference syntax, `<item>/[section/]<field>`
# — there is no `property`. The Vault path becomes the item title: drop the mount
# prefix, flatten the slashes. `secret/skirmshop/labels` -> `skirmshop-labels`.
#
# Dropping the prefix is not cosmetic. ESO's Vault provider DEDUPES the mount on
# read, so `infra/harbor/k8s-runtime-pull` and `secret/infra/harbor/k8s-runtime-pull`
# are the same KV path written two ways — all 35 harbor-pull secrets in the cluster
# hash identically whichever spelling their ExternalSecret uses. Two items would
# drift the first time someone rotated one of them. (PushSecret does NOT dedupe,
# which is how the two spellings got here.) 102 keys collapse to 101 items, no
# collisions.
#
# The budget. The 1Password account is Families: 1,000 requests/day for the
# WHOLE account, shared with whatever the humans do in the app. (Business would
# be 50,000/day, but that account belongs to an employer, not to us.) `op
# service-account ratelimit` with this token shows the account line.
#
# The only client is the ESO pod. Application pods never talk to 1Password —
# they mount a plain k8s Secret. ESO has no change feed: a Periodic
# ExternalSecret re-reads every reference on every refresh, changed or not
# (254 ExternalSecrets, 513 remoteRefs, 379 distinct keys on 2026-09-30).
#
# So every ExternalSecret on this store is `refreshPolicy: OnChange` (Kyverno
# policy externalsecret-onepassword-onchange, platform/kyverno/policies.yaml;
# DGX-505). ESO reads an ExternalSecret when it is created and when its spec,
# labels or annotations change — never on a timer. refreshInterval is ignored.
#
# Why not the cache alone: ESO v2.5 keeps the provider client, and its cache,
# keyed by THIS object's resourceVersion (providers/v1/onepasswordsdk/
# provider.go). A controller restart or ANY change to this store — an
# annotation, an edit, the status flipping to InvalidProviderConfig when the
# quota runs out — drops it, and every Periodic ExternalSecret then refetched
# at its next refresh. Restarts done to "see a new item" turned that into a
# daily loop (30-09 to 03-10). With OnChange a restart or a store change costs
# no item reads.
#
# A new item: create the ExternalSecret; it reads on creation.
# A rotated value: `kubectl annotate externalsecret <name> -n <ns>
# force-sync=$(date +%s) --overwrite` on THAT ExternalSecret (one read). Never
# `rollout restart` the controller and never annotate this store for it.
#
# The cache stays, short: it only dedupes a burst when many ExternalSecrets
# read at once (a policy rollout, a new namespace in a ClusterExternalSecret).
# Its ttl is also how stale a force-sync can be — a cached value is served
# until it expires (absolute ttl, a hit does not renew it) — so it stays well
# under an hour. maxSize 800 covers the 513 remoteRefs with room to grow.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: k8s-pocharlies
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets-operator
          key: token
      cache:
        ttl: 30m
        maxSize: 800
