---
# ClusterSecretStore kubernetes: que `synapse` lea SOLO su clave de productor del núcleo de correo (`correo-core`,
# ns `correo`), SIN pasar por 1Password (patrón kubernetes-control-nexus-pagos).
#
# DGX-880 (P10 de la épica DGX-870, security S20 y S21). `notify_correo` (P11) firma sus llamadas a
# correo.ingest.v1 con una clave PROPIA de ámbitos `ingest:classify` e `ingest:threads` y nada más. k8s-correo-pocharlies
# (P8) la genera en `correo` (`correo-productor-synapse`, clave `password`) y k8s-synapse-pocharlies (P12) la trae a un
# Secret propio del ns `synapse` con este store, fuera de `synapse-secrets`.
#
# El alcance es el mínimo: SOLO `get`, SOLO sobre ese Secret por resourceNames, SOLO para la ServiceAccount de este
# store (`eso-correo-synapse-reader`, ns `synapse`) y ninguna otra. Synapse no lee nada de Hermes (ni su productor ni
# su suscriptor), y los Secrets de Gmail y de APNs, en el mismo ns `correo`, quedan fuera porque no están en
# resourceNames; sin `list` ni `watch`, un nombre que no está aquí ni se puede enumerar. La regla de
# `selfsubjectrulesreviews:create` la exige ESO para validar el store (igual que pagos y cnpg).
#
# `conditions`: un ClusterSecretStore lo puede nombrar un ExternalSecret de cualquier ns. Aquí solo el de `synapse`.
#
# ORDEN DE FUSIÓN: el ns `correo` lo crea la Application `correo` (P9, `managedNamespaceMetadata`), no este repo, y el
# Role y el RoleBinding viven en él. Esta PR se fusiona DESPUÉS del primer sync de esa Application: antes, el Role cae
# en un ns que no existe, la oleada -5 falla y k8s-infra no pasa de ella.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-correo-synapse
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  conditions:
    - namespaces: [synapse]
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-correo-synapse-reader
          namespace: synapse
      remoteNamespace: correo
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: correo
          key: ca.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # antes que el ClusterSecretStore (-4): sin la SA y su RBAC el store no queda sano y ArgoCD no pasa de esa oleada.
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-correo-synapse-reader
  namespace: synapse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-correo-synapse-reader
  namespace: correo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - correo-productor-synapse
    verbs: ["get"]
  # ESO valida el store haciendo un SelfSubjectRulesReview con la SA de arriba
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: eso-correo-synapse-reader
  namespace: correo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-correo-synapse-reader
subjects:
  - kind: ServiceAccount
    name: eso-correo-synapse-reader
    namespace: synapse
