---
# ClusterSecretStore on the in-cluster 1Password Connect server (INFRA-511).
# It reads the same vault as the `onepassword` store (k8s-pocharlies) but
# never spends the account's daily quota: Connect (platform/onepassword-connect)
# serves every read from its local copy, so force-syncs and mass re-reads cost
# nothing.
#
# Reference syntax differs from the onepasswordSDK store:
#   onepassword (SDK)        key: <item>/<field>
#   onepassword-connect      key: <item>   property: <field>
# `dataFrom.extract.key: <item>` is the same in both.
#
# Bootstrap secret, created out of band and NOT in git: the Connect access
# token, ns external-secrets-operator, Secret onepassword-connect-token, key
# token = `op connect token create eso-k8s --server k8s-pocharlies-connect
# --vault k8s-pocharlies`. It is read and write, more than ESO needs (the
# PushSecrets stay on the onepassword store): recreating it read-only is a
# weekly-rotation task. A copy lives in the Private vault as the document
# "1Password Connect k8s-pocharlies-connect - token eso-k8s".
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-connect
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.onepassword-connect.svc.cluster.local:8080
      vaults:
        k8s-pocharlies: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            namespace: external-secrets-operator
            key: token
