# ClusterSecretStore `onepassword-connect`: 1Password leido a traves del 1Password
# Connect Server propio (ns `onepassword-connect`, Deployment en
# platform/onepassword-connect/), NO por el SDK del service account.
#
# Por que existe: la cuenta 1Password es Families — 1.000 peticiones/24 h para
# TODA la cuenta, compartidas con el uso humano del app. El store SDK
# (`cluster-secret-store-onepassword.yaml`) gasta ese cupo en cada lectura y se
# quedo en InvalidProviderConfig al agotarse (03-10-2026). Connect habla con
# 1Password con sus propias credenciales y mantiene cache propio: ESO ya no toca
# el cupo en lecturas. El store `onepassword` sigue aqui hasta P8 (INFRA-511);
# la traduccion del formato SDK a Connect la hace la ClusterPolicy
# `externalsecret-onepassword-connect-translate` (platform/kyverno/policies.yaml,
# P3), transitoria.
#
# Credenciales y token FUERA DE BANDA, nunca en git ni en un ExternalSecret
# (circularidad: Connect no puede aprovisionarse desde 1Password):
#   - Secret `op-credentials` (ns `onepassword-connect`), clave
#     `1password-credentials.json`: credenciales del connect server.
#   - Secret `onepassword-connect-token` (ns `external-secrets-operator`), clave
#     `token`: token de Connect que consume ESO. Se genera en el connect server;
#     si se pierde, se revoca y emite otro desde 1Password (sesion semanal con
#     security) y se recrea este Secret. Restauracion tras reconstruir el
#     cluster: copia en Velero de los dos Secrets (runbook P7).
#
# `vaults: k8s-pocharlies: 1` — el mismo vault que el store SDK. Un store binda
# a un vault; no hace falta un segundo store.
#
# remoteRef en este proveedor usa `key: <item>` + `property: <campo>` (a
# diferencia del SDK, que usa `key: <item>/<campo>` sin property): por eso existe
# la policy de traduccion. Conectar un ES nuevo directamente a este store: usar
# esa sintaxis y `refreshPolicy: OnChange` como en el resto.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-connect
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.onepassword-connect.svc.cluster.local:8080
      vaults:
        k8s-pocharlies: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            namespace: external-secrets-operator
            key: token
