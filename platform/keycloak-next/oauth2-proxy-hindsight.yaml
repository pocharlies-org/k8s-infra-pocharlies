# Proxy SSO DEDICADO para hindsight.e-dani.com (panel de Hindsight, INFRA-942).
#
# Por qué no vale `sso-chain`: el proxy compartido admite /edani-admins y /edani-operators, y operators
# incluye cuentas de QA cuyas credenciales están al alcance de los agentes. El panel no tiene login propio y
# habla con la API con la key del tenant: lee y edita todas las memorias, también las personales. Aquí solo
# entra /edani-admins (security, 18-10-2026). Mismo patrón que oauth2-proxy-chat (docs/sso-por-app.md):
# instancia, cookie host-only y grupos propios. El cliente Keycloak es el mismo `oauth2-proxy`; su comodín
# `https://*.e-dani.com/oauth2/callback` cubre este host sin tocar Keycloak.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-hindsight-config
  namespace: keycloak
  labels:
    app.kubernetes.io/name: oauth2-proxy-hindsight
    app.kubernetes.io/component: forward-auth
data:
  oauth2_proxy.cfg: |
    provider = "keycloak-oidc"
    provider_display_name = "Keycloak"
    oidc_issuer_url = "https://auth-next.e-dani.com/realms/edani"
    skip_oidc_discovery = true
    login_url = "https://auth-next.e-dani.com/realms/edani/protocol/openid-connect/auth"
    redeem_url = "http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/token"
    profile_url = "http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/userinfo"
    validate_url = "http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/userinfo"
    oidc_jwks_url = "http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/certs"
    redirect_url = "https://hindsight.e-dani.com/oauth2/callback"
    scope = "openid email profile"

    reverse_proxy = true
    http_address = "0.0.0.0:4180"
    upstreams = [ "static://202" ]

    # Cookie propia y acotada a este host: no colisiona con `_edani_sso` del
    # proxy compartido ni viaja al resto de subdominios.
    cookie_name = "_hindsight_sso"
    cookie_domains = [ "hindsight.e-dani.com" ]
    cookie_secure = true
    cookie_samesite = "lax"
    # Alineado con el realm edani (20-09): ssoSessionMaxLifespan 365d,
    # ssoSessionIdleTimeout 30d. La cookie no debe caducar antes que la
    # sesión SSO o el PWA de Safari se queda colgado pidiendo login.
    cookie_expire = "8760h"
    cookie_refresh = "1h"

    whitelist_domains = [ "hindsight.e-dani.com" ]
    email_domains = [ "*" ]
    allowed_groups = [ "/edani-admins" ]

    pass_access_token = true
    pass_user_headers = true
    set_authorization_header = true
    set_xauthrequest = true
    skip_provider_button = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-hindsight
  namespace: keycloak
  labels:
    app.kubernetes.io/name: oauth2-proxy-hindsight
    app.kubernetes.io/component: forward-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oauth2-proxy-hindsight
  template:
    metadata:
      labels:
        app: oauth2-proxy-hindsight
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      # Misma política de colocación que oauth2-proxy-skirmshop: fuera de
      # `ubuntu` (nodo x86 de desarrollo, se reinicia sin aviso). Es stateless,
      # así que su sitio es sauvage con ks5 de reserva.
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values: [edge]
              - matchExpressions:
                  - key: node-pool
                    operator: In
                    values: [ks5-nvme]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values: [edge]
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
          args: ["--config=/etc/oauth2-proxy/oauth2_proxy.cfg"]
          envFrom:
            - secretRef:
                name: oauth2-proxy-secrets
          ports:
            - { name: http, containerPort: 4180 }
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy/oauth2_proxy.cfg
              subPath: oauth2_proxy.cfg
              readOnly: true
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap:
            name: oauth2-proxy-hindsight-config
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-hindsight
  namespace: keycloak
  labels:
    app.kubernetes.io/name: oauth2-proxy-hindsight
    app.kubernetes.io/component: forward-auth
spec:
  selector:
    app: oauth2-proxy-hindsight
  ports:
    - { name: http, port: 4180, targetPort: http }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso-hindsight-forward-auth
  namespace: keycloak
  labels:
    app.kubernetes.io/name: oauth2-proxy-hindsight
    app.kubernetes.io/component: forward-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy-hindsight.keycloak.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - Authorization
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Forwarded-User
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso-hindsight-errors
  namespace: keycloak
  labels:
    app.kubernetes.io/name: oauth2-proxy-hindsight
    app.kubernetes.io/component: forward-auth
spec:
  errors:
    status:
      - "401-403"
    service:
      name: oauth2-proxy-hindsight
      port: 4180
    query: /oauth2/sign_in?rd={url}
    statusRewrites:
      "401": 302
      "403": 302
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso-hindsight-chain
  namespace: keycloak
  labels:
    app.kubernetes.io/name: oauth2-proxy-hindsight
    app.kubernetes.io/component: forward-auth
spec:
  chain:
    middlewares:
      - name: sso-hindsight-errors
      - name: sso-hindsight-forward-auth
