# INFRA-1522 (security Request de la sesión tech-lead de INFRA-379): grants the
# realm role `agentgateway-read:photos` (owned by the wave-20 read matrix) to the
# human QA test user `qa-sso-test` (subject 469f01d4-dba3-47e9-857c-13e01be14522)
# so the native app photos-ios can be driven by QA as a second user: the /photos
# route answers 403 without it. qa-sso-test does NOT get photos-confirm-delete:
# the delete gate stays human-only on Dani (architect G1) — QA only proposes.
# Pattern: photos-confirm-delete-grant-daniel-job (OWU-80 single-fact grant).
# Declared in ROLES.yaml and PRINCIPALS.md; until this hook runs,
# keycloak-role-drift reports DRIFT on purpose.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-photos-read-grant-qa
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: photos-read-grant-qa
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Wave 25: single-fact grant tier (after the wave-20 read-grants matrix,
    # which owns the role, and before the wave-26 roles→token smoke). Disjoint
    # fact: a human holder of the route role, never touched by the matrix.
    argocd.argoproj.io/sync-wave: "25"
spec:
  backoffLimit: 1
  # A handful of kcadm calls (resolve user, assert role, read mappings, one
  # write, one post-ensure read). Same production-safe margin as the sibling
  # single-fact grant reconcilers.
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: photos-read-grant-qa
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile-photos-read-grant-qa
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/photos-read-grant-qa.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - { name: KEYCLOAK_URL, value: http://keycloak.keycloak.svc.cluster.local }
            - { name: REALM, value: edani }
            - { name: ROLE_NAME, value: agentgateway-read:photos }
            - { name: USER_ID, value: 469f01d4-dba3-47e9-857c-13e01be14522 }
            - { name: USER_NAME, value: qa-sso-test }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "2", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: bootstrap, mountPath: /opt/bootstrap, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-photos-read-grant-qa
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
