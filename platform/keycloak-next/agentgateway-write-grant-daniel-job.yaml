# OWU-80 (OWU-28 P6): grants the realm role `agentgateway-write` to the human
# user of Daniel (subject e51253a7-c137-4c6c-9fb9-af9cecd3b147, username
# me@e-dani.com) so the 40 GATEWAY_WRITE-gated tools of /chat-atlassian become
# reachable for him. Security ruling: OWU-28 nota-security-owu28.md, condition
# (b) — the merge of this manifest is gated on the OWU-77 ProForma guard being
# merged in k8s-agentgateway-pocharlies and deployed to prod first (the CTO
# governs the order; see the PR body and RUNBOOK section 16).
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-agentgateway-write-grant-daniel
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: agentgateway-write-grant-daniel
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Wave 25: after agentgateway-write-role-job.yaml and
    # agentgateway-read-grants-job.yaml (wave 20), which own the role itself
    # and its service-account grant this hook depends on, and before the
    # roles→token smoke (wave 26). Same-wave as the impersonation grant; the
    # two own disjoint facts.
    argocd.argoproj.io/sync-wave: "25"
spec:
  backoffLimit: 1
  # A handful of kcadm calls (resolve user, assert role, read mappings, one
  # write, one post-ensure read). Same production-safe margin as the sibling
  # single-fact grant reconcilers.
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: agentgateway-write-grant-daniel
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile-write-grant-daniel
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/agentgateway-write-grant-daniel.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - name: MODE
              value: ensure
            - name: KEYCLOAK_URL
              value: http://keycloak.keycloak.svc.cluster.local
            - name: REALM
              value: edani
            - name: ROLE_NAME
              value: agentgateway-write
            - name: USER_ID
              value: e51253a7-c137-4c6c-9fb9-af9cecd3b147
            - name: USER_NAME
              value: me@e-dani.com
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-agentgateway-write-grant-daniel
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-agentgateway-write-grant-daniel-egress
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: agentgateway-write-grant-daniel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agentgateway-write-grant-daniel
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
