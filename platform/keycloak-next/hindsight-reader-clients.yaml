# The three read-only Hindsight identities of SC-4304 S6, reconciled by one
# script with the reviewed role set fixed per CLIENT_ID
# (scripts/hindsight-reader-client.sh):
#   - jarvis-hindsight: agentgateway-read:hindsight-tienda only (voice plane,
#     ns jarvis; security's verdict SC-4304 S6 — bank tienda, never personal,
#     cutover gated on the tienda<->skirmshop parity and on stripping
#     key-bearing URLs from the voice tool results).
#   - synapse-hindsight-tienda: agentgateway-read:hindsight-tienda only
#     (synapse-tools-mcp lookup_supplier_history, tenant skirmshop; cutover
#     gated on supplier invoices landing in the bank).
#   - socialmedia-hindsight: agentgateway-read:hindsight-personal only
#     (whatsappmcp mcp-server, ns whatsapp-mcp; semantic search over the
#     conversation memory it already retains into that bank).
# One principal per (service, bank): a leaked credential opens exactly one
# bank. Same hardening as hermes-enviar and correo-agente: GitOps-declared,
# service account only, fullScopeAllowed=false, audience mcp.lan.e-dani.com,
# exact token verified. No ExternalSecret here: Keycloak generates each secret
# and security copies it to the 1Password item agentgateway-prod after the
# first sync (RUNBOOK section 22); consumers read it from 1Password through
# their own ExternalSecrets.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-jarvis-hindsight-client
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: jarvis-hindsight-client
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # After the read-grants hook (20) that owns the role and its holder
    # allowlist; same wave as jarvis-echo, hermes-enviar and correo-agente,
    # which reconcile other clients and share no state with this one.
    argocd.argoproj.io/sync-wave: "24"
spec:
  backoffLimit: 1
  # One role to map and one mint to verify — far below the measured heavy
  # case (chat client, 701 s with six roles). Same 1800 s budget as the other
  # scoped-client hooks.
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: jarvis-hindsight-client
        # Reuses the Keycloak+DNS-only egress policy declared in
        # synapse-sre-client.yaml (keycloak-synapse-agent-clients-egress).
        synapse.e-dani.com/agentgateway-m2m-client: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector:
        node-pool: ks5-nvme
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: reconcile-client
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/hindsight-reader-client.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - { name: MODE, value: ensure }
            - { name: KEYCLOAK_URL, value: http://keycloak.keycloak.svc.cluster.local }
            - { name: REALM, value: edani }
            - { name: CLIENT_ID, value: jarvis-hindsight }
            - { name: AGENTGATEWAY_AUDIENCE, value: mcp.lan.e-dani.com }
            - { name: MAPPER_NAME, value: aud-mcp }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: bootstrap, mountPath: /opt/bootstrap, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-hindsight-reader-client
            defaultMode: 0555
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
