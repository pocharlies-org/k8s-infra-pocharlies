# INFRA-248 (INFRA-219 P2, C2): read-only smoke of the roles→token path of the
# AgentGateway clients. Mints chat-agentgateway, company-metrics-agentgateway
# and the role-less negative cloudblue; checks agentgateway-mcp,
# openclaw-readonly-agentgateway (whose tokens read-grants already mints in
# wave 20, ruling C-5) and the public agentgateway-social-mcp by config. It
# never mutates the realm and prints role names only. Evidence for qa:
#   kubectl logs -n keycloak job/keycloak-agentgateway-token-smoke
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-agentgateway-token-smoke
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: agentgateway-token-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Last wave: it reads what every identity reconciler (waves 19-25) left in
    # the realm, and a failed smoke can never hold a reconciler back.
    argocd.argoproj.io/sync-wave: "26"
spec:
  backoffLimit: 0
  # ~40 sequential kcadm calls (one JVM each, ~4s at the 500m limit measured
  # for read-grants on 2026-09-12) plus three mints: ~3 min expected.
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: agentgateway-token-smoke
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector:
        node-pool: ks5-nvme
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: token-smoke
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/agentgateway-token-smoke.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - { name: KEYCLOAK_URL, value: http://keycloak.keycloak.svc.cluster.local }
            - { name: REALM, value: edani }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: bootstrap, mountPath: /opt/bootstrap, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-agentgateway-token-smoke
            defaultMode: 0555
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-agentgateway-token-smoke-egress
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: agentgateway-token-smoke
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agentgateway-token-smoke
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: keycloak } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
