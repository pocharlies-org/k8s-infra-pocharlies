# Manual state rollback (OWU-28 historia g). This file is intentionally
# excluded from kustomization. It removes ONLY the fixture user's direct
# mapping of agentgateway-write and DISABLES the user; the role itself, the
# service-account grant and Daniel's grant are left untouched (unlike
# manual/agentgateway-write-role-rollback-job.yaml, which deletes the role
# and therefore refuses to run while this fixture mapping exists). Deleting
# the user is not a rollback: it is the CTO's decision (PRINCIPALS.md).
# To restore the fixture afterwards, git revert the commit owning this
# reconciler and let the next PostSync re-apply it. See RUNBOOK section 17.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-agentgateway-write-fixture-user-rollback
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: agentgateway-write-fixture-user
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: agentgateway-write-fixture-user
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollback-write-fixture-user
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/agentgateway-write-fixture-user.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - name: MODE
              value: rollback
            - name: KEYCLOAK_URL
              value: http://keycloak.keycloak.svc.cluster.local
            - name: REALM
              value: edani
            - name: ROLE_NAME
              value: agentgateway-write
            - name: USERNAME
              value: qa-write-sin-vinculo@e-dani.com
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-agentgateway-write-fixture-user
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
