# Manual state rollback. This file is intentionally excluded from kustomization.
# It removes ONLY the admin-keycloack-server service account's impersonation
# mapping; the built-in realm-management role and every other holder are left
# untouched. To restore the grant, git revert the commit owning this reconciler
# and let the next PostSync re-apply it.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-admin-keycloack-impersonation-grant-rollback
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: admin-keycloack-impersonation-grant
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: admin-keycloack-impersonation-grant
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollback-impersonation-grant
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/admin-keycloack-impersonation-grant.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - name: MODE
              value: rollback
            - name: KEYCLOAK_URL
              value: http://keycloak.keycloak.svc.cluster.local
            - name: REALM
              value: edani
            - name: CLIENT_ID
              value: admin-keycloack-server
            - name: MAPPING_CLIENT
              value: realm-management
            - name: ROLE_NAME
              value: impersonation
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-admin-keycloack-impersonation-grant
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
