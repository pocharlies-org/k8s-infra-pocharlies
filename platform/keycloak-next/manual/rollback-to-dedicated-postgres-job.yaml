# Explicit reverse migration for the rollback window ending 2026-08-25.
# Intentionally excluded from Kustomize. Stop Keycloak before applying it.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-rollback-to-dedicated-postgres
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: database-rollback
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: database-rollback
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        fsGroup: 26
      containers:
        - name: rollback
          image: ghcr.io/cloudnative-pg/postgresql:17.5
          imagePullPolicy: IfNotPresent
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgres-app
                  key: password
            - name: PGDATABASE
              value: keycloak
            - name: SOURCE_HOST
              value: postgres-shared-rw.databases.svc.cluster.local
            - name: TARGET_HOST
              value: keycloak-postgres-rw.keycloak.svc.cluster.local
          command:
            - bash
            - -ec
            - |
              set -euo pipefail

              pg_isready -h "${SOURCE_HOST}" -t 30
              pg_isready -h "${TARGET_HOST}" -t 30
              pg_dump \
                -h "${SOURCE_HOST}" \
                --format=custom \
                --no-owner \
                --no-privileges \
                --file=/work/keycloak.dump
              pg_restore --list /work/keycloak.dump >/dev/null
              pg_restore \
                -h "${TARGET_HOST}" \
                --clean \
                --if-exists \
                --no-owner \
                --no-privileges \
                --exit-on-error \
                --dbname=keycloak \
                /work/keycloak.dump

              source_counts="$(psql -h "${SOURCE_HOST}" -Atc "select count(*) from pg_tables where schemaname='public'; select count(*) from realm; select count(*) from user_entity; select count(*) from client; select count(*) from offline_user_session; select count(*) from databasechangelog")"
              target_counts="$(psql -h "${TARGET_HOST}" -Atc "select count(*) from pg_tables where schemaname='public'; select count(*) from realm; select count(*) from user_entity; select count(*) from client; select count(*) from offline_user_session; select count(*) from databasechangelog")"
              [ "${source_counts}" = "${target_counts}" ] || {
                echo "ERROR: source and rollback target validation counts differ" >&2
                exit 1
              }

              printf '{"source":"databases/postgres-shared/keycloak","target":"keycloak/keycloak-postgres","tables":%s,"realms":%s,"users":%s,"clients":%s,"offline_sessions":%s,"changelog_rows":%s,"validated":true}\n' \
                $(printf '%s\n' "${target_counts}")
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 1Gi
