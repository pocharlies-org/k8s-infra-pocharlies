# Emergency rollback, deliberately excluded from kustomization.yaml. Deletes
# the hermes-enviar client (and with it its service account and both reviewed
# grants). Both roles are retained: agentgateway-write:workspace-envio is owned
# by agentgateway-domain-roles-job.yaml and agentgateway-read:workspace by
# agentgateway-read-grants-job.yaml (which keeps its other reviewed holders),
# and the AgentGateway policy references them. Run this only together with
# removing the entry from PRINCIPALS.md and the grantees from ROLES.yaml in
# the same PR (INFRA-219 rule). The 1Password item hermes-kc-enviar is not
# touched: retiring a credential is filed for the weekly rotation session.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-hermes-enviar-client-rollback
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: hermes-enviar-client-rollback
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: hermes-enviar-client-rollback
        synapse.e-dani.com/agentgateway-m2m-client: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector: { node-pool: ks5-nvme }
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rollback-client
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          command: ["/bin/sh", "/opt/bootstrap/hermes-enviar-client.sh"]
          envFrom:
            - secretRef: { name: keycloak-bootstrap }
          env:
            - { name: MODE, value: rollback }
            - { name: KEYCLOAK_URL, value: http://keycloak.keycloak.svc.cluster.local }
            - { name: CLIENT_ID, value: hermes-enviar }
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: bootstrap, mountPath: /opt/bootstrap, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-hermes-enviar-client
            defaultMode: 0555
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
