# Manual state rollback (INFRA-45). This file is intentionally excluded from
# kustomization. Follow RUNBOOK.md section 11: only run during an authorized
# incident while the versioned ConfigMap still exists.
#
# It sets fullScopeAllowed=true back on the agentgateway-mcp client and
# verifies a freshly minted token stays inside the reviewed matrix
# (agentgateway-write plus the 21 read roles; agentgateway-write alone is
# accepted if the read grants were already rolled back).
#
# Rollback honesty: git revert alone does NOT restore this flag — Keycloak
# state is not versioned, and the PostSync hook re-asserts
# fullScopeAllowed=false on every sync of a revision that contains the
# reconciler. Run this Job AND revert the INFRA-45 commit; until the revert
# syncs, the next PostSync will flip the flag back to false. The Job carries
# no ArgoCD hook annotation on purpose: it is applied by hand, never by a
# sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-agentgateway-fullscope-rollback
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: agentgateway-read-grants
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: agentgateway-read-grants
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollback-fullscope
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/agentgateway-read-grants.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - name: MODE
              value: fullscope-rollback
            - name: KEYCLOAK_URL
              value: http://keycloak.keycloak.svc.cluster.local
            - name: REALM
              value: edani
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-agentgateway-read-grants
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
