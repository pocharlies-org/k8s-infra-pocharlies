# One-shot migration used on 2026-08-11. Intentionally excluded from Kustomize.
# Preconditions: Keycloak Deployment at 0 replicas and an empty keycloak database
# owned by role keycloak in databases/postgres-shared.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-to-shared-postgres-20260811
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        fsGroup: 26
      containers:
        - name: migrate
          image: ghcr.io/cloudnative-pg/postgresql:17.5
          imagePullPolicy: IfNotPresent
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgres-app
                  key: password
            - name: PGDATABASE
              value: keycloak
            - name: SOURCE_HOST
              value: keycloak-postgres-rw.keycloak.svc.cluster.local
            - name: TARGET_HOST
              value: postgres-shared-rw.databases.svc.cluster.local
          command:
            - bash
            - -ec
            - |
              set -euo pipefail

              pg_isready -h "${SOURCE_HOST}" -t 30
              pg_isready -h "${TARGET_HOST}" -t 30

              source_tables="$(psql -h "${SOURCE_HOST}" -Atc "select count(*) from pg_tables where schemaname='public'")"
              target_tables="$(psql -h "${TARGET_HOST}" -Atc "select count(*) from pg_tables where schemaname='public'")"
              [ "${source_tables}" -gt 0 ]
              [ "${target_tables}" -eq 0 ] || {
                echo "ERROR: target database is not empty (${target_tables} tables)" >&2
                exit 1
              }

              pg_dump \
                -h "${SOURCE_HOST}" \
                --format=custom \
                --no-owner \
                --no-privileges \
                --file=/work/keycloak.dump
              pg_restore --list /work/keycloak.dump >/dev/null
              pg_restore \
                -h "${TARGET_HOST}" \
                --no-owner \
                --no-privileges \
                --exit-on-error \
                --dbname=keycloak \
                /work/keycloak.dump

              source_counts="$(psql -h "${SOURCE_HOST}" -Atc "select count(*) from pg_tables where schemaname='public'; select count(*) from realm; select count(*) from user_entity; select count(*) from client; select count(*) from offline_user_session; select count(*) from databasechangelog")"
              target_counts="$(psql -h "${TARGET_HOST}" -Atc "select count(*) from pg_tables where schemaname='public'; select count(*) from realm; select count(*) from user_entity; select count(*) from client; select count(*) from offline_user_session; select count(*) from databasechangelog")"
              [ "${source_counts}" = "${target_counts}" ] || {
                echo "ERROR: source and target validation counts differ" >&2
                exit 1
              }

              dump_sha256="$(sha256sum /work/keycloak.dump | awk '{print $1}')"
              dump_bytes="$(stat -c %s /work/keycloak.dump)"
              printf '{"source":"keycloak/keycloak-postgres","target":"databases/postgres-shared/keycloak","tables":%s,"realms":%s,"users":%s,"clients":%s,"offline_sessions":%s,"changelog_rows":%s,"dump_bytes":%s,"dump_sha256":"%s","validated":true}\n' \
                $(printf '%s\n' "${target_counts}") "${dump_bytes}" "${dump_sha256}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 1Gi
