# Manual state rollback. This file is intentionally excluded from kustomization.
# It removes ONLY the pinned human user's direct mapping of photos-confirm-delete
# (the human half of the INFRA-402 delete gate); the role itself and every other
# holder are left untouched (ROLES.yaml: ninguna entrada se borra). To restore
# the grant afterwards, git revert the commit owning this reconciler and let the
# next PostSync re-apply it. See RUNBOOK section 21.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-photos-confirm-delete-grant-daniel-rollback
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: photos-confirm-delete-grant-daniel
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: photos-confirm-delete-grant-daniel
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollback-photos-confirm-delete-grant-daniel
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/photos-confirm-delete-grant-daniel.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - name: MODE
              value: rollback
            - name: KEYCLOAK_URL
              value: http://keycloak.keycloak.svc.cluster.local
            - name: REALM
              value: edani
            - name: ROLE_NAME
              value: photos-confirm-delete
            - name: USER_ID
              value: e51253a7-c137-4c6c-9fb9-af9cecd3b147
            - name: USER_NAME
              value: me@e-dani.com
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-photos-confirm-delete-grant-daniel
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
