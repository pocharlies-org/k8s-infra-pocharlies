# INFRA-402 (epic INFRA-379, architect ruling G1): creates the realm role
# `photos-confirm-delete` (the human half of the photos delete gate) and grants
# it to the human user of Daniel (subject e51253a7-c137-4c6c-9fb9-af9cecd3b147,
# username me@e-dani.com) — the only principal that can EXECUTE a photos_delete
# proposal on the /photos route. Pattern: agentgateway-write-grant-daniel-job
# (OWU-80). Declared in ROLES.yaml; until this hook runs, keycloak-role-drift
# reports DRIFT on purpose.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-photos-confirm-delete-grant-daniel
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: photos-confirm-delete-grant-daniel
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Wave 25: same single-fact grant tier as agentgateway-write-grant-daniel
    # (after the wave-20 read-grants matrix, which owns the route role
    # agentgateway-read:photos, and before the roles→token smoke of wave 26).
    # This hook owns a disjoint fact: the human delete role, never in the
    # shared-plane matrix.
    argocd.argoproj.io/sync-wave: "25"
spec:
  backoffLimit: 1
  # A handful of kcadm calls (resolve user, create/assert role, read mappings,
  # one write, one post-ensure read). Same production-safe margin as the
  # sibling single-fact grant reconcilers.
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: photos-confirm-delete-grant-daniel
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile-photos-confirm-delete-grant-daniel
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/photos-confirm-delete-grant-daniel.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - { name: KEYCLOAK_URL, value: http://keycloak.keycloak.svc.cluster.local }
            - { name: REALM, value: edani }
            - { name: ROLE_NAME, value: photos-confirm-delete }
            - { name: USER_ID, value: e51253a7-c137-4c6c-9fb9-af9cecd3b147 }
            - { name: USER_NAME, value: me@e-dani.com }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "2", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: bootstrap, mountPath: /opt/bootstrap, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-photos-confirm-delete-grant-daniel
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-photos-confirm-delete-grant-daniel-egress
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: photos-confirm-delete-grant-daniel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: photos-confirm-delete-grant-daniel
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
