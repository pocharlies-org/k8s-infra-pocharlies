apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-agentgateway-read-grants
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: agentgateway-read-grants
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Must complete before the openclaw-readonly reconciler (wave 21), whose
    # minted-token assertion expects the six read roles to already travel in
    # that client's tokens.
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 1
  # kcadm starts a JVM for every admin request. The steady-state reconcile
  # issues ~165 sequential calls for the 21-role matrix plus two token mints:
  # measured ~630s to the mint path at the 500m CPU limit on 2026-09-12
  # (INFRA-44), which blew through the previous 900s budget (first attempt:
  # DeadlineExceeded). 1800s keeps ~2.9x margin over the measurement. Raising
  # the CPU limit instead has no precedent here — every PostSync reconciler in
  # this repo is 50m/500m — and the deadline is the free lever for a hook with
  # ttlSecondsAfterFinished and BeforeHookCreation.
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: agentgateway-read-grants
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: reconcile-read-grants
          image: quay.io/keycloak/keycloak:26.6.2@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/bootstrap/agentgateway-read-grants.sh"]
          envFrom:
            - secretRef:
                name: keycloak-bootstrap
          env:
            - { name: KEYCLOAK_URL, value: http://keycloak.keycloak.svc.cluster.local }
            - { name: REALM, value: edani }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: bootstrap, mountPath: /opt/bootstrap, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bootstrap
          configMap:
            name: keycloak-agentgateway-read-grants
            defaultMode: 0555
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-agentgateway-read-grants-egress
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: agentgateway-read-grants
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agentgateway-read-grants
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: keycloak } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
