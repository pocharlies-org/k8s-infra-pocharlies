apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - namespace.yaml
  - database.yaml
  - keycloak.yaml
  - oauth2-proxy.yaml
  - oauth2-proxy-skirmshop.yaml
  - oauth2-proxy-openclaw-readonly.yaml
  - oauth2-proxy-chat.yaml
  - oauth2-proxy-skirmbooks.yaml
  - skirmbooks-sso.yaml
  - oauth2-proxy-messages.yaml
  - dgx-messages-client.yaml
  - routing.yaml
  - agentgateway-write-role-job.yaml
  - openclaw-readonly-clients.yaml
  - synapse-sre-client.yaml
  - agentgateway-domain-roles-job.yaml
  - chat-agentgateway-client.yaml
  - agentgateway-read-grants-job.yaml
  - agentgateway-social-mcp-client.yaml
  - agentgateway-mcp-token-ttl-job.yaml
  - admin-keycloack-impersonation-grant-job.yaml
  - agentgateway-write-grant-daniel-job.yaml
  - agentgateway-token-smoke-job.yaml
  - keycloak-rbac-auditor-client.yaml
  - keycloak-role-drift-cron.yaml
configMapGenerator:
  - name: keycloak-agentgateway-write-role
    files:
      - agentgateway-write-role.sh=scripts/agentgateway-write-role.sh
  - name: keycloak-openclaw-readonly-clients
    files:
      - openclaw-readonly-clients.sh=scripts/openclaw-readonly-clients.sh
  - name: keycloak-synapse-sre-client
    files:
      - synapse-sre-client.sh=scripts/synapse-sre-client.sh
  - name: keycloak-agentgateway-domain-roles
    files:
      - agentgateway-domain-roles.sh=scripts/agentgateway-domain-roles.sh
    options:
      labels:
        app.kubernetes.io/component: agentgateway-domain-roles
  - name: keycloak-chat-agentgateway-client
    files:
      - chat-agentgateway-client.sh=scripts/chat-agentgateway-client.sh
  - name: keycloak-agentgateway-read-grants
    files:
      - agentgateway-read-grants.sh=scripts/agentgateway-read-grants.sh
    options:
      labels:
        app.kubernetes.io/component: agentgateway-read-grants
  - name: keycloak-agentgateway-social-mcp-client
    files:
      - agentgateway-social-mcp-client.sh=scripts/agentgateway-social-mcp-client.sh
    options:
      labels:
        app.kubernetes.io/component: agentgateway-social-mcp-client
  - name: keycloak-agentgateway-mcp-token-ttl
    files:
      - agentgateway-mcp-token-ttl.sh=scripts/agentgateway-mcp-token-ttl.sh
    options:
      labels:
        app.kubernetes.io/component: agentgateway-mcp-token-ttl
  - name: keycloak-admin-keycloack-impersonation-grant
    files:
      - admin-keycloack-impersonation-grant.sh=scripts/admin-keycloack-impersonation-grant.sh
    options:
      labels:
        app.kubernetes.io/component: admin-keycloack-impersonation-grant
  - name: keycloak-agentgateway-write-grant-daniel
    files:
      - agentgateway-write-grant-daniel.sh=scripts/agentgateway-write-grant-daniel.sh
    options:
      labels:
        app.kubernetes.io/component: agentgateway-write-grant-daniel
  - name: keycloak-agentgateway-token-smoke
    files:
      - agentgateway-token-smoke.sh=scripts/agentgateway-token-smoke.sh
    options:
      labels:
        app.kubernetes.io/component: agentgateway-token-smoke
  - name: keycloak-skirmbooks-sso
    files:
      - skirmbooks-sso.sh=scripts/skirmbooks-sso.sh
    options:
      labels:
        app.kubernetes.io/component: skirmbooks-sso
  - name: keycloak-dgx-messages-client
    files:
      - dgx-messages-client.sh=scripts/dgx-messages-client.sh
    options:
      labels:
        app.kubernetes.io/component: dgx-messages-client
  - name: keycloak-rbac-auditor-client
    files:
      - keycloak-rbac-auditor-client.sh=scripts/keycloak-rbac-auditor-client.sh
    options:
      labels:
        app.kubernetes.io/component: keycloak-rbac-auditor-client
  - name: keycloak-role-drift
    files:
      - keycloak-role-drift.sh=scripts/keycloak-role-drift.sh
      - kc_rbac.py=scripts/kc_rbac.py
      - verify-role-catalog.py=scripts/verify-role-catalog.py
      - verify-principals.py=scripts/verify-principals.py
      - ROLES.yaml
      - PRINCIPALS.md
    options:
      labels:
        app.kubernetes.io/component: keycloak-role-drift
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: keycloak
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: auth-migration
      app.kubernetes.io/managed-by: argocd
