---
# Credenciales S3 del destino de backups de Velero (INFRA-1175). Velero deja de escribir
# en la MinIO de sauvage --RAID1 de HDDs sin margen de IOPS, es la causa de los cortes
# nocturnos de INFRA-1091-- y pasa a Object Storage de OVH (region sbg), el mismo almacen
# al que se corto el registry de Harbor en INFRA-482.
#
# El secret viejo (`velero-minio-creds`) se aplico a mano: no tenia ownerRef ni
# ExternalSecret detras, asi que ninguna rotacion lo alcanzaba. Este SI lo materializa el
# ExternalSecret, y con nombre nuevo a proposito: un corte no debe depender de reescribir
# un secret huerfano mientras el pod lo esta usando.
#
# Rotar = crear credenciales nuevas para el usuario S3 `k8s-objectstore` en el manager de
# OVH, actualizar el item y reiniciar velero (lee el fichero `cloud` en el arranque).
#
# 1Password item (vault k8s-pocharlies):
#   ovh-object-storage-s3
#     access_key / secret_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-ovh-credentials
  namespace: velero
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: backup-credentials
    security.e-dani.com/rotation-class: object-storage
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: velero-ovh-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Formato que espera el plugin aws de Velero (AWS SDK shared credentials file).
        cloud: |
          [default]
          aws_access_key_id = {{ .accessKey }}
          aws_secret_access_key = {{ .secretKey }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: ovh-object-storage-s3
        property: access_key
    - secretKey: secretKey
      remoteRef:
        key: ovh-object-storage-s3
        property: secret_key
