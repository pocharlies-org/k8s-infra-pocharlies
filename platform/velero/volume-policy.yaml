apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-fsb-volume-policy
  namespace: velero
data:
  policies.yaml: |
    version: v1
    volumePolicies:
      # emptyDir is recreated empty with the Pod and has no durable DR value.
      # Keep the schedule in opt-out FSB mode so every mounted PVC that does
      # not match this rule remains protected without per-workload annotations.
      - conditions:
          volumeTypes:
            - emptyDir
        action:
          type: skip
      # CNPG volumes are backed up by CNPG itself, not by Velero: barman does a
      # daily base backup plus continuous WAL archiving to
      # s3://cnpg-backups-pocharlies (OVH, INFRA-1175),
      # which is a real PITR. A Velero file-system backup of a running Postgres
      # is only crash-consistent — no checkpoint or fsfreeze coordination — so
      # it would cost ~32 GiB nightly to produce something strictly worse than
      # what already exists. The `databases` namespace is in daily-critical for
      # its MANIFESTS (Cluster CR, secrets, ScheduledBackup): without them the
      # data is safe but there is nothing to restore it INTO.
      - conditions:
          pvcLabels:
            app.kubernetes.io/managed-by: cloudnative-pg
        action:
          type: skip
      # INFRA-993 (Dani, 26-10): metricas, logs y trazas NO llevan backup: se
      # regeneran o no merece la pena restaurarlas. VictoriaMetrics (~55 GB por
      # copia), Loki y Langfuse (ClickHouse ~11 GB). Mismo criterio en Longhorn:
      # dgx-infra k8s/backup/longhorn-recurring.
      - conditions:
          pvcLabels:
            app.kubernetes.io/name: vmsingle
        action:
          type: skip
      - conditions:
          pvcLabels:
            app.kubernetes.io/name: loki
        action:
          type: skip
      - conditions:
          pvcLabels:
            app.kubernetes.io/instance: langfuse
        action:
          type: skip
      - conditions:
          pvcLabels:
            app: langfuse-events-minio
        action:
          type: skip
      # INFRA-1222 (Dani, 09-11): el mismo criterio para el resto que no es dato
      # único. Se salta la COPIA DE CONTENIDO, no el manifiesto: estos namespaces
      # siguen en su schedule, así que si algo revienta hay dónde restaurar la
      # config. Criterio: si se pierde y no pasa nada, o se regenera solo, fuera.
      # Medido en velero-backups-pocharlies (09-11): 600,1 GiB, de los que 599,8
      # GiB son `kopia/` (contenido de PVCs) y solo 358 MiB los tarballs de
      # manifiestos.
      # `conditions` se decodifica contra `volumeConditions` de velero v1.18: valen
      # `volumeTypes`, `pvcLabels` y `capacity` (existe: rechaza `1Gi` con `wrong
      # format of Capacity 1Gi`, o sea que la parsea). Tiran el ConfigMap entero,
      # con `field X not found in type resourcepolicies.volumeCondition`, `pvcName`,
      # `usedByPods`, `csiDrivers` y `pvCFolumeAttributes` (probado 09-11 y 10-11 con
      # un Backup CR de prueba). Un CM inválido rompe TODAS las schedules (vivas: 5),
      # así que lo que no lleva etiqueta no se salta aquí: primero se etiqueta en su
      # propio repo. Y `volumeTypes` no sirve para nombrar un caso concreto: `[nfs]`
      # barrería los 18 PV de origen nfs del cluster, incluidos las voces entrenadas
      # y los LoRA de `llm`, que se copian a propósito.
      #   aiops ~138 GiB: qdrant + falkordb, analítica derivada de lo que ya sale
      #   de VictoriaMetrics y de loki (24 h). No hay nada que restaurar aquí.
      - conditions:
          pvcLabels:
            app: aiops-qdrant-ks5
        action:
          type: skip
      - conditions:
          pvcLabels:
            app: aiops-falkordb-ks5
        action:
          type: skip
      #   buildkit ~31 GiB: caché de compilación (INFRA-953 es esta misma caché
      #   llenándose y el GC sin liberar). No es dato.
      - conditions:
          pvcLabels:
            app: buildkitd
        action:
          type: skip
      #   nfs-provisioner ~103 GiB: el export es EL CONTENIDO de los PVCs de otros
      #   namespaces, que ya se copian cada uno por su cuenta. Recursión pura. La
      #   etiqueta solo la lleva el PVC del propio servidor (1 en todo el cluster).
      - conditions:
          pvcLabels:
            app: nfs-subdir-external-provisioner
        action:
          type: skip
      #   backup-hub ~25 GiB: skirmshop-drive-mirror es copia de un bucket de OVH.
      #   Backup de un backup.
      - conditions:
          pvcLabels:
            app.kubernetes.io/name: skirmshop-drive-mirror
        action:
          type: skip
      #   monitoring que INFRA-993 dejó fuera por ser de otro chart: grafana (los
      #   dashboards viven en este repo) y vmsingle-rca (métricas derivadas).
      - conditions:
          pvcLabels:
            app.kubernetes.io/name: grafana
        action:
          type: skip
      - conditions:
          pvcLabels:
            app.kubernetes.io/name: vmsingle-rca
        action:
          type: skip
      #   harbor: la base de datos de vulnerabilidades de trivy es caché
      #   descargable. La base de datos de harbor (usuarios, proyectos, robot
      #   accounts) sigue copiándose.
      - conditions:
          pvcLabels:
            component: trivy
        action:
          type: skip
      #   pesos de modelo que sí llevan etiqueta: se vuelven a bajar. Se quedan
      #   fuera de esta lista, a propósito, las dos cachés grandes sin etiquetas
      #   (hf-cache-nvidia-dgx-ro y hf-cache-dgx1-dgx3-llm-ro, ReadOnlyMany de 512
      #   Gi) y todo lo que comparte etiqueta con algo irrepetible: `app:
      #   omnivoice-tts-dgx2` es a la vez omnivoice-model (descargable) y
      #   omnivoice-voices / omnivoice-voices-nfs (voces entrenadas), así que no se
      #   salta ninguna de las tres. voicelab-data, omnivoice-models-lora y
      #   sugiere-auditoria se siguen copiando: irrepetibles.
      - conditions:
          pvcLabels:
            app: ollaya
        action:
          type: skip
      - conditions:
          pvcLabels:
            app: bge
        action:
          type: skip
      - conditions:
          pvcLabels:
            app: stt-turbo
        action:
          type: skip
      - conditions:
          pvcLabels:
            app: gliner2-extract
        action:
          type: skip
      #   restore-drill: lo que mide la copia semanal. `weekly-all-20261108050009`
      #   movió 11 volúmenes / ~12,2 GiB, y 12,2 GiB de ellos son los PVCs del
      #   taladro de restauración (drill-source 4,4 GiB + drill-restored-c/-d
      #   2,6 GiB cada uno): dato que el propio taladro vuelve a crear restaurando
      #   una copia. Es copia de una copia. `drill-restored` y `drill-restored-b`
      #   no llevan etiqueta, así que se siguen copiando (fail-closed).
      - conditions:
          pvcLabels:
            app.kubernetes.io/name: sc80-restore-drill
        action:
          type: skip
      - conditions:
          pvcLabels:
            app.kubernetes.io/name: drill-restore
        action:
          type: skip
