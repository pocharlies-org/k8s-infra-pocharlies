---
# Daily backup of all critical stateful + admin namespaces
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-critical
  namespace: velero
spec:
  schedule: "0 3 * * *"   # 03:00 UTC daily
  template:
    ttl: 168h0m0s   # 7 days retention
    includedNamespaces:
      - harbor
      - argocd
      - longhorn-system
      - cert-manager
      - external-secrets-operator
      - external-dns
      - monitoring
      - minio
      - metallb-system
      - traefik-lan
      - kube-system
      # Absorbed from daily-x86-critical, retired 2026-08-11. That schedule
      # protected this same list plus backup-hub, but wrote to the
      # x86-backup-minio BSL -- which despite the name is also on sauvage,
      # on the same /dev/md3 array as this one. Two copies on one array is
      # not redundancy, just ~153 GiB of it.
      - backup-hub
      # Added 2026-08-13 for its MANIFESTS, not its volumes. The data is
      # already protected by CNPG barman (PITR) and the nightly logical dumps,
      # but nothing was backing up the Cluster CR, its secrets or the
      # ScheduledBackup -- so a namespace loss left the data intact with no
      # definition to restore it into. The CNPG PVCs are skipped by
      # volume-policy.yaml (pvcLabels app.kubernetes.io/managed-by=cloudnative-pg).
      - databases
    snapshotMoveData: true
    defaultVolumesToFsBackup: true
    resourcePolicy:
      kind: ConfigMap
      name: velero-fsb-volume-policy
    storageLocation: default
    volumeSnapshotLocations:
      - default
---
# Daily backup of the AlphaLink WordPress (ns alphalink: MySQL, wp-content and
# the nightly mysqldump PVC). Its volumes are local-path on the droplet node
# `alphalink`; without this the only copies lived on that same disk. 03:15 UTC,
# after the in-namespace dump (01:15 Madrid), after daily-critical.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-alphalink
  namespace: velero
spec:
  schedule: "15 3 * * *"   # 03:15 UTC daily
  template:
    ttl: 168h0m0s   # 7 days retention
    includedNamespaces:
      - alphalink
    snapshotMoveData: true
    defaultVolumesToFsBackup: true
    resourcePolicy:
      kind: ConfigMap
      name: velero-fsb-volume-policy
    storageLocation: default
    volumeSnapshotLocations:
      - default
---
# Weekly backup of everything else (apps, etc.)
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-all
  namespace: velero
spec:
  schedule: "0 5 * * 0"   # Sunday 05:00 UTC
  template:
    ttl: 336h0m0s   # 14 days retention
    includeClusterResources: true
    excludedNamespaces:
      - velero
      - kube-public
      - kube-node-lease
    snapshotMoveData: true
    defaultVolumesToFsBackup: true
    resourcePolicy:
      kind: ConfigMap
      name: velero-fsb-volume-policy
    storageLocation: default
    volumeSnapshotLocations:
      - default
