# 1Password Connect Server: el servidor intermedio por el que External Secrets
# Operator lee 1Password SIN pasar por el SDK del service account (INFRA-511).
# El store `onepassword` (SDK) gasta el cupo de 1.000 peticiones/24 h de la cuenta
# Families en cada lectura; Connect mantiene su propio cache y consume el token
# una vez por sesion. Adoptado de lo vivo (INFRA-513) sin recrearlo: `prune: false`
# en la Application `k8s-infra` hace que este manifiesto adopte los recursos que
# ya corren; no debe provocar reinicio del pod al sincronizar.
#
# Credenciales y token FUERA DE BANDA (circularidad: Connect no puede leerse a si
# mismo desde 1Password). NO van en git ni en un ExternalSecret:
#   - Secret `op-credentials` (ns `onepassword-connect`), clave
#     `1password-credentials.json`: las credenciales del connect server.
#   - Secret `onepassword-connect-token` (ns `external-secrets-operator`), clave
#     `token`: el token de acceso de Connect que consume ESO (store
#     `onepassword-connect`).
# Su restauracion y rotacion: runbook de P7 (INFRA-511) y sesion semanal con
# security. Copia de seguridad: Velero de los dos Secrets.
---
apiVersion: v1
kind: Namespace
metadata:
  name: onepassword-connect
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepassword-connect
  namespace: onepassword-connect
  labels:
    app.kubernetes.io/name: onepassword-connect
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onepassword-connect
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: onepassword-connect
        app.kubernetes.io/name: onepassword-connect
    spec:
      nodeSelector:
        node-pool: ks5-nvme
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect-api
          image: harbor.lan.e-dani.com/homelab/onepassword-connect-api:1.8.2@sha256:e915c0c843972f02b0e7e2de502bda8bd4a092288b3f1866098a857bd715a281
          imagePullPolicy: IfNotPresent
          ports:
            - name: connect-api
              containerPort: 8080
          env:
            - name: OP_SESSION
              value: /home/opuser/.op/1password-credentials.json
            - name: OP_BUS_PORT
              value: "11220"
            - name: OP_BUS_PEERS
              value: localhost:11221
            - name: OP_HTTP_PORT
              value: "8080"
            - name: OP_LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared-data
              mountPath: /home/opuser/.op/data
            - name: credentials
              mountPath: /home/opuser/.op/1password-credentials.json
              subPath: 1password-credentials.json
        - name: connect-sync
          image: harbor.lan.e-dani.com/homelab/onepassword-connect-sync:1.8.2@sha256:6297ca6136c0f0fb096bc64c49e1bc8df2aab35282ebff8c7bb60745ef176d0d
          imagePullPolicy: IfNotPresent
          ports:
            - name: connect-sync
              containerPort: 8081
          env:
            - name: OP_HTTP_PORT
              value: "8081"
            - name: OP_SESSION
              value: /home/opuser/.op/1password-credentials.json
            - name: OP_BUS_PORT
              value: "11221"
            - name: OP_BUS_PEERS
              value: localhost:11220
            - name: OP_LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared-data
              mountPath: /home/opuser/.op/data
            - name: credentials
              mountPath: /home/opuser/.op/1password-credentials.json
              subPath: 1password-credentials.json
      volumes:
        # emptyDir basta: connect-sync reconstruye la cache tras un reinicio
        # (decision architect INFRA-511: no PVC).
        - name: shared-data
          emptyDir: {}
        - name: credentials
          secret:
            secretName: op-credentials
            items:
              - key: 1password-credentials.json
                path: 1password-credentials.json
---
apiVersion: v1
kind: Service
metadata:
  name: onepassword-connect
  namespace: onepassword-connect
  labels:
    app.kubernetes.io/name: onepassword-connect
    infra: "false"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: ClusterIP
  selector:
    app: onepassword-connect
  ports:
    - name: connect-api
      port: 8080
      targetPort: 8080
    - name: connect-sync
      port: 8081
      targetPort: 8081
---
# El unico cliente de Connect es ESO (ns external-secrets-operator). El 8081 del
# connect-sync no se expone: la policy no lo permite a nadie.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onepassword-connect-allow-eso
  namespace: onepassword-connect
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app: onepassword-connect
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets-operator
      ports:
        - port: 8080
          protocol: TCP
