# One-shot: caducidad de 7 días para los eventos de ingestión de Langfuse
# (bucket langfuse, prefijo events/; INFRA-931). Langfuse v3 sube a S3 cada evento
# que ingiere (no se puede apagar) y nunca lo borra: 1,2 M objetos (80 % de MinIO)
# el 17-10, sobre el RAID1 de HDD de sauvage al 100 % de io_time, que dejaba los
# commits de capas de Harbor en 4–8 min. El CronJob de retención de
# k8s-langfuse-pocharlies borra las trazas a los 2 días; 7 deja margen de replay.
# media/ y exports/ no se tocan. La purga la drena el scanner de MinIO
# (MINIO_SCANNER_SPEED=slowest en minio.yaml): días, no horas; no se acelera con
# un `mc rm` manual. El bucket lo crea bootstrap-buckets.yaml.
# NO está en kustomization.yaml a propósito (misma convención que
# bootstrap-buckets.yaml): los Job son inmutables y ttlSecondsAfterFinished
# haría que ArgoCD lo recreara sin fin. Se aplica a mano:
#   kubectl apply -f storage/minio/langfuse-events-bootstrap.yaml
# Idempotente: se puede reaplicar tras borrar el Job terminado.
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-events-bootstrap
  namespace: minio
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: sauvage
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: mc
          # minio/mc ya no se publica en Docker Hub (pull access denied); la
          # imagen del servidor trae /usr/bin/mc. Espejo público en GHCR, no en
          # Harbor: este plano no puede depender de Harbor (DGX-1336).
          image: ghcr.io/pocharlies-org/minio:RELEASE.2025-04-22T22-12-26Z
          command: ["sh", "-c"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio-root, key: root-user}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio-root, key: root-password}
          args:
            - |
              set -e
              BUCKET=langfuse
              mc alias set local http://minio-s3:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              # Este Job es el único que escribe ILM en el bucket: cualquier
              # regla listada significa que ya está.
              if [ -z "$(mc ilm rule ls "local/$BUCKET" 2>/dev/null)" ]; then
                mc ilm rule add --prefix "events/" --expire-days 7 "local/$BUCKET"
              fi
              mc ilm rule ls "local/$BUCKET"
