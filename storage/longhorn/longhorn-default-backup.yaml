---
# Credential for the DEFAULT Longhorn backup target on Sauvage MinIO (INFRA-1022 P2).
#
# The credential itself (1Password item `longhorn-default-backup`, vault
# k8s-pocharlies) and the MinIO user with the scoped policy
# storage/minio/longhorn-default-backup-policy.json are provisioned by security
# (INFRA-1112). This file only projects the credential into longhorn-system:
# it is the credential of the DEFAULT target once the cutover lands (runbook
# docs/runbook-longhorn-default-backup-minio-cutover.md). The transitional
# BackupTarget/minio-default-test that lived here for the phase (b) drill was
# removed in phase (d) (2026-11-05); ArgoCD prunes the live CR on sync.
#
# Pattern: storage/longhorn/openclaw-sauvage-backup-target.yaml (retired with
# INFRA-993). Do NOT reuse `backup-user` (its policy is velero-backups/*).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-default-backup
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: longhorn
    backup.e-dani.com/scope: default
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: longhorn-default-backup
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: longhorn
          backup.e-dani.com/scope: default
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: longhorn-default-backup/AWS_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: longhorn-default-backup/AWS_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
    - secretKey: AWS_ENDPOINTS
      remoteRef:
        key: longhorn-default-backup/AWS_ENDPOINTS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
