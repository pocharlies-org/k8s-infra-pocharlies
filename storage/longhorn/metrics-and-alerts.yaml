# SC-2508: se RESTAURA el VMServiceScrape `longhorn` (job longhorn-backend) junto con la
# excepcion de red que pedia INFRA-882. La causa estaba medida: el scrape apuntaba bien
# (longhorn-manager expone /metrics en el puerto `manager`=9500; podIP:9500/metrics
# responde 200), y lo que lo rompio es el NetworkPolicy `longhorn-manager` del chart de
# Longhorn (app ArgoCD `longhorn`), que solo deja ingress a los pods propios. vmagent
# (ns monitoring) no estaba admitido -> connection refused en las 4 instancias ->
# TooManyLogs/TargetDown -> incidente Keep «Monitorización degradada» (MON-15076).
# La excepcion NO toca el NetworkPolicy del chart (es del chart, selfHeal lo revertiria):
# los NetworkPolicy son aditivos — la politica de abajo, en ESTE repo, abre el 9500 a
# vmagent sin tocar lo que el chart declara. No borrar la de arriba del chart ni la de
# aqui: la del chart sigue cerrando todo lo demas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-monitoring-scrape
  namespace: longhorn-system
  labels:
    app.kubernetes.io/part-of: longhorn
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    # Solo el puerto de metricas, solo desde el namespace de monitorizacion (vmagent).
    # No abrir 9500 a todo el cluster: el chart lo cierra a proposito.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9500
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    app.kubernetes.io/part-of: longhorn
spec:
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      path: /metrics
      interval: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: longhorn-scheduling
  namespace: longhorn-system
  labels:
    app.kubernetes.io/part-of: longhorn
spec:
  groups:
    - name: longhorn.scheduling
      rules:
        # La deriva concreta que nos mordio. `allowScheduling` es un campo del que
        # Longhorn es dueño: ni ArgoCD ni Ansible lo reconcilian de forma continua
        # (Argo pelearia con Longhorn por el objeto, y Ansible solo corre cuando se
        # lanza), asi que la unica defensa real es detectarlo.
        - alert: LonghornNodeSchedulingDisabled
          expr: |
            longhorn_node_status{condition="allowScheduling"} == 0
          for: 30m
          labels:
            severity: warning
            area: storage
          annotations:
            summary: "Longhorn no programa replicas en {{ $labels.node }}"
            description: >-
              El nodo {{ $labels.node }} tiene allowScheduling=false, asi que Longhorn
              no colocara replicas nuevas en el. Si fue deliberado (modo attach-only),
              silencia esta alerta para ese nodo. Si no, el cluster tiene menos destinos
              de los que cree y un volumen puede quedarse degradado sin sitio donde
              reconstruirse. Comprobar con:
              kubectl -n longhorn-system get nodes.longhorn.io -o custom-columns=NAME:.metadata.name,SCHED:.spec.allowScheduling

        # El sintoma que de verdad duele, independiente de por que pase.
        - alert: LonghornVolumeDegraded
          expr: |
            longhorn_volume_robustness == 2
          for: 1h
          labels:
            severity: warning
            area: storage
          annotations:
            summary: "Volumen Longhorn degradado: {{ $labels.volume }}"
            description: >-
              Lleva mas de una hora sin todas sus replicas. Si la causa es
              "insufficient storage", ojo: NO significa falta de espacio en disco.
              Longhorn resta storageReserved ANTES de aplicar el minimo del 15 %, asi
              que los dos margenes se suman. Un volumen puede no caber con cientos de
              GiB libres.

        - alert: LonghornVolumeFaulted
          expr: |
            longhorn_volume_robustness == 3
          for: 5m
          labels:
            severity: critical
            area: storage
          annotations:
            summary: "Volumen Longhorn en FAULTED: {{ $labels.volume }}"
            description: "Sin ninguna replica utilizable. El dato de ese PVC no esta accesible."

        # Menos de 3 destinos deja al cluster sin poder cumplir replicas=3.
        - alert: LonghornTooFewSchedulableNodes
          expr: |
            count(longhorn_node_status{condition="allowScheduling"} == 1) < 3
          for: 30m
          labels:
            severity: warning
            area: storage
          annotations:
            summary: "Solo {{ $value }} nodos Longhorn admiten replicas"
            description: >-
              Con menos de 3 destinos no se puede cumplir numberOfReplicas=3 y los
              volumenes nuevos o en reconstruccion se quedaran degradados.

        # SC-3063: huérfanos de réplica que el job orphan-watch no ha podido purgar
        # (nodo caído, dato referenciado por un Replica CR vivo, o el propio Longhorn
        # sin aplicar orphanResourceAutoDeletion). La purga oficial es de Longhorn;
        # aquí solo suena la campana cuando falla.
        - alert: LonghornOrphanReplicasStale
          expr: |
            longhorn_orphan_replica_data > 0
          for: 3h
          labels:
            severity: warning
            area: storage
          annotations:
            summary: "{{ $value }} réplicas huérfanas de Longhorn sin purgar en {{ $labels.node }}"
            description: >-
              El job longhorn-orphan-watch lleva horas sin poder purgar el dato
              huérfano. Si el nodo está caído es esperado (Longhorn no borra datos de
              nodos unreachable); si está arriba, comprobar con
              kubectl -n longhorn-system get orphans.longhorn.io y el log del job.
              El riesgo de fondo: el dato huérfano saca al disco del umbral de
              scheduling y un motor muerto se queda sin candidatos de salvage
              (keep-causa deployment-degraded:47658437cd).

        # El vigilante del vigilante: si orphan-watch deja de empujar su sello, la
        # alerta de huérfanos de arriba deja de ser fiable.
        - alert: LonghornOrphanWatchNotRunning
          expr: |
            time() - longhorn_orphan_watch_last_success_timestamp > 7200
          for: 30m
          labels:
            severity: warning
            area: storage
          annotations:
            summary: "longhorn-orphan-watch no empuja métricas desde hace 2 h"
            description: >-
              Comprobar kubectl -n longhorn-system get jobs -l
              app.kubernetes.io/part-of=longhorn y los logs del cronjob.
