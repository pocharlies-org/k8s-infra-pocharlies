# Cipher secret del PVC cifrado plaud-mcp-home (INFRA-980). El valor lo deposita
# security en 1Password (item plaud-mcp-home-crypto, campo CRYPTO_KEY_VALUE);
# ESO lo materializa como secret Opaque llamado igual que el PVC, que es como
# la SC longhorn-encrypted lo resuelve por plantilla. El valor nunca va a git.
# CreatedOnce/0s/Orphan: patron de claves LUKS de la casa (el helm de openclaw lo
# impone con fail()): re-sincronizar puede pisar la clave del volumen y dejarlo
# irrecuperable; con Orphan ESO no es dueno del secret (constancia security,
# INFRA-980, 23-10). No revertir.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaud-mcp-home-crypto
  namespace: plaud-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: longhorn
    backup.e-dani.com/scope: plaud-mcp-home
spec:
  refreshInterval: 0s
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: plaud-mcp-home
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        CRYPTO_KEY_VALUE: "{{ .CRYPTO_KEY_VALUE }}"
        CRYPTO_KEY_PROVIDER: "secret"
        CRYPTO_KEY_CIPHER: "aes-xts-plain64"
        CRYPTO_KEY_HASH: "sha256"
        CRYPTO_KEY_SIZE: "256"
        CRYPTO_PBKDF: "argon2i"
  data:
    - secretKey: CRYPTO_KEY_VALUE
      remoteRef:
        key: plaud-mcp-home-crypto
        property: CRYPTO_KEY_VALUE
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
