apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-shared-nvme
  namespace: databases
  annotations:
    # Bump only by PR after the corresponding ExternalSecrets are healthy.
    # This makes CNPG re-read passwordSecret when a role was first observed
    # before ESO had materialized its Secret.
    synapse.e-dani.com/agent-role-credentials-generation: "2"
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  # INFRA-942: el secreto del superusuario es el del cluster original. Lo leen el volcado
  # lógico, los hooks PostSync (role-settings, agent-transcripts) y la ExternalSecret de
  # skirmbooks; con el nombre por defecto (postgres-shared-nvme-superuser) se quedarían sin él.
  superuserSecret:
    name: postgres-shared-superuser

  postgresql:
    parameters:
      # Resized 2026-06-08 for synapse-stack migration from docker shared-postgres
      # (see plans/shared-stores-migration-from-sauvage.md §1.1).
      # 41 synapse services × pool_size 5 = 205 connections projected; max_connections 400 = ×1.95 headroom.
      # shared_buffers 1Gi (12.5% of 8Gi mem limit) absorbs litellm full-scan working set
      # which was OOM-killing pod with 256MB / 2Gi (root cause documented in plan §12.2).
      # INFRA-942 (2026-10-19): 1GB -> 4GB. Hindsight (4.2 GB, pgvector) leía de disco (IO.DataFileRead) con el
      # bloqueo de su bank tomado; el límite sube a 10Gi para dejar a los backends el margen que tenían.
      # INFRA-942 (2026-10-26): 4GB -> 6GB y effective_cache_size 7GB -> 18GB con el límite a 24Gi. Los índices
      # HNSW por banco de Hindsight (personal 6,2 GB, claude-personal 2,5 GB…) no cabían en 10Gi y el recall leía de
      # disco (IO/DataFileRead de 11 s por consulta). Lo que no es shared_buffers queda como caché de páginas del SO.
      max_connections: "400"
      shared_buffers: "6GB"
      effective_cache_size: "18GB"
      work_mem: "32MB"
      maintenance_work_mem: "256MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "32MB"
      default_statistics_target: "100"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      # Logical replication prerequisites (Fase 2 of synapse-stack migration).
      # max_replication_slots kept at upstream CNPG default (32) to avoid regression;
      # max_wal_senders bumped from default 10 to 20 to cover 7 synapse role PUBLICATIONs
      # + walreceivers (replica + barman archive) with headroom.
      wal_level: "logical"
      max_wal_senders: "20"
      max_replication_slots: "32"

      # ── Volumen de WAL (2026-08-11) ────────────────────────────────────
      # MEDIDO: 7.028 segmentos archivados en 7 días = ~16 GB/día de WAL
      # para una base de datos que ENTERA ocupa 15 GB. Por eso el archivo de
      # barman llegó a ~460 GB con 30 días de retención.
      #
      # No es volumen de datos, son imágenes de página completa. Con
      # full_page_writes=on, el primer cambio a una página DESPUÉS de cada
      # checkpoint mete los 8 KB enteros en el WAL. Con checkpoint_timeout a
      # 5 min y max_wal_size a 1 GB los checkpoints eran constantes, y la
      # carga es de UPDATE puro (competitor_intel 9,5 M updates, synapse
      # 3,2 M, back_in_stock 1,9 M sobre una base de 27 MB), así que se
      # reescribían las mismas páginas una y otra vez.
      #
      # Espaciar los checkpoints reduce cuántas páginas completas se emiten;
      # wal_compression las comprime antes de escribirlas, así que baja el
      # WAL en disco Y lo archivado. zstd está disponible en PG 17.
      # Los tres son SIGHUP: no reinician el cluster.
      # INFRA-942 (2026-10-27): con Hindsight el WAL subió a ~74 GB/día y el 77-80 % seguían siendo páginas completas
      # (pg_waldump: B-tree, HNSW de pgvector como Generic, hint bits). En 3,6 días hubo 63 checkpoints forzados por
      # max_wal_size, además de los de tiempo. 15min -> 30min y 4GB -> 16GB: la mitad de checkpoints y menos páginas
      # completas. El WAL vive en el NVMe local (local-path no aplica la cuota de 20Gi; ~500 GB libres); reproducir
      # 16 GB al recuperar de una caída tarda pocos minutos.
      wal_compression: "zstd"
      checkpoint_timeout: "30min"
      max_wal_size: "16GB"
      min_wal_size: "1GB"

    # INFRA-942 (2026-10-25): réplica síncrona en modo preferred. El primario confirma el commit cuando la réplica
    # ya lo tiene en disco (medido: 2-6 ms más por commit), así que un fallo del primario no pierde nada confirmado.
    # Si la réplica cae, vuelve a asíncrono solo en vez de bloquear las escrituras (con `required` y 2 instancias
    # se bloquearían).
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  # INFRA-942 (2026-10-22): longhorn -> local-path-retain. Las réplicas de Longhorn
  # se morían y con ellas el volumen del cluster (postgres-shared-4 no pudo hacer
  # pg_rewind: WAL perdido), y todo el I/O de Hindsight (IO.DataFileRead) pasaba por
  # Longhorn. local-path-retain escribe en el NVMe del propio nodo (los ks5-cp tienen
  # un solo disco NVMe; /opt/local-path-provisioner está en él) y conserva el PV al
  # borrar el PVC. La HA no la da el disco sino la replicación en streaming de CNPG:
  # las 2 instancias siguen en nodos distintos por la anti-afinidad requerida de abajo.
  # Tamaños: 46 GB de bases hoy; 80Gi + 20Gi de WAL por instancia caben en cualquier
  # ks5-cp (cp-1 es el más justo: ~199 GB libres). Si un nodo se pierde, se recupera
  # del storage local del nodo o de barman; el PV se conserva al borrar el PVC.
  storage:
    storageClass: local-path-retain
    size: 80Gi

  walStorage:
    storageClass: local-path-retain
    size: 20Gi

  # INFRA-942 (2026-10-23): sin bootstrap.recovery. El restore desde barman se
  # descartó (2 h de corte) en favor de la réplica en streaming (cluster-nvme.yaml),
  # y mientras el objeto vivo tenga bootstrap.initdb el webhook rechaza el manifiesto
  # ("Only one bootstrap method can be specified at a time"), lo que deja a ArgoCD
  # sin poder comparar ni sincronizar la app.
  resources:
    requests:
      # INFRA-42/INFRA-79 (2026-09-13): 500m -> 200m. p95 14d = 112m (postgres-shared-3),
      # 68m (postgres-shared-2). Limits unchanged (4 CPU) absorb the spikes.
      cpu: "200m"
      # INFRA-942 (2026-10-26): 5Gi -> 16Gi, para que el scheduler cuente con la memoria (el webhook de CNPG exige
      # además request >= shared_buffers). ks5-cp-2/3: 62,5 GiB, con 22-26 GiB libres en el peor momento de 7 días.
      memory: "16Gi"
    limits:
      # La CPU se queda en 4: ks5-cp-2 usa ~6,6 de sus 8 cores y el recall de Hindsight va a la réplica.
      cpu: "4"
      memory: "24Gi"

  monitoring:
    enablePodMonitor: false
    # INFRA-230: consulta de cobertura RCA de Aurora (aurora-rca-coverage-queries.yaml).
    # El webhook de defaulting del operador añade DELANTE la entrada de las
    # consultas por defecto (cnpg-default-monitoring) si no está — por eso esa
    # entrada aparece en el objeto vivo y no aquí; no hay que listarla (cluster_defaults.go,
    # defaultMonitoringQueries, operador 1.29.1).
    customQueriesConfigMap:
      - name: postgres-shared-aurora-rca-coverage
        key: queries

  managed:
    roles:
      - name: horarios
        ensure: present
        login: true
        # security (16-10): con el historial de saturación del clúster (367/400 el
        # 28-07), el tope va en el servidor y no en el pool de la app. Es una app
        # de un usuario con un worker: 5 da margen y corta un pool desbocado.
        connectionLimit: 5
        passwordSecret:
          name: horarios-db-credentials
        comment: "Planificador AlphaLink (repo: pocharlies-org/horarios-alphalink). SC-2495."
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: keycloak-db-credentials
        comment: "Keycloak SSO; migrated from keycloak/keycloak-postgres on 2026-08-11"
      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: n8n-db-credentials
        comment: "n8n workflow automation (repo: pocharlies/k8s-n8n-pocharlies)"
      - name: n8n_stg
        ensure: present
        login: true
        passwordSecret:
          name: n8n-stg-db-credentials
        comment: "n8n staging workflow automation"
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: litellm-db-credentials
        comment: "LiteLLM router (repo: pocharlies/k8s-litellm-pocharlies)"
      - name: langfuse
        ensure: present
        login: true
        passwordSecret:
          name: langfuse-db-credentials
        comment: "Langfuse LLM observability (repo: pocharlies-org/k8s-langfuse-pocharlies)"
      - name: teslamate
        ensure: present
        login: true
        passwordSecret:
          name: teslamate-db-credentials
        comment: "TeslaMate (repo: pocharlies/k8s-teslamate-pocharlies)"
      - name: whatsappmcp
        ensure: present
        login: true
        passwordSecret:
          name: whatsappmcp-db-credentials
        comment: "WhatsApp MCP/socialmedia (repo: pocharlies/k8s-socialmedia-pocharlies)"
      - name: sauvage_bot
        ensure: present
        login: true
        passwordSecret:
          name: sauvage-bot-db-credentials
        comment: "Sauvage Shield moderation bot and operations dashboard"
      - name: skirmshop
        ensure: present
        login: true
        passwordSecret:
          name: skirmshop-db-credentials
        comment: "SkirmShop shared apps and labels (shopify-* repos)"
      - name: dgxbench
        ensure: present
        login: true
        passwordSecret:
          name: dgxbench-db-credentials
        comment: "DGX benchmark results (dgx-infra services/dashboard/bench); pool capped at 3"
      # Synapse host stack (41 services in sauvage), migrated from docker shared-postgres
      # to CNPG (2026-06-08). Mirrors the role topology in docker: synapse_app is a NOLOGIN
      # group; the 6 login roles inherit from it. synapse_engine + synapse_admin BYPASSRLS.
      # See plans/shared-stores-migration-from-sauvage.md §1.4 and §-1.11D.
      - name: synapse_app
        ensure: present
        login: false
        inherit: true
        passwordSecret:
          name: synapse-app-db-credentials
        comment: "Synapse shared group role (NOLOGIN); members inherit table privileges via this role"
      - name: synapse_engine
        ensure: present
        login: true
        inherit: true
        bypassrls: true
        inRoles:
          - synapse_app
        passwordSecret:
          name: synapse-engine-db-credentials
        comment: "Synapse Workflow Engine (synapse-engine.service on sauvage)"
      - name: synapse_dispatcher
        ensure: present
        login: true
        inherit: true
        inRoles:
          - synapse_app
        passwordSecret:
          name: synapse-dispatcher-db-credentials
        comment: "Synapse Dispatcher (outbox → RMQ) — synapse-dispatcher.service"
      - name: synapse_gateway
        ensure: present
        login: true
        inherit: true
        inRoles:
          - synapse_app
        passwordSecret:
          name: synapse-gateway-db-credentials
        comment: "Synapse HTTP gateway (synapse-gateway.service)"
      # Canonical NOLOGIN owner for checksummed Synapse migrations. Runtime
      # logins are members only when they must transfer legacy ownership or
      # execute the isolated migrator; agent identities never inherit it.
      - name: synapse_owner
        ensure: present
        login: false
        inherit: true
        disablePassword: true
        comment: "Canonical owner role for Synapse schema objects"
      # Existing login/password is retained from the restored production DB;
      # its credential remains projected only into the isolated migration Job.
      - name: synapse_migration
        ensure: present
        login: true
        inherit: true
        inRoles:
          - synapse_owner
        comment: "K8s-native checksummed Synapse migration runner"
      - name: synapse_admin
        ensure: present
        login: true
        inherit: true
        bypassrls: true
        inRoles:
          - synapse_owner
        passwordSecret:
          name: synapse-admin-db-credentials
        comment: "Synapse Admin UI (synapse-admin.service); BYPASSRLS for cross-tenant operations"
      - name: synapse_adapter
        ensure: present
        login: true
        inherit: true
        inRoles:
          - synapse_app
        passwordSecret:
          name: synapse-adapter-db-credentials
        comment: "Synapse Adapters (shared role for 35 synapse-adapter-* services)"
      - name: synapse_outbox_gc
        ensure: present
        login: true
        inherit: true
        inRoles:
          - synapse_app
        passwordSecret:
          name: synapse-outbox-gc-db-credentials
        comment: "Synapse Outbox GC (synapse-outbox-gc.service; hourly oneshot timer)"
      # Dedicated agent identities deliberately do not inherit synapse_app.
      # Synapse migrations grant only the table/column privileges each plane needs.
      - name: synapse_sre_m2m
        ensure: present
        login: true
        inherit: false
        passwordSecret:
          name: synapse-sre-m2m-db-credentials
        comment: "Private Synapse SRE AgentGateway mutation plane"
      - name: synapse_sre_reporter
        ensure: present
        login: true
        inherit: false
        passwordSecret:
          name: synapse-sre-reporter-db-credentials
        comment: "Read-mostly weekly Synapse SRE reporter"
      - name: synapse_agent_m2m
        ensure: present
        login: true
        inherit: false
        passwordSecret:
          name: synapse-agent-m2m-db-credentials
        comment: "Private durable Synapse agent-run callback plane"
      - name: keep
        ensure: present
        login: true
        passwordSecret:
          name: keep-db-credentials
        comment: "Keep alert hub — sistema de récord de alertas (repo: pocharlies/k8s-observability-pocharlies)"
      - name: aurora
        ensure: present
        login: true
        passwordSecret:
          name: aurora-db-credentials
        comment: "Aurora — investigación de incidentes disparada por Keep (repo: pocharlies/k8s-observability-pocharlies)"
      # SC-546: destino de archivo de la retención de sesiones opencode. El rol
      # existía desde el 11-09 creado a mano; al pasarlo a managed.roles CNPG
      # reconcilia su contraseña desde el secret (doc "Password management":
      # "The declarative role management feature includes reconciling of role
      # passwords"), por eso el secret de 1Password con la contraseña VIGENTE
      # (item opencode-archive) debe estar materializado ANTES de aplicar este
      # spec — ver secuencia de merge en el PR feat/SC-546-cnpg-declarativo.
      # Un ALTER con la misma contraseña es inocuo; un ALTER con otra dejaría
      # sin login al timer x86 opencode-archive-prune.
      - name: opencode_archive
        ensure: present
        login: true
        passwordSecret:
          name: opencode-archive-db-credentials
        comment: "SC-546 exportador de archivo/poda de sesiones opencode (timer x86 opencode-archive-prune, repo x86-host-runtime-pocharlies); dueño de agent_transcripts"
      # SC-1743: rol del CRM propio (base company_crm, dueño de su esquema).
      # La contraseña la posee 1Password (item `company-crm`); CNPG la
      # reconcilia desde company-crm-db-credentials (ExternalSecret en
      # app-credentials.yaml), que debe estar materializado ANTES de aplicar
      # este spec.
      - name: company_crm
        ensure: present
        login: true
        passwordSecret:
          name: company-crm-db-credentials
        comment: "CRM propio de la compañía (repo pocharlies-org/company-crm); dueño de la base company_crm"
      # SKIRM-184: rol propio de la UI de gestión de Skirmbooks, para que deje de
      # entrar con `skirmshop` (que lee la base SII de la tienda). La contraseña la
      # posee 1Password (item `skirmbooks-ui-db`, sembrado por security); CNPG la
      # reconcilia desde skirmbooks-ui-db-credentials (ExternalSecret en
      # app-credentials.yaml), que debe estar materializado ANTES de aplicar este
      # spec. Los GRANT sobre los esquemas gestoría_* los concede la migración del
      # producto (patrón 0058), no aquí.
      - name: skirmbooks_ui_app
        ensure: present
        login: true
        # connectionLimit MEDIDO: el pool de la UI es max 8
        # (skirmbooks-ui/app/lib/db.server.ts:105) con 1 réplica
        # (k8s-skirmbooks-pocharlies/k8s/manifest.yaml:7); 10 da margen y corta
        # un pool desbocado, como en `horarios` (SC-2495).
        connectionLimit: 10
        passwordSecret:
          name: skirmbooks-ui-db-credentials
        comment: "UI de gestión Skirmbooks (repo: pocharlies-org/skirmbooks-gestoria-src). SKIRM-184."
      # INFRA-940: Hindsight (memoria de agentes). Contraseña en 1Password (item
      # `hindsight-db`), reconciliada desde hindsight-db-credentials (app-credentials.yaml).
      # connectionLimit: HINDSIGHT_API_DB_POOL_MAX_SIZE=40 (values de k8s-hindsight-pocharlies, INFRA-942 19-10)
      # con 1 réplica de API; 50 deja margen para las migraciones del arranque y el rollout.
      - name: hindsight
        ensure: present
        login: true
        connectionLimit: 50
        passwordSecret:
          name: hindsight-db-credentials
        comment: "Hindsight, memoria de agentes (repo: pocharlies-org/k8s-hindsight-pocharlies). INFRA-940."
      # SC-2956 D2: base de los empleados de análisis (repo: pocharlies-org/k8s-analisis-pocharlies).
      # Contraseña en 1Password (item `analisis-db`, sembrado por security), reconciliada desde
      # analisis-db-credentials (app-credentials.yaml). No aplicar hasta que ese item exista.
      - name: analisis
        ensure: present
        login: true
        connectionLimit: 5
        passwordSecret:
          name: analisis-db-credentials
        comment: "Empleados de análisis (repo: pocharlies-org/k8s-analisis-pocharlies). SC-2956 D2."

  # INFRA-942 (2026-10-23): promovido. Se creó como réplica en streaming de
  # postgres-shared (Longhorn) y se promovió en el corte con el viejo cercado.
  replica:
    enabled: false
    source: postgres-shared-primary

  bootstrap:
    pg_basebackup:
      source: postgres-shared-primary

  externalClusters:
    - name: postgres-shared-primary
      connectionParameters:
        host: postgres-shared-rw.databases.svc.cluster.local
        port: "5432"
        dbname: postgres
        user: streaming_replica
        sslmode: verify-full
      # El usuario streaming_replica se autentica con certificado de cliente
      # (el secreto postgres-shared-replication es kubernetes.io/tls, no tiene password).
      sslRootCert:
        name: postgres-shared-ca
        key: ca.crt
      sslCert:
        name: postgres-shared-replication
        key: tls.crt
      sslKey:
        name: postgres-shared-replication
        key: tls.key

  # INFRA-942 (2026-10-27): barman-cloud (boto3) reintenta minutos, no segundos. El backup sube ~2 h a MinIO en
  # sauvage, cuyo host se congela de vez en cuando (disco saturado, PSI io full 30-55 %): el 26-10 a las 04:32 y el
  # 27-10 a las 05:18 (~80 s, nodo NotReady, MinIO sin endpoints). Con el modo por defecto (pocos intentos en segundos)
  # el upload moría con "Could not connect to the endpoint URL" y se perdía el backup entero. barman no fija
  # `retries` en su Config, así que botocore toma estas variables (comprobado en la imagen: botocore 1.40.6).
  # Modo standard: espera exponencial con jitter, tope de 20 s por intento; 30 intentos aguantan ~4 min de media (máx. ~8).
  env:
    - name: AWS_RETRY_MODE
      value: standard
    - name: AWS_MAX_ATTEMPTS
      value: "30"

  backup:
    # 2026-10-25: 7d -> 2d (Dani, INFRA-993). El store de MinIO vive en el disco de
    # sauvage y hindsight genera ~80 GB/dia de WAL: con 7d la ruta iba a ~750 GB y
    # sauvage ya llego al 97 %. PITR de 2 dias; el dump logico diario y la foto
    # semanal -> OVH (retencion 30d) cubren lo de mas atras.
    retentionPolicy: "2d"
    # INFRA-942: carpeta propia (serverName = postgres-shared-nvme). La del cluster
    # viejo (s3://cnpg-backups/postgres-shared/postgres-shared) se queda intacta como
    # vía de recuperación anterior al corte: nunca dos escritores en el mismo archivo.
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/postgres-shared"
      endpointURL: "http://minio-s3.minio.svc.cluster.local:9000"
      s3Credentials:
        accessKeyId:
          name: postgres-shared-minio
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-shared-minio
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        jobs: 2

  # 2026-08-07: after a cordon the primary took 123 min and 452 attempts to find
  # a node. Preempt ordinary workloads instead of queueing behind them.
  priorityClassName: data-critical

  affinity:
    # required: with only 2 instances, co-location turns one node failure into a
    # full outage with no failover target (incident 2026-07-20: both instances on
    # the frozen `ubuntu` node, 9h down). A visible Pending beats silent co-location.
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
    nodeSelector:
      kubernetes.io/arch: amd64
      # 2026-07-29: required anti-affinity (above) stopped co-location but still
      # allowed one instance — the primary — to sit on `ubuntu`, the dev box that
      # reboots. It did, and its 01:12 CEST reboot forced a failover. workload=core
      # keeps the cluster on the ks5 pool; dev/edge nodes are workload=cpu.
      workload: core
