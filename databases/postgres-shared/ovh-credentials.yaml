---
# Credenciales S3 para que CNPG escriba los backups (base + WAL) de postgres-shared-nvme
# en Object Storage de OVH (INFRA-1175). Antes apuntaban a la MinIO de sauvage, cuyo md3
# no tiene margen de IOPS (INFRA-1091) y aloja a la vez root, nfs-cold y backup-minio.
#
# Usuario S3 `k8s-objectstore` del proyecto PCI de OVH, gestionado desde el manager de
# OVH; la clave vive solo en 1Password. Rotar = credenciales nuevas en el manager,
# actualizar el item y `kubectl cnpg reload` del cluster (barman lee la clave en cada
# arranque de archive-wal).
#
# 1Password item (vault k8s-pocharlies):
#   ovh-object-storage-s3
#     access_key / secret_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-shared-ovh
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: backup-credentials
    security.e-dani.com/rotation-class: object-storage
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: postgres-shared-ovh
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: ovh-object-storage-s3
        property: access_key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: ovh-object-storage-s3
        property: secret_key
