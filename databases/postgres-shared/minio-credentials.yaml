# Credenciales S3 para que CNPG escriba backups (base + WAL) en MinIO.
# Usuario propio `cnpg-postgres-shared`: solo cnpg-backups/postgres-shared/*
# (List del bucket para el HEAD de barman). 1Password: minio-cnpg-postgres-shared
# (access_key_id, secret_access_key). Los dumps logicos de esta BBDD usan su
# propio Secret (logical-dumps-minio, dgx-infra k8s/backup/logical-dumps).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-shared-minio
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: backup-credentials
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: postgres-shared-minio
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: minio-cnpg-postgres-shared/access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: minio-cnpg-postgres-shared/secret_access_key
