# Observabilidad de conexiones de postgres-shared.
#
# El incidente de saturación del 28-07-2026 (367/400 conexiones, 361 ociosas,
# la transacción abandonada más vieja de 17h18m) fue INVISIBLE: no había ni una
# serie de Postgres en VictoriaMetrics. El cluster expone /metrics en el puerto
# 9187 desde siempre, pero `monitoring.enablePodMonitor` está en false y, aunque
# estuviera en true, CNPG genera un PodMonitor de monitoring.coreos.com — un CRD
# que en este cluster no existe, porque el stack es VictoriaMetrics. De ahí que
# el scrape vaya como VMPodScrape escrito a mano.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: postgres-shared
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres
spec:
  namespaceSelector:
    matchNames:
      - databases
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-shared-nvme
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
---
# Umbrales, y por qué estos:
#
#   max_connections = 400 (por instancia).
#
#   Tras el saneamiento del 28-07-2026 el régimen normal está en ~200, de las
#   que ~105 son la flota Synapse (45 pods con pools explícitos y acotados) y el
#   resto consumidores ya limitados. 240 (60%) es por tanto "algo ha crecido de
#   más"; 300 (75%) es el techo que un rolling update no debe superar y coincide
#   con el criterio de aceptación del incidente.
#
# La división es `on(pod)` a propósito: max_connections es un límite POR
# INSTANCIA, así que agregar las conexiones de primary y réplica y compararlas
# contra un solo 400 daría un porcentaje sin sentido.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: postgres-shared-connections
  namespace: databases
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: shared-infrastructure
spec:
  groups:
    - name: postgres-shared.connections
      rules:
        - alert: PostgresSharedMetricsMissing
          expr: absent(cnpg_backends_total{namespace="databases"})
          for: 10m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared no está exportando métricas
            description: >-
              Sin series cnpg_backends_total durante 10m. Es exactamente la
              ceguera que dejó pasar la saturación del 28-07-2026: revisa el
              VMPodScrape postgres-shared y el endpoint 9187 de los pods.

        - alert: PostgresSharedConnectionsHigh
          expr: >-
            sum by (pod) (cnpg_backends_total{namespace="databases"})
            / on (pod) group_left() cnpg_pg_settings_setting{namespace="databases",name="max_connections"}
            > 0.60
          for: 15m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared por encima del 60% de max_connections
            description: >-
              {{ $labels.pod }} lleva 15m con {{ $value | humanizePercentage }}
              de max_connections en uso. Régimen normal esperado ~50%. Mira qué
              consumidor ha crecido con
              `sum by (datname,usename,application_name) (cnpg_backends_total)`
              antes de que un rolling update duplique pools.

        - alert: PostgresSharedConnectionsCritical
          expr: >-
            sum by (pod) (cnpg_backends_total{namespace="databases"})
            / on (pod) group_left() cnpg_pg_settings_setting{namespace="databases",name="max_connections"}
            > 0.75
          for: 5m
          labels:
            severity: critical
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared por encima del 75% de max_connections
            description: >-
              {{ $labels.pod }} está al {{ $value | humanizePercentage }} de
              max_connections. Por debajo de la reserva de 100 conexiones: un
              rolling update de cualquier consumidor puede agotar el cluster y
              provocar `too many clients`.

        - alert: PostgresSharedIdleInTransaction
          expr: >-
            max by (datname, usename) (
              cnpg_backends_max_tx_duration_seconds{namespace="databases",state="idle in transaction"}
            ) > 300
          for: 5m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: transacción abandonada en {{ $labels.datname }}
            description: >-
              {{ $labels.usename }} lleva {{ $value | humanizeDuration }} con una
              transacción abierta y ociosa en {{ $labels.datname }}. Su xmin
              bloquea el vacuum de esa base. El rol `keep` ya tiene
              idle_in_transaction_session_timeout=5min (ver role-settings.yaml);
              si esto salta para otro rol, hay que arreglar el ciclo de
              transacción en el cliente o darle el mismo corte.

        - alert: PostgresSharedBackendsWaiting
          expr: max by (pod) (cnpg_backends_waiting_total{namespace="databases"}) > 0
          for: 5m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: hay backends esperando un lock en postgres-shared
            description: >-
              {{ $value }} backends llevan 5m bloqueados esperando un lock en
              {{ $labels.pod }}. Suele acompañar a transacciones abandonadas.

    # Guarda de HA y de copias (INFRA-971). El 22-10-2026 el clúster pasó más de
    # un día en Ready=False, «Waiting for the instances to become active» (bucle
    # de pg_rewind del primario caído) y con la copia de las 03:12 fallida
    # (LastBackupSucceeded=False), y no sonó nada: las reglas de conexiones son
    # ciegas a ese estado (el clúster estaba partido, no saturado). Estas dos
    # reglas lo cubren con series que ya scrapea el VMPodScrape de arriba.
    - name: postgres-shared.ha-backup
      rules:
        # Instancia lista = instancia donde el exporter de CNPG recolecta
        # (cnpg_collector_up=1). En el bucle de pg_rewind del 22-10 Postgres no
        # llegaba a subir, así que collector_up se quedaba en 0: exactamente el
        # estado a cazar. El `or vector(0)` cubre el caso de que desaparezcan
        # todos los pods: sum() sobre vector vacío devuelve vacío y la alerta no
        # llegaría a evaluarse; con el guard evalúa 0 y dispara.
        # El 2 es spec.instances (cluster.yaml): si se cambia uno, el otro.
        # Las ventanas de desagote de los nodos de control (04:00/05:00/06:00
        # UTC) promueven el clúster y se recuperan solas; `for: 5m` es el filtro
        # que pidió la sesión problem (INFRA-971).
        - alert: PostgresSharedInstancesNotReady
          expr: >-
            (sum(cnpg_collector_up{namespace="databases"}) or vector(0)) < 2
          for: 5m
          labels:
            severity: critical
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared lleva +5m con menos de 2 instancias listas
            description: >-
              Menos de spec.instances (2) instancias con cnpg_collector_up=1: es
              el equivalente a Ready=False, «Waiting for the instances to become
              active» — sin HA, como el 22-10-2026. Mira
              `kubectl get cluster.postgresql.cnpg.io postgres-shared-nvme -n
              databases` y los logs `-c postgres` de la instancia que no
              levanta. Si coincide con la ventana de desagote (04:00-06:00 UTC)
              y no se resuelve solo, no es un switchover.

        # «Copia buena» = la última completada en el catálogo barman
        # (cnpg_collector_last_available_backup_timestamp; coincide con
        # .status.lastSuccessfulBackup). Dos ramas, una alerta:
        # - sin copia buena en +26h (schedule: diaria 03:00 UTC, ver
        #   scheduledbackup.yaml);
        # - última copia fallida (failed_ts > available_ts), el equivalente en
        #   métricas de LastBackupSucceeded=False.
        # Un Backup enquistado en walArchivingFailing (como el de las 03:00 del
        # 29-10-2026) no mueve ninguno de los dos timestamps y bloquea al
        # ScheduledBackup siguiente: lo caza la primera rama.
        - alert: PostgresSharedBackupStale
          expr: >-
            (time() - max(cnpg_collector_last_available_backup_timestamp{namespace="databases"}) > 93600)
            or
            (max(cnpg_collector_last_failed_backup_timestamp{namespace="databases"}) > max(cnpg_collector_last_available_backup_timestamp{namespace="databases"}))
          for: 10m
          labels:
            severity: critical
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared sin copia buena (fallida o +26h)
            description: >-
              La última copia falló o no hay una copia buena desde hace +26h.
              Como el 22-10-2026: la copia de las 03:12 falló y tardó un día en
              verse. Revisa
              `kubectl get backups.postgresql.cnpg.io -n databases` (ojo: el
              nombre corto `backup` resuelve a Longhorn, no a CNPG) y el
              `backupPhase` en los logs del operador cnpg-system;
              walArchivingFailing que no avanza bloquea la siguiente copia.
