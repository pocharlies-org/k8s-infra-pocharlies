# Observabilidad de conexiones de postgres-shared.
#
# El incidente de saturación del 28-07-2026 (367/400 conexiones, 361 ociosas,
# la transacción abandonada más vieja de 17h18m) fue INVISIBLE: no había ni una
# serie de Postgres en VictoriaMetrics. El cluster expone /metrics en el puerto
# 9187 desde siempre, pero `monitoring.enablePodMonitor` está en false y, aunque
# estuviera en true, CNPG genera un PodMonitor de monitoring.coreos.com — un CRD
# que en este cluster no existe, porque el stack es VictoriaMetrics. De ahí que
# el scrape vaya como VMPodScrape escrito a mano.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: postgres-shared
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres
spec:
  namespaceSelector:
    matchNames:
      - databases
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-shared-nvme
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
---
# Umbrales, y por qué estos:
#
#   max_connections = 500 (por instancia; SC-5295 2026-11-11, antes 400).
#
#   Régimen medido el 2026-11-11 tras sanear conexiones ociosas >12 h: ~250
#   backends legítimos (pools estables de keep, synapse_adapter, litellm,
#   skirmshop apps, hindsight, teslamate…), ~50% del límite: lo que asumen los
#   umbrales. 300 (60%) es por tanto "algo ha crecido de más"; 375 (75%) es el
#   techo que un rolling update no debe superar.
#
# La división es `on(pod)` a propósito: max_connections es un límite POR
# INSTANCIA, así que agregar las conexiones de primary y réplica y compararlas
# contra un solo límite daría un porcentaje sin sentido.
#
# --- Régimen de ociosas (INFRA-1295; mecanismo en role-settings.yaml) ------
#
#   `idle_session_timeout = 15min` por rol cubierto, aplicado con
#   `ALTER ROLE … SET` por el Job PostSync `postgres-shared-role-settings`
#   (role-settings.yaml): el GUC vive en `pg_db_role_setting` y se lee al
#   abrir la sesión, así que no requiere restart ni cambia ninguna cadena de
#   conexión. El mismo Job hace la limpieza ÚNICA del backlog acumulado
#   (`pg_terminate_backend` de las ociosas >15min de los roles cubiertos):
#   `ALTER ROLE SET` solo afecta a sesiones NUEVAS, y la limpieza es
#   idempotente (en syncs posteriores devuelve 0 filas).
#
#   Excluidos del régimen (motivo completo en role-settings.yaml):
#     - synapse_dispatcher, synapse_adapter — conexiones LISTEN que están
#       `state='idle'` por diseño; entran solo tras la prueba de reconexión
#       de P2.
#     - synapse_migration, synapse_owner — exclusión permanente:
#       migraciones con `pg_advisory_lock`.
#     - postgres (superuser: instance manager de CNPG y los propios Job
#       PostSync) y streaming_replica (walsender): nunca.
#
#   Por qué 60%/75% sobre max_connections 500 siguen valiendo: el régimen
#   legítimo esperado tras el saneado es ~250 backends de pools vivos (~50%
#   del límite, medido 11-11). El timeout corta la cola de ociosas
#   abandonadas (criterio del epic: ninguna ociosa mayor del 30%, y ninguna
#   sobreviviendo 30 min) pero no toca los pools legítimos, que son lo que
#   estos umbrales miden. Un rolling sigue siendo el escenario que 75%
#   protege.
#
#   Guardia del régimen: `PostgresSharedOldestIdleSession` (abajo). La
#   métrica nativa `cnpg_backends_max_tx_duration_seconds` con
#   `state="idle"` no sirve para esto: medida el 15-11-2026 en las dos
#   instancias, todas sus series `idle` valen 0 (se calcula sobre
#   `xact_start`, que es NULL en una sesión sin transacción abierta). De
#   ahí la custom query `idle-sessions-queries.yaml` (patrón de
#   aurora-rca-coverage-queries.yaml), que sí mide `now() - state_change`.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: postgres-shared-connections
  namespace: databases
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: shared-infrastructure
spec:
  groups:
    - name: postgres-shared.connections
      rules:
        - alert: PostgresSharedMetricsMissing
          expr: absent(cnpg_backends_total{namespace="databases"})
          for: 10m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared no está exportando métricas
            description: >-
              Sin series cnpg_backends_total durante 10m. Es exactamente la
              ceguera que dejó pasar la saturación del 28-07-2026: revisa el
              VMPodScrape postgres-shared y el endpoint 9187 de los pods.

        - alert: PostgresSharedConnectionsHigh
          expr: >-
            sum by (pod) (cnpg_backends_total{namespace="databases"})
            / on (pod) group_left() cnpg_pg_settings_setting{namespace="databases",name="max_connections"}
            > 0.60
          for: 15m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared por encima del 60% de max_connections
            description: >-
              {{ $labels.pod }} lleva 15m con {{ $value | humanizePercentage }}
              de max_connections en uso. Régimen normal esperado ~50%. Mira qué
              consumidor ha crecido con
              `sum by (datname,usename,application_name) (cnpg_backends_total)`
              antes de que un rolling update duplique pools.

        - alert: PostgresSharedConnectionsCritical
          expr: >-
            sum by (pod) (cnpg_backends_total{namespace="databases"})
            / on (pod) group_left() cnpg_pg_settings_setting{namespace="databases",name="max_connections"}
            > 0.75
          for: 5m
          labels:
            severity: critical
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared por encima del 75% de max_connections
            description: >-
              {{ $labels.pod }} está al {{ $value | humanizePercentage }} de
              max_connections. Por debajo de la reserva de 100 conexiones: un
              rolling update de cualquier consumidor puede agotar el cluster y
              provocar `too many clients`.

        # INFRA-1464 (SC-6032): saturación POR ROL. Las dos reglas de arriba son
        # ciegas a este fallo: el 17-19/11 el clúster estaba sano (~314/500) y lo
        # que saturó fue el connectionLimit del rol `hindsight` (pool 40 +
        # migraciones de startup sobre un límite de 50) → «too many connections
        # for role» → CrashLoop del api → cron de consolidación caído. Compara
        # backends del rol contra SU límite (custom query
        # role-connections-queries.yaml), por instancia: el límite de rol es por
        # postmaster, igual que max_connections, de ahí el `on (pod, rolname)`.
        # 80% del límite: con hindsight (100) avisa a partir de 80, cuando aún
        # quedan 20 para el arranque de migraciones que fue lo que faltó.
        - alert: PostgresSharedRoleConnectionsHigh
          expr: >-
            max by (pod, rolname) (cnpg_role_connections_backends{namespace="databases"})
            / on (pod, rolname) group_left()
            max by (pod, rolname) (cnpg_role_connections_conn_limit{namespace="databases"})
            > 0.80
          for: 5m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: el rol {{ $labels.rolname }} pasa del 80% de su connectionLimit
            description: >-
              {{ $labels.rolname }} lleva 5m con {{ $value | humanizePercentage }}
              de su connectionLimit en {{ $labels.pod }}. Si el rol es el de una
              app con pool grande (hindsight: pool 40 + migraciones de arranque),
              el siguiente restart entra en CrashLoop con «too many connections
              for role». Comprueba el límite en
              `spec.managed.roles` de databases/postgres-shared/cluster.yaml
              (git) y sube el límite declarándolo allí, nunca con psql a mano
              (CNPG lo revierte en el siguiente reconcile).

        - alert: PostgresSharedIdleInTransaction
          expr: >-
            max by (datname, usename) (
              cnpg_backends_max_tx_duration_seconds{namespace="databases",state="idle in transaction"}
            ) > 300
          for: 5m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: transacción abandonada en {{ $labels.datname }}
            description: >-
              {{ $labels.usename }} lleva {{ $value | humanizeDuration }} con una
              transacción abierta y ociosa en {{ $labels.datname }}. Su xmin
              bloquea el vacuum de esa base. El rol `keep` ya tiene
              idle_in_transaction_session_timeout=5min (ver role-settings.yaml);
              si esto salta para otro rol, hay que arreglar el ciclo de
              transacción en el cliente o darle el mismo corte.

        # Guardia del régimen de ociosas (INFRA-1295 P3): si el
        # idle_session_timeout de un rol cubierto muere (ALTER perdido tras
        # un restore, rol retirado del Job), la ociosa más antigua de ese
        # rol vuelve a envejecer. Umbral 30min = el máximo del criterio C1:
        # con el mecanismo vivo ninguna ociosa pasa de ~15min + retardo.
        # Solo roles cubiertos por P1 (la lista, en role-settings.yaml —
        # cuando P2 añada un rol allí, añadirlo también a este regex): los
        # que aún no tienen timeout (apps de gestoría, skirmshop,
        # whatsappmcp…) son el trabajo de P2 y dispararían de forma cierta
        # desde el primer día.
        - alert: PostgresSharedOldestIdleSession
          expr: >-
            max by (usename) (
              cnpg_idle_sessions_oldest_seconds{namespace="databases",
                usename=~"keep|keycloak|teslamate|langfuse|skirmbooks_ui_app|hindsight|litellm|synapse_engine|synapse_gateway|n8n|n8n_stg|aurora|horarios|sauvage_bot|dgxbench|company_crm|company|catalogo|analisis|opencode_archive|synapse_sre_m2m|synapse_sre_reporter|synapse_agent_m2m"}
            ) > 1800
          for: 5m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: ocioso de +30min del rol {{ $labels.usename }} en postgres-shared
            description: >-
              La conexión idle más antigua de {{ $labels.usename }} lleva
              {{ $value | humanizeDuration }} sin moverse, y con
              idle_session_timeout=15min no debería pasar de ~16min: el
              mecanismo murió para este rol (ALTER perdido tras un restore,
              rol fuera de la lista del Job) o el rol entró en
              role-settings.yaml sin su prueba de reconexión. Mira
              `SELECT pid, state_change, application_name FROM
              pg_stat_activity WHERE usename='{{ $labels.usename }}' AND
              state='idle' ORDER BY state_change` y el último Job
              postgres-shared-role-settings (PostSync, ns databases).

        - alert: PostgresSharedBackendsWaiting
          expr: max by (pod) (cnpg_backends_waiting_total{namespace="databases"}) > 0
          for: 5m
          labels:
            severity: warning
            area: database
            component: postgres-shared
          annotations:
            summary: hay backends esperando un lock en postgres-shared
            description: >-
              {{ $value }} backends llevan 5m bloqueados esperando un lock en
              {{ $labels.pod }}. Suele acompañar a transacciones abandonadas.

    # Guarda de HA y de copias (INFRA-971). El 22-10-2026 el clúster pasó más de
    # un día en Ready=False, «Waiting for the instances to become active» (bucle
    # de pg_rewind del primario caído) y con la copia de las 03:12 fallida
    # (LastBackupSucceeded=False), y no sonó nada: las reglas de conexiones son
    # ciegas a ese estado (el clúster estaba partido, no saturado). Estas dos
    # reglas lo cubren con series que ya scrapea el VMPodScrape de arriba.
    - name: postgres-shared.ha-backup
      rules:
        # Instancia lista = instancia donde el exporter de CNPG recolecta
        # (cnpg_collector_up=1). En el bucle de pg_rewind del 22-10 Postgres no
        # llegaba a subir, así que collector_up se quedaba en 0: exactamente el
        # estado a cazar (sum() sobre series que existen devuelve 0 y dispara).
        # El guard `or vector(0)` se retiró (SC-6651, CRIT-21008 25-11): con
        # VictoriaMetrics en hueco (OOM del vmsingle 23:27) la respuesta
        # vacía-pero-válida hacía evaluar 0 al guard y esta crítica sonaba con
        # Postgres sano — disparó dos veces esa noche (SC-6651 y SC-6659) y
        # volvió a sonar el 31-10 (SC-3831). El caso "todos los pods fuera" lo
        # cubre PostgresSharedMetricsMissing (absent, 10m) y, si la causa es un
        # nodo, KubeNodeNotReady.
        # El 2 es spec.instances (cluster.yaml): si se cambia uno, el otro.
        # Las ventanas de desagote de los nodos de control (04:00/05:00/06:00
        # UTC) promueven el clúster y se recuperan solas; `for: 5m` es el filtro
        # que pidió la sesión problem (INFRA-971).
        - alert: PostgresSharedInstancesNotReady
          expr: >-
            sum(cnpg_collector_up{namespace="databases"}) < 2
          for: 5m
          labels:
            severity: critical
            area: database
            component: postgres-shared
            # sin él, la safety-net de Keep titula el incidente «Crítico en
            # N/A» (agrupa y titula por namespace)
            namespace: databases
          annotations:
            summary: postgres-shared lleva +5m con menos de 2 instancias listas
            description: >-
              Menos de spec.instances (2) instancias con cnpg_collector_up=1: es
              el equivalente a Ready=False, «Waiting for the instances to become
              active» — sin HA, como el 22-10-2026. Mira
              `kubectl get cluster.postgresql.cnpg.io postgres-shared-nvme -n
              databases` y los logs `-c postgres` de la instancia que no
              levanta. Si coincide con la ventana de desagote (04:00-06:00 UTC)
              y no se resuelve solo, no es un switchover.

        # «Copia buena» = la última completada en el catálogo barman. SC-6496
        # (24-11) divide la antigua alerta única en TRES reglas, cada una con
        # su `for`, porque las tres ramas no admitían la misma tolerancia al
        # reintento de la guardia (stuck-backup-guard.yaml, k8s-infra#630):
        # con un daily abortado a mitad y el guard-retry-* en vuelo, la alerta
        # disparaba igual (SC-6027 19-11: el retry completó a las 08:11 UTC y
        # siguió firing; SC-6476 24-11: firing a los 10 min del abort).
        #
        # Semántica MEDIDA el 24-11-2026 contra el clúster (backup
        # postgres-shared-daily-20261123050000: startedAt 05:00:00Z, stoppedAt
        # 09:31:08Z; la métrica del pod-1 = 1795426268 = 09:31:08Z):
        # last_available_backup_timestamp es el FIN (stoppedAt) de la última
        # copia buena, no su inicio; last_failed_backup_timestamp, el momento
        # del fallo (medido: 09:06:09Z = el abort del daily del 24-11).
        # Consecuencia para el umbral: con schedule diario 05:00 UTC
        # (scheduledbackup.yaml), en régimen normal la staleness máxima es 24 h
        # (la copia de hoy renueva la métrica ~24 h después del fin de la de
        # ayer; medido en 7 días: máximo 24 h, sin tocar los 26 h antiguos).
        # Esos 26 h (93600) dejaban solo ~2 h de margen normal y NINGUNO ante
        # un abort: un daily abortado a mitad + el reintento de la guardia
        # completan ~29-33 h después del último fin bueno y disparaban con el
        # guard-retry en vuelo (medido el 24-11: abort 09:06, retry corriendo
        # desde 10:11, firing a las 12:04; y el 19-11: retry completó a las
        # 08:11 UTC y la alerta vieja estuvo true 18 h — simulación
        # query_range en VictoriaMetrics, SC-6496).
        #
        # Un Backup enquistado en walArchivingFailing (como el de las 03:00
        # del 29-10-2026) no mueve ninguno de los dos timestamps y bloquea al
        # ScheduledBackup siguiente: lo caza la regla de staleness (la guardia
        # lo borra a los 30 min y lanza su retry; si aun así no sale copia
        # buena en 40 h, suena).
        #
        # Umbral 40 h (144000) = 24 h de schedule + ~5 h de daily abortado en
        # el peor momento + 2 x (15 min de umbral de la guardia + ~1 h de
        # latencia de arranque del operador tras un rollout + ~5 h de copia) +
        # margen: cubre un abort con UN reintento (medido el 24-11: último fin
        # bueno 09:31 del 23-11 → retry completado 15:18 del 24-11 = 29,8 h) e
        # incluso un segundo reintento tras un retry fallado (~36 h). Si se
        # cambia el schedule o la copia crece mucho, recalcular aquí.
        - alert: PostgresSharedBackupStale
          expr: >-
            time() - max(cnpg_collector_last_available_backup_timestamp{namespace="databases"}) > 144000
          for: 10m
          labels:
            severity: critical
            area: database
            component: postgres-shared
          annotations:
            summary: postgres-shared sin copia buena desde hace +40h
            description: >-
              No hay una copia buena en el catálogo barman desde hace +40h: ni
              el daily ni los reintentos de la guardia (stuck-backup-guard) han
              completado. Revisa `kubectl get backups.postgresql.cnpg.io -n
              databases` (ojo: el nombre corto `backup` resuelve a Longhorn, no
              a CNPG), el `backupPhase` en los logs del operador cnpg-system y
              `cnpg_collector_errors_total`; walArchivingFailing que no avanza
              bloquea la siguiente copia y tumba la consulta del catálogo.

        # Rama de fallo (equivalente en métricas de LastBackupSucceeded=False).
        # Vive separada con `for: 30h` (8h hasta SC-6654) — era el término `failed > available` de
        # la alerta única con for: 10m, que disparaba con el reintento en
        # vuelo (SC-6476). La guardia (informer, INFRA-1555) borra el failed a
        # los 15 min y crea su guard-retry-*, pero el operador puede tardar en
        # arrancarlo: MEDIDO el 24-11 (SC-6476, el rollout de SC-6471 dejó la
        # instancia sin ready) — abort 09:06, el backup del retry arrancó a las
        # 10:11 (1 h 05 min) y completó a las 15:18 → la condición
        # `failed > available` vive 6 h 12 min con el reintento SANO en vuelo.
        # Con for: 6h (primera versión, PR #636) habría disparado a las 15:06,
        # 12 min antes de que el retry completara: el for tiene que cubrir
        # umbral de la guardia + latencia de arranque del operador (hasta ~1 h
        # en un rollout) + duración de la copia (~5 h) + margen → 8 h. Un
        # reintento que va bien renueva available_ts y el pending se reinicia
        # sin disparar. Solo suena cuando el reintento también falla
        # (failed_ts se renueva y la condición no se despeja) o no existe.
        # RE-MEDIDO el 26-11 (SC-6654): el supuesto «el pending se reinicia»
        # no vale cuando el reintento YA completó ese día. 25-11: el retry
        # completó a las 10:07:56 (copia DONE de 82 GiB en el catálogo) y el
        # daily, que iba detrás, registró su intento abortado como failed a las
        # 10:08:01 → failed_ts > available_ts con la guarda bloqueada («already
        # completed today»): nada renueva available hasta el daily de las 05:00
        # del día siguiente (~24 h después). Con for: 8h CUALQUIER intento
        # abortado tras un éxito del día deriva en crítica segura a +8 h con
        # copia buena recién hecha (hubo que reabrir Request por ello). El for
        # tiene que cubrir un ciclo diario completo (~24 h + latencia del
        # siguiente) → 30 h: una rotura real la cazan antes BackupStale (+40 h)
        # y la propia guardia; este término queda para «dos días fallando».
        - alert: PostgresSharedBackupFailed
          expr: >-
            max(cnpg_collector_last_failed_backup_timestamp{namespace="databases"})
            > max(cnpg_collector_last_available_backup_timestamp{namespace="databases"})
          for: 30h
          labels:
            severity: critical
            area: database
            component: postgres-shared
          annotations:
            summary: la última copia de postgres-shared falló y el reintento tampoco saca copia buena
            description: >-
              La última copia registrada en el catálogo falló después de la
              última buena y la condición lleva +30h sin despejarse — dos
              ciclos diarios sin renovar available_ts: el reintento de la
              guardia también falló, no llegó a crearse, o la guarda está
              bloqueada por un éxito previo del mismo día (SC-6654). Mira
              `kubectl get backups.postgresql.cnpg.io -n databases
              --sort-by=.metadata.creationTimestamp` (los guard-retry-* de hoy
              conservados son los intentos), los logs del operador
              cnpg-system y `barman-cloud-backup list` del catálogo: la última
              entrada puede ser DONE y el failed un intento abortado (libro de
              registro, no pérdida de dato).

        # Ceguera: la métrica no existe en ningún pod (INFRA-1457, medido el
        # 19-11). Del 27-10 al 16-11 no hubo copia buena en el catálogo y la
        # alerta dejó de sonar el 30-10 (Keep: último firing 30-10 07:08). Con
        # la cola de copia atascada, la consulta del catálogo del collector
        # fallaba y la métrica desaparecía de los dos pods: sin series,
        # `time() - max(...)` no evalúa y la alerta se queda muda — ceguera de
        # 17 días sobre un problema que ella misma había cazado el día
        # anterior. «No sé si hay copia» suena igual que «no hay copia», de
        # ahí critical y el for corto: aquí no hay reintento que esperar, la
        # ausencia es ya el fallo. Si solo sobrevive la réplica no pasa:
        # exporta 0 y dispara la regla de staleness. (PostgresSharedMetricsMissing
        # no puede cubrirlo: mira cnpg_backends_total, que seguía fluyendo.)
        # SC-6654 (noche del 25-11, CRIT-21012): disparó falsa crítica cuando lo
        # caído era el propio backend (vmsingle OOM 23:01: sin serie fresca,
        # `absent` es cierto para cualquier métrica; ~20 críticas simultáneas).
        # Gate igual que SC-6718/SC-6692: `unless on()` sobre el uptime del
        # propio vmalert — con el backend vivo y el collector caído dispara
        # igual; con el backend ciego la ausencia no es evidencia (la cubre
        # AlertingRulesError).
        - alert: PostgresSharedBackupMetricMissing
          expr: >-
            absent(cnpg_collector_last_available_backup_timestamp{namespace="databases"})
            unless on() absent_over_time(vm_app_uptime_seconds{job="vmalert-vm-victoria-metrics-k8s-stack"}[10m])
          for: 10m
          labels:
            severity: critical
            area: database
            component: postgres-shared
          annotations:
            summary: la métrica de copia de postgres-shared no existe en ningún pod
            description: >-
              Ningún pod exporta cnpg_collector_last_available_backup_timestamp:
              no se sabe si hay copia (ceguera: como del 27-10 al
              16-11-2026, cola atascada y alerta muda 17 días). Revisa el
              VMPodScrape postgres-shared, el endpoint 9187 de los pods y
              `cnpg_collector_errors_total`; una cola de copia atascada tumba
              la consulta del catálogo barman del collector. No dispara si las
              métricas del propio vmalert tampoco llegan a VictoriaMetrics
              (caída del backend — la cubre AlertingRulesError, SC-6654).
