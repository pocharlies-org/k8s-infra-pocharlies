# Rol `keep` en postgres-shared. Keep es el sistema de récord de alertas del
# clúster: su DB guarda alertas, incidentes, workflows y el audit trail, así que
# la política de borrado es Retain igual que el resto.
# Valor en Vault: secret/keep con propiedades DB_USER / DB_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keep-db-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres-role
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keep-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/keep
        property: DB_USER
    - secretKey: password
      remoteRef:
        key: secret/keep
        property: DB_PASSWORD
---
# Rol `aurora`. Ojo con los dos usos de Vault que tiene Aurora, que no son el
# mismo sitio:
#   secret/aurora  -> secretos de arranque que lee ESO (este ExternalSecret).
#                     Tiene que estar en el mount `secret` porque el
#                     ClusterSecretStore vault-backend está anclado ahí.
#   aurora/        -> mount KV propio de Aurora en runtime (VAULT_KV_MOUNT),
#                     donde guarda las credenciales de integraciones de usuario.
#                     Su token está acotado por política a `aurora/*`, así que no
#                     puede leer los secretos del resto del clúster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aurora-db-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres-role
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aurora-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/aurora
        property: DB_USER
    - secretKey: password
      remoteRef:
        key: secret/aurora
        property: DB_PASSWORD
