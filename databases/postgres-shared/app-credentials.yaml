# Rol `keep` en postgres-shared. Keep es el sistema de récord de alertas del
# clúster: su DB guarda alertas, incidentes, workflows y el audit trail, así que
# la política de borrado es Retain igual que el resto.
# Valor en Vault: secret/keep con propiedades DB_USER / DB_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keep-db-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres-role
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: keep-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: keep/DB_USER
    - secretKey: password
      remoteRef:
        key: keep/DB_PASSWORD
---
# Rol `aurora`. Ojo con los dos usos que tiene Aurora, que no son el mismo
# sitio:
#   item `aurora`  -> secretos de arranque que lee ESO (este ExternalSecret),
#                     ya en el vault 1Password k8s-pocharlies (store
#                     onepassword).
#   aurora/        -> mount KV propio de Aurora en runtime (VAULT_KV_MOUNT),
#                     donde guarda las credenciales de integraciones de usuario.
#                     Su token está acotado por política a `aurora/*`, así que no
#                     puede leer los secretos del resto del clúster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aurora-db-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres-role
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: aurora-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: aurora/DB_USER
    - secretKey: password
      remoteRef:
        key: aurora/DB_PASSWORD
---
# DGX benchmark results. Vault entry created 2026-08-04 at secret/dgxbench.
# The dashboard is the only writer and its pool is capped at max_size=3 in
# services/dashboard/bench/db.py, enforced by a test: this cluster runs near 192/400
# with synapse alone holding ~95, and it was saturated outright on 2026-07-28 by an
# unbounded per-pod pool.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dgxbench-db-credentials
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres-role
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: dgxbench-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: dgxbench/DB_USER
    - secretKey: password
      remoteRef:
        key: dgxbench/DB_PASSWORD
    # The dashboard composes BENCH_DATABASE_URL from this the way it composes REDIS_URL.
    - secretKey: DB_PASSWORD
      remoteRef:
        key: dgxbench/DB_PASSWORD
---
# SC-546: credenciales del rol managed `opencode_archive` (destino de archivo de
# la retención de sesiones opencode; timer x86 opencode-archive-prune).
# 1Password item `opencode-archive` (vault k8s-pocharlies) con campos
# DB_USER=opencode_archive / DB_PASSWORD=<vigente desde el 11-09>. El item se
# siembra ANTES del merge (paso explícito del PR): CNPG reconcilia la contraseña
# del managed role desde este Secret, y si llegase a aplicar el rol con otra
# contraseña el timer de x86 se queda sin login.
# cnpg.io/reload: el ejemplo de secret de managed roles de la doc de CNPG lo
# lleva para que el instance manager relea el secret cuando ESO lo refresca.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-archive-db-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres-role
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: opencode-archive-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: opencode-archive/DB_USER
    - secretKey: password
      remoteRef:
        key: opencode-archive/DB_PASSWORD
