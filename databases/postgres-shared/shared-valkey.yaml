# Shared Valkey HA for low-risk shared cache/state tenants.
#
# Scope guard:
# - Do not point ArgoCD, Harbor, or labels/Synapse here.
# - This instance is tuned as a small shared tier: AOF + bounded memory +
#   noeviction, so queue/session metadata is not silently evicted.
# - The Secret `shared-valkey-acl` is intentionally not stored in Git. It must
#   contain: users.acl, replication-password, sentinel-password,
#   sentinel-valkey-password.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-valkey-scripts
  namespace: databases
  labels:
    app: shared-valkey
    app.kubernetes.io/component: shared-valkey
data:
  start-valkey.sh: |
    #!/bin/sh
    set -eu

    HEADLESS="shared-valkey-headless.${POD_NAMESPACE}.svc.cluster.local"
    SENTINEL_SVC="shared-valkey-sentinel.${POD_NAMESPACE}.svc.cluster.local"
    MYFQDN="${POD_NAME}.${HEADLESS}"
    P0FQDN="shared-valkey-0.${HEADLESS}"
    CLI=valkey-cli

    ask_sentinel() {
      $CLI -h "$SENTINEL_SVC" -p 26379 -a "$SENTINEL_PASSWORD" --no-auth-warning \
        sentinel get-master-addr-by-name shared-cache-master 2>/dev/null | head -1 || true
    }

    MASTER_IP=""
    for i in $(seq 1 10); do
      MASTER_IP=$(ask_sentinel)
      [ -n "$MASTER_IP" ] && break
      sleep 2
    done

    COMMON="--port 6379 --dir /data --appendonly yes --appendfsync everysec --save '' --maxmemory 2gb --maxmemory-policy noeviction --aclfile /acl/users.acl --replica-announce-ip ${MYFQDN} --masteruser replication --masterauth ${REPLICATION_PASSWORD}"

    # INFRA-822: never reach --replicaof shared-valkey-0 without proof that 0 is
    # the master. When Sentinel answers "the master is me" (its view survives a
    # pod restart), this pod IS the master: starting it as a replica of pod 0
    # produced circular replication on 04-07 and 10-10 (0 and 2 replicas of each
    # other, shared-valkey-master left without endpoints, Sentinel unable to
    # fail over).
    if [ "$MASTER_IP" = "$MYFQDN" ]; then
      exec valkey-server $COMMON
    fi
    if [ -n "$MASTER_IP" ]; then
      exec valkey-server $COMMON --replicaof "$MASTER_IP" 6379
    fi
    if [ "$POD_NAME" = "shared-valkey-0" ]; then
      exec valkey-server $COMMON
    fi
    # No known master and I am not pod 0: replicate to pod 0 only once its own
    # ROLE says master; otherwise keep waiting for Sentinel to learn the
    # topology instead of guessing.
    while true; do
      R0=$($CLI -h "$P0FQDN" -p 6379 --user sentinel -a "$SENTINEL_VALKEY_PASSWORD" --no-auth-warning role 2>/dev/null | head -1 || true)
      if [ "$R0" = "master" ]; then
        exec valkey-server $COMMON --replicaof "$P0FQDN" 6379
      fi
      MASTER_IP=$(ask_sentinel)
      if [ "$MASTER_IP" = "$MYFQDN" ]; then
        exec valkey-server $COMMON
      fi
      if [ -n "$MASTER_IP" ]; then
        exec valkey-server $COMMON --replicaof "$MASTER_IP" 6379
      fi
      sleep 2
    done
  start-sentinel.sh: |
    #!/bin/sh
    set -eu

    HEADLESS="shared-valkey-headless.${POD_NAMESPACE}.svc.cluster.local"
    CONF=/data/sentinel.conf
    # INFRA-822: stable per-pod myid (sha1 of the pod name). Rewriting the conf
    # without one minted a new myid on every restart, so other Sentinels kept
    # the old entries as ghosts (3 known sentinels in 2 pods on 10-10) and the
    # failover election never reached majority (-failover-abort-not-elected).
    MYID=$(printf '%s' "$POD_NAME" | sha1sum | cut -c1-40)
    cat > "$CONF" <<EOF
    port 26379
    dir /data
    requirepass ${SENTINEL_PASSWORD}
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel myid ${MYID}
    sentinel monitor shared-cache-master shared-valkey-0.${HEADLESS} 6379 2
    sentinel auth-user shared-cache-master sentinel
    sentinel auth-pass shared-cache-master ${SENTINEL_VALKEY_PASSWORD}
    sentinel down-after-milliseconds shared-cache-master 5000
    sentinel failover-timeout shared-cache-master 10000
    sentinel parallel-syncs shared-cache-master 1
    EOF
    exec valkey-sentinel "$CONF"
---
apiVersion: v1
kind: Service
metadata:
  name: shared-valkey-headless
  namespace: databases
  labels:
    app: shared-valkey
    app.kubernetes.io/component: shared-valkey
    metrics.e-dani.com/scrape: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: shared-valkey
  ports:
    - { name: valkey, port: 6379, targetPort: 6379 }
    - { name: sentinel, port: 26379, targetPort: 26379 }
    - { name: metrics, port: 9121, targetPort: 9121 }
---
apiVersion: v1
kind: Service
metadata:
  name: shared-valkey-sentinel
  namespace: databases
  labels:
    app: shared-valkey
    app.kubernetes.io/component: shared-valkey
spec:
  selector:
    app: shared-valkey
  ports:
    - { name: sentinel, port: 26379, targetPort: 26379 }
---
apiVersion: v1
kind: Service
metadata:
  name: shared-valkey-master
  namespace: databases
  labels:
    app: shared-valkey
    app.kubernetes.io/component: shared-valkey
spec:
  selector:
    app: shared-valkey
    valkey-role: master
  ports:
    - { name: valkey, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shared-valkey
  namespace: databases
  labels:
    app: shared-valkey
    app.kubernetes.io/component: shared-valkey
spec:
  serviceName: shared-valkey-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: shared-valkey
  template:
    metadata:
      labels:
        app: shared-valkey
        app.kubernetes.io/component: shared-valkey
    spec:
      enableServiceLinks: false
      nodeSelector: { workload: core }
      affinity:
        podAntiAffinity:
          # required: 3 replicas across the 3 workload=core nodes. Preferred allowed
          # 2 sentinels on one node (seen live 2026-07-21), putting quorum one node
          # failure away from loss.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: shared-valkey } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          command: ["/bin/sh", "/scripts/start-valkey.sh"]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - name: REPLICATION_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-valkey-acl, key: replication-password } }
            - name: SENTINEL_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-valkey-acl, key: sentinel-password } }
            - name: SENTINEL_VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-valkey-acl, key: sentinel-valkey-password } }
          ports:
            - { name: valkey, containerPort: 6379 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /scripts }
            - { name: acl, mountPath: /acl, readOnly: true }
          livenessProbe:
            exec:
              command: ["sh", "-ec", "valkey-cli -p 6379 --user sentinel -a \"$SENTINEL_VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["sh", "-ec", "valkey-cli -p 6379 --user sentinel -a \"$SENTINEL_VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 2560Mi }
        - name: sentinel
          image: valkey/valkey:8-alpine
          command: ["/bin/sh", "/scripts/start-sentinel.sh"]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - name: SENTINEL_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-valkey-acl, key: sentinel-password } }
            - name: SENTINEL_VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-valkey-acl, key: sentinel-valkey-password } }
          ports:
            - { name: sentinel, containerPort: 26379 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /scripts }
          livenessProbe:
            exec:
              command: ["sh", "-ec", "valkey-cli -p 26379 -a \"$SENTINEL_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 96Mi }
        - name: exporter
          image: oliver006/redis_exporter:v1.66.0
          args:
            - --redis.addr=redis://localhost:6379
            - --redis.user=sentinel
            - --redis.password=$(SENTINEL_VALKEY_PASSWORD)
            - --config-command=-
          env:
            - name: SENTINEL_VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-valkey-acl, key: sentinel-valkey-password } }
          ports:
            - { name: metrics, containerPort: 9121 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: scripts
          configMap: { name: shared-valkey-scripts, defaultMode: 0755 }
        - name: acl
          secret:
            secretName: shared-valkey-acl
            items:
              - { key: users.acl, path: users.acl }
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shared-valkey-master-labeler
  namespace: databases
  labels:
    app: shared-valkey-master-labeler
    app.kubernetes.io/component: shared-valkey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-valkey-master-labeler
  namespace: databases
  labels:
    app: shared-valkey-master-labeler
    app.kubernetes.io/component: shared-valkey
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-valkey-master-labeler
  namespace: databases
  labels:
    app: shared-valkey-master-labeler
    app.kubernetes.io/component: shared-valkey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-valkey-master-labeler
subjects:
  - kind: ServiceAccount
    name: shared-valkey-master-labeler
    namespace: databases
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-valkey-master-labeler
  namespace: databases
  labels:
    app: shared-valkey-master-labeler
    app.kubernetes.io/component: shared-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shared-valkey-master-labeler
  template:
    metadata:
      labels:
        app: shared-valkey-master-labeler
        app.kubernetes.io/component: shared-valkey
    spec:
      serviceAccountName: shared-valkey-master-labeler
      enableServiceLinks: false
      nodeSelector: { workload: core }
      containers:
        - name: labeler
          image: alpine/k8s:1.32.5
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              PODS="shared-valkey-0 shared-valkey-1 shared-valkey-2"
              echo "shared-valkey-master-labeler started"
              while true; do
                for p in $PODS; do
                  role=$(kubectl -n databases exec "$p" -c valkey -- sh -c 'valkey-cli -p 6379 --user sentinel -a "$SENTINEL_VALKEY_PASSWORD" --no-auth-warning role' 2>/dev/null | head -1)
                  case "$role" in
                    master) kubectl -n databases label pod "$p" valkey-role=master --overwrite >/dev/null 2>&1 ;;
                    slave)  kubectl -n databases label pod "$p" valkey-role=replica --overwrite >/dev/null 2>&1 ;;
                    *) : ;;
                  esac
                  # INFRA-822: log every role change (the labeler is the only
                  # witness of who was master when; the 04-07 and 10-10 loops
                  # were invisible in its logs).
                  var="PREV_$(printf '%s' "$p" | tr - _)"
                  prev=$(eval "echo \${$var:-}")
                  if [ "$role" != "$prev" ]; then
                    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $p role: ${prev:-unknown} -> ${role:-none}"
                    eval "$var=\$role"
                  fi
                done
                sleep 20
              done
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 128Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-valkey-ingress
  namespace: databases
  labels:
    app: shared-valkey
    app.kubernetes.io/component: shared-valkey
spec:
  podSelector:
    matchLabels:
      app: shared-valkey
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: shared-valkey
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 26379 }
    # blackbox-exporter TCP probe (VMProbe shared-datastores-tcp in
    # k8s-observability): service-level reachability alerting for the shared
    # datastores after the 2026-07-20 silent outage. L4 connect only, no AUTH.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-blackbox-exporter
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: skirmshop
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: affiliate
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: skirmshop-brain-prod
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: skirmshop
          podSelector:
            matchLabels:
              app: firecrawl-api
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: skirmshop
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - skirmbooks-fiscal-validator
                  - skirmbooks-fiscal-validator-validation
                  - skirmbooks-fiscal-validator-analysis
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: control-nexus
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dgx-dashboard-backend
                  # worker dedicado de colas AI Studio (dgx-infra
                  # k8s/control-nexus/dashboard-worker-deployment.yaml) — misma
                  # app, mismo Redis; sin esta entrada el worker recibe
                  # connection refused y las colas image/video/trellis no corren.
                  - dgx-dashboard-worker
                  # Telegram Studio bot (dgx-infra
                  # k8s/control-nexus/dgx-studio-bot-deployment.yaml) — misma red,
                  # mismo Redis de colas/estado (offset getUpdates, FSM, rate-limit);
                  # sin esta entrada el bot recibe connection refused a shared-valkey.
                  - dgx-studio-bot
                  # Private DGX Spark operations bot (dgx-infra
                  # k8s/control-nexus/op-dgx-spark-bot-deployment.yaml). It uses
                  # Valkey only for its Telegram poller lease, dedupe, rate limit
                  # and one-shot user-bound action confirmations.
                  - op-dgx-spark-bot
                  # Productor de vistas del dashboard (dgx-infra
                  # k8s/control-nexus/dashboard-productor-deployment.yaml, SC-2716):
                  # calcula las ranuras de presentación y las publica en dash:v1:*.
                  - dgx-dashboard-productor
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: whatsapp-mcp
          podSelector:
            matchLabels:
              app: whatsapp-connector
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: whatsapp-mcp
          podSelector:
            matchLabels:
              app: whatsapp-connector-professional
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: whatsapp-mcp
          podSelector:
            matchLabels:
              app: mcp-sse
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: libreplay
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - libreplay-web
                  - libreplay-worker
                  - libreplay-db-seed
      ports:
        - { protocol: TCP, port: 6379 }
    # Zammad (spike de evaluación en el namespace zammad, orden de Dani 27-10-2026):
    # cache + colas Sidekiq en el valkey compartido. Si el spike cuaja, acotar a pods
    # concreto y dar de alta el usuario ACL en el item 1Password de users_acl.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zammad
      ports:
        - { protocol: TCP, port: 6379 }
    # oauth2-proxy (SC-2816): sesiones en redis (DB 1) para cortar el 403 en
    # bucle del login. Usuario ACL `oauth2-proxy`, alta en security SC-2817.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - { protocol: TCP, port: 9121 }
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: shared-valkey
  namespace: databases
  labels:
    app: shared-valkey
    app.kubernetes.io/component: shared-valkey
spec:
  selector:
    matchLabels:
      metrics.e-dani.com/scrape: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: shared-valkey
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-valkey
spec:
  groups:
    - name: shared-valkey.cache
      rules:
        - alert: SharedValkeyMetricsMissing
          expr: absent(redis_up{job="shared-valkey-headless"})
          for: 5m
          labels:
            severity: critical
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey metrics are missing"
            description: "No redis_up series for shared-valkey for 5m. The exporter scrape is failing or the shared Valkey pods are down."
        - alert: SharedValkeyScrapeTargetsLow
          expr: count(redis_up{job="shared-valkey-headless"}) < 3
          for: 5m
          labels:
            severity: warning
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey has fewer than 3 scrape targets"
            description: "VictoriaMetrics sees {{ $value }} shared-valkey exporter target(s); expected 3 pods."
        - alert: SharedValkeyExporterDown
          expr: redis_up{job="shared-valkey-headless"} == 0
          for: 2m
          labels:
            severity: critical
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey exporter cannot reach Valkey"
            description: "Exporter target {{ $labels.pod }} reports redis_up=0 for 2m."
        - alert: SharedValkeyMasterCountInvalid
          expr: (count(redis_instance_info{job="shared-valkey-headless",role="master"}) or vector(0)) != 1
          for: 2m
          labels:
            severity: critical
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey master count is invalid"
            description: "Expected exactly one shared-valkey master; current master count is {{ $value }}."
        - alert: SharedValkeyReplicaCountLow
          expr: (max(redis_connected_slaves{job="shared-valkey-headless"}) or vector(0)) < 2
          for: 5m
          labels:
            severity: critical
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey master has fewer than two replicas"
            description: "The current shared-valkey master reports {{ $value }} connected replica(s); expected 2."
        - alert: SharedValkeyMemoryHigh
          expr: max(redis_memory_used_bytes{job="shared-valkey-headless"} / redis_memory_max_bytes{job="shared-valkey-headless"}) > 0.80
          for: 10m
          labels:
            severity: warning
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey memory usage is above 80%"
            description: "shared-valkey memory is above 80% of maxmemory for 10m. With noeviction enabled, clients may start receiving write errors if it fills."
        - alert: SharedValkeyEvictions
          expr: sum(increase(redis_evicted_keys_total{job="shared-valkey-headless"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey is evicting keys"
            description: "shared-valkey evicted {{ $value }} key(s) in the last 10m. During affiliate soak this should stay at 0."
        - alert: SharedValkeyRejectedConnections
          expr: sum(increase(redis_rejected_connections_total{job="shared-valkey-headless"}[5m])) > 0
          for: 0m
          labels:
            severity: critical
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey rejected connections"
            description: "shared-valkey rejected {{ $value }} connection(s) in the last 5m."
        - alert: SharedValkeyAofUnhealthy
          expr: |
            (min(redis_aof_last_bgrewrite_status{job="shared-valkey-headless"}) == 0)
            or
            (min(redis_aof_last_write_status{job="shared-valkey-headless"}) == 0)
          for: 5m
          labels:
            severity: critical
            area: cache
            component: shared-valkey
          annotations:
            summary: "shared-valkey AOF is unhealthy"
            description: "At least one shared-valkey pod reports a failing AOF rewrite or write status for 5m."
