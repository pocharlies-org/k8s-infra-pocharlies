# Ajustes por rol (pg_db_role_setting) que el CRD Cluster de CNPG no expone:
# `spec.managed.roles` gestiona atributos y pertenencias, no GUCs de sesión.
#
# Por qué existe este Job — incidente de saturación del 28-07-2026:
# postgres-shared llegó a 367/400 conexiones. 21 de ellas eran `idle in
# transaction` del rol `keep`, la más antigua de 17h18m, todas paradas en el
# mismo SELECT por PK sobre `alertenrichment`.
#
# La causa está en el upstream de Keep (chart keephq 0.1.96), en
# keep/api/core/db.py::enrich_alert:
#
#     session.commit()
#     session.refresh(enrichment)   # abre una transacción NUEVA
#     return enrichment             # y nadie la cierra
#
# `refresh()` después de `commit()` arranca otra transacción para releer la
# fila, y la función devuelve sin commit ni rollback. La sesión la inyecta el
# llamante, así que la conexión se queda `idle in transaction` indefinidamente
# y su xmin bloquea el vacuum de la base `keep`.
#
# No es código nuestro y la imagen es de terceros, así que la mitigación
# gestionable es cortarlo en el servidor. 5 minutos es dos órdenes de magnitud
# más que cualquier transacción legítima de Keep (todas sub-segundo) y coincide
# con el criterio de aceptación del incidente.
#
# Se aplica SOLO al rol `keep`. Deliberadamente no es un parámetro de cluster:
# `synapse_migration` / `synapse_owner` ejecutan migraciones que pueden quedar
# legítimamente en espera dentro de una transacción (pg_advisory_lock), y
# matarlas a media migración es peor que el problema que arregla.
#
# Requiere DATABASE_POOL_PRE_PING en Keep (KEEP_DB_PRE_PING_ENABLED=true, ya
# puesto en k8s-observability-pocharlies/keep/values.yaml): sin pre-ping, la
# primera reutilización de una conexión cortada por el servidor explota en la
# aplicación en vez de reponerse de forma transparente.
#
# --- INFRA-1295 (P1): idle_session_timeout = 15min por rol -------------------
#
# Segundo ajuste de este Job: `idle_session_timeout = '15min'` para los roles
# cubiertos. Corta en el servidor las conexiones `idle` (fuera de transacción)
# que los pools de los consumidores abandonan y que saturaron postgres-shared
# el 28-07 (~291 ociosas acumuladas, la de keep con 7 días). 15 min es el
# valor fijado por el architect (nota-architect-plan.md de INFRA-1295): dos
# órdenes de magnitud sobre cualquier hueco legítimo entre transacciones y
# margen suficiente para que ninguna ociosa sobreviva a los 30 min del
# criterio C1. El GUC se lee al abrir la sesión (`pg_db_role_setting`), así
# que no requiere restart ni cambia ninguna cadena de conexión.
#
# Limpieza única del backlog tras los ALTER: `ALTER ROLE SET` solo afecta a
# sesiones NUEVAS, así que las ociosas ya acumuladas no mueren sin el
# `pg_terminate_backend` final. Es idempotente (en syncs posteriores devuelve
# 0 filas) y solo mata `state='idle'` — nunca `idle in transaction` — y solo
# de los roles cubiertos. `pg_stat_activity` es vista de clúster desde PG 9.6,
# así que la limpieza alcanza a las sesiones de todas las bases.
#
# REGLA OBLIGATORIA (evita la regresión silenciosa): todo rol nuevo de
# `managed.roles` del cluster.yaml debe añadirse a la lista de ALTERs de este
# Job, o dejar aquí justificada su exclusión.
#
# --- INFRA-1369 (P2): matriz de reconexión por consumidor (C3) ----------------
#
# Regla del architect (nota-architect-plan.md de INFRA-1295): un rol entra en la
# lista SOLO con su prueba B verde (matar backend idle → la siguiente unidad de
# trabajo se completa sin reinicio). Evidencia medida el 25-11-2026, en la
# descripción de la PR de INFRA-1369.
#
# Entran en P2 (prueba verde):
#   - skirmshop — 44 ociosas (la más antigua, 19 h) terminadas de golpe; los
#     apps Prisma (affiliate, bundles, translations, collections-tree, serial,
#     control-panel, nuq) reabrieron 21 conexiones en ~30 s y siguieron
#     sondeando su cola de Jobs; 0 reinicios.
#   - synapse_dispatcher — su LISTEN `outbox_pending` es `state='idle'` por
#     diseño y el código NO re-LISTEN (main.py:321, sin supervisor). Terminada la
#     LISTEN, el bucle principal sobrevive y despacha por su fallback de sondeo
#     (`idle_poll_interval_ms=2000`, main.py:344; escaneo main.py:151): 89 filas
#     del outbox posteriores a la muerte, latencia media 1.00 s / máxima 2.01 s,
#     backlog 0, 0 reinicios. Es la condición de paso que fijó el architect
#     («degrada a latencia de escaneo si el proceso sobrevive»).
#   - synapse_admin — 6 ociosas terminadas; el pool reabrió y la UI responde
#     200; 0 reinicios.
#   - synapse_outbox_gc — Job horario one-shot: adquiere y suelta la conexión
#     por ciclo (main.py:96-97), nunca retiene una sesión idle entre ciclos;
#     último Job `Complete 1/1`. Nada que el timeout pueda alcanzar.
#
# Excluidos a propósito (ni ALTER ni terminate):
#   - synapse_adapter y los roles gestoria_*_app (12) — cada servicio sostiene
#     un LISTEN `tenants_changed` de TenantRegistry (synapse-shared
#     tenant_registry.py), que NO tiene supervisor de reapertura (a diferencia
#     de HandlerConfigCache, que sí lo tiene). Medido el 25-11: terminada la
#     LISTEN de un adapter y la de notifications-alerts, el pool reabrió pero el
#     LISTEN no volvió en >4 min → el snapshot de tenants deja de recargar en
#     caliente hasta el reinicio del pod. Rojo = rol fuera; la corrección
#     (supervisor como `_supervise_listener` de handler_config.py) va en el repo
#     del consumidor, no aquí.
#   - whatsappmcp — el job brain-windows termina el proceso al perder su LISTEN
#     (brain-windows.ts:669, `process.exit(1)`); medido: terminada la LISTEN el
#     pod se reinició (3→4). Con el rol cubierto sería un reinicio cada ≤15 min.
#     (El LISTEN `message_updated` de whatsapp-app SÍ reconecta — change-bus.mjs
#     con backoff — pero la regla es por rol y el rol es compartido.)
#   - skirmshop y skirmbooks_ui_app (INFRA-1586, CRIT-20912) — retirada tras la
#     regresión medida el 25-11 al fusionar #639: el sweep del sync tumbó las
#     ociosas del rol y 4 pods de consumidores `pg` (node-postgres) murieron con
#     el FATAL sin handler y reiniciaron (labels-outbox-relay,
#     labels-pickup-point-reminder, labels-shopify-app — rol skirmshop — y
#     skirmbooks-ui — rol skirmbooks_ui_app), disparando el
#     SkirmshopAppRestartSpike. La prueba B de #639 se midió solo con los
#     consumidores Prisma del rol compartido (reabren, 0 reinicios); los `pg` no
#     sobreviven al corte servidor — mismo caso whatsappmcp: la regla es por rol
#     y el rol es compartido. Rojo = rol fuera; la corrección (manejar el error
#     del pool y reabrir, como los Prisma) va en el repo del consumidor, y
#     entonces el rol vuelve con su prueba B verde.
#   - synapse_app, brain_openwebui_ro — sin conexiones vivas al probar: no se
#     puede medir reconexión; no entran hasta que un consumidor las use y pase B.
#   - synapse_migration, synapse_owner — exclusión permanente: migraciones
#     con pg_advisory_lock (la razón ya documentada arriba).
#   - postgres (superuser: instance manager de CNPG y los propios Job
#     PostSync) y streaming_replica (walsender): nunca.
#
# Para revertir el mecanismo completo:
#   ALTER ROLE <rol> RESET idle_session_timeout;   (por cada rol cubierto)
#
# --- INFRA-1599: bucle de espera de conexión + SQL en ConfigMap ----------------
#
# El 24-11 (SC-6473, mismo fingerprint ARGO-20896) este Job murió al primer
# error mientras el primario estaba saturado (SC-6471/SC-6543): a diferencia de
# sus dos Job PostSync hermanos (agent-transcripts-schema.yaml y
# catalogo-schema.yaml) no tenía bucle de espera y agotaba el backoff con
# `operationState: Failed`. Ahora, como ellos: el contenedor primero espera a
# que el primario responda un `SELECT 1` (60 intentos × 5 s = 5 min) y solo
# entonces corre el SQL; `backoffLimit` 5, como los hermanos. Semántica
# intacta: los ALTER son idempotentes y la limpieza del backlog también.
#
# El SQL deja de ser argumento inline de psql y vive en el ConfigMap
# `postgres-shared-role-settings-sql` (montado en /sql, forma de los hermanos).
# Los comentarios DENTRO del SQL son `--`, nunca `#`: psql no reconoce `#` como
# comentario y revienta con error de sintaxis (INFRA-1369: tres líneas de `#`
# dentro del block scalar → BackoffLimitExceeded en cada sync, incidente
# ARGO-20896 / SC-6618; fix k8s-infra#645). La guardia
# tests/test_postgres_shared_postsync_sql_contract.py falla en CI si reaparece
# una línea de comentario `#` en el SQL que un Job de este directorio pasa a
# psql, en cualquiera de sus dos formas (block scalar del ConfigMap o `-c`).
# Ese mismo test fija además el régimen de ociosas de INFRA-1295 (INFRA-1625):
# cubiertos con su SET, excluidos sin él, keep con su idle_in_transaction y el
# barrido del backlog solo sobre `state = 'idle'` y solo sobre roles cubiertos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-shared-role-settings-sql
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres-role-settings
data:
  setup.sql: |
    -- ALTER ROLE ... SET es idempotente y persiste en el catálogo
    -- (pg_db_role_setting), así que sobrevive a reinicio y failover.
    -- Para revertir: ALTER ROLE keep RESET idle_in_transaction_session_timeout;
    ALTER ROLE keep SET idle_in_transaction_session_timeout = '5min';

    -- idle_session_timeout por rol (INFRA-1295 P1, valor fijado por el
    -- architect: 15min). La lista son los roles cubiertos; los excluidos y su
    -- razón, en el comentario de cabecera del fichero. Todo rol nuevo de
    -- managed.roles entra aquí o justifica su exclusión.
    ALTER ROLE keep SET idle_session_timeout = '15min';
    ALTER ROLE keycloak SET idle_session_timeout = '15min';
    ALTER ROLE teslamate SET idle_session_timeout = '15min';
    ALTER ROLE langfuse SET idle_session_timeout = '15min';
    ALTER ROLE hindsight SET idle_session_timeout = '15min';
    ALTER ROLE litellm SET idle_session_timeout = '15min';
    ALTER ROLE synapse_engine SET idle_session_timeout = '15min';
    ALTER ROLE synapse_gateway SET idle_session_timeout = '15min';
    ALTER ROLE n8n SET idle_session_timeout = '15min';
    ALTER ROLE n8n_stg SET idle_session_timeout = '15min';
    ALTER ROLE aurora SET idle_session_timeout = '15min';
    ALTER ROLE horarios SET idle_session_timeout = '15min';
    ALTER ROLE sauvage_bot SET idle_session_timeout = '15min';
    ALTER ROLE dgxbench SET idle_session_timeout = '15min';
    ALTER ROLE dgxskills SET idle_session_timeout = '15min';
    ALTER ROLE company_crm SET idle_session_timeout = '15min';
    ALTER ROLE company SET idle_session_timeout = '15min';
    ALTER ROLE catalogo SET idle_session_timeout = '15min';
    ALTER ROLE analisis SET idle_session_timeout = '15min';
    ALTER ROLE opencode_archive SET idle_session_timeout = '15min';
    ALTER ROLE synapse_sre_m2m SET idle_session_timeout = '15min';
    ALTER ROLE synapse_sre_reporter SET idle_session_timeout = '15min';
    ALTER ROLE synapse_agent_m2m SET idle_session_timeout = '15min';
    ALTER ROLE synapse_dispatcher SET idle_session_timeout = '15min';
    ALTER ROLE synapse_admin SET idle_session_timeout = '15min';
    ALTER ROLE synapse_outbox_gc SET idle_session_timeout = '15min';

    -- INFRA-1586 (CRIT-20912): el GUC persiste en pg_db_role_setting, así
    -- que sacar el rol de la lista de arriba no lo desarma — hay que
    -- RESETearlo explícitamente. Idempotente (no-op si el rol no lo tiene).
    -- Al fusionar esto, reiniciar además los pods de estos roles abiertos
    -- desde 25-11 06:49Z: sus sesiones actuales llevan el GUC y seguirían
    -- cayendo a los 15 min de ocio.
    ALTER ROLE skirmshop RESET idle_session_timeout;
    ALTER ROLE skirmbooks_ui_app RESET idle_session_timeout;

    -- INFRA-1369 (P2): residuo del SET de P1 en brain_openwebui_ro, que no
    -- tiene prueba B (sin conexiones vivas al medir: no se puede probar
    -- reconexión, cabecera). El GUC persiste en pg_db_role_setting y el
    -- fichero GitOps es la verdad de estado: RESET converge lo vivo con el
    -- fichero. Idempotente (no-op si el rol no lo tiene). synapse_app no
    -- quedó con residuo, no se toca.
    ALTER ROLE brain_openwebui_ro RESET idle_session_timeout;

    -- SC-6040: CONNECTION LIMIT del rol hindsight. El API de Hindsight abre
    -- dos pools (escritura 40 + lectura 40 = 80 conexiones,
    -- k8s-hindsight-pocharlies/k8s/values.yaml); el límite de 50 sin hogar en
    -- GitOps agotaba el acquire de asyncpg (SC-6035/SC-6031). 100 = 80 +
    -- margen de los cron. Idempotente (atributo de rol, no GUC).
    -- Para revertir: ALTER ROLE hindsight CONNECTION LIMIT -1;
    ALTER ROLE hindsight CONNECTION LIMIT 100;

    -- DGX-1022: CONNECTION LIMIT del rol dgxskills. Consumidores: backend y
    -- worker del dashboard, cada uno con un pool asyncpg max_size=3 perezoso.
    -- 5 = 3 del backend + 2 de margen; nunca los dos pools al máximo a la vez.
    -- Idempotente (atributo de rol, no GUC).
    -- Para revertir: ALTER ROLE dgxskills CONNECTION LIMIT -1;
    ALTER ROLE dgxskills CONNECTION LIMIT 5;

    -- Limpieza única del backlog tras los ALTER (INFRA-1295 P1): los
    -- ALTER solo afectan a sesiones nuevas, así que las ociosas ya
    -- acumuladas mueren aquí. Idempotente: en syncs posteriores devuelve
    -- 0 filas. Solo state='idle' (nunca idle in transaction) y solo roles
    -- cubiertos.
    SELECT pg_terminate_backend(pid) FROM pg_stat_activity
    WHERE state = 'idle'
      AND state_change < now() - interval '15 minutes'
      AND usename = ANY (ARRAY[
        'keep', 'keycloak', 'teslamate', 'langfuse',
        'hindsight', 'litellm',
        'synapse_engine', 'synapse_gateway', 'n8n', 'n8n_stg',
        'aurora', 'horarios', 'sauvage_bot', 'dgxbench', 'dgxskills',
        'company_crm', 'company', 'catalogo', 'analisis', 'opencode_archive',
        'synapse_sre_m2m', 'synapse_sre_reporter', 'synapse_agent_m2m',
        'synapse_dispatcher', 'synapse_admin',
        'synapse_outbox_gc']);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-shared-role-settings
  namespace: databases
  annotations:
    # PostSync y no Sync: el hook corre cuando el Cluster ya está aplicado y
    # sano. Si esto fuese un hook de Sync, un postgres caído bloquearía el
    # propio sync que tiene que levantarlo.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # 5, como los Job PostSync hermanos: el bucle de abajo ya cubre una
  # indisponibilidad de hasta 5 min por intento (INFRA-1599).
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: shared-infrastructure
        app.kubernetes.io/component: postgres-role-settings
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:17.5
          env:
            - name: PGHOST
              value: postgres-shared-rw.databases.svc.cluster.local
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-shared-superuser, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-shared-superuser, key: password }
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              ok=0
              for i in $(seq 1 60); do
                if psql -v ON_ERROR_STOP=1 -Atc 'SELECT 1' >/dev/null 2>&1; then
                  ok=1; break
                fi
                sleep 5
              done
              if [ "$ok" != 1 ]; then
                echo "postgres-shared no responde tras 5 min (primario caído o saturado)" >&2
                exit 1
              fi
              psql -v ON_ERROR_STOP=1 -f /sql/setup.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: sql
          configMap:
            name: postgres-shared-role-settings-sql
