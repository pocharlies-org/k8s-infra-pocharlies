# Ajustes por rol (pg_db_role_setting) que el CRD Cluster de CNPG no expone:
# `spec.managed.roles` gestiona atributos y pertenencias, no GUCs de sesión.
#
# Por qué existe este Job — incidente de saturación del 28-07-2026:
# postgres-shared llegó a 367/400 conexiones. 21 de ellas eran `idle in
# transaction` del rol `keep`, la más antigua de 17h18m, todas paradas en el
# mismo SELECT por PK sobre `alertenrichment`.
#
# La causa está en el upstream de Keep (chart keephq 0.1.96), en
# keep/api/core/db.py::enrich_alert:
#
#     session.commit()
#     session.refresh(enrichment)   # abre una transacción NUEVA
#     return enrichment             # y nadie la cierra
#
# `refresh()` después de `commit()` arranca otra transacción para releer la
# fila, y la función devuelve sin commit ni rollback. La sesión la inyecta el
# llamante, así que la conexión se queda `idle in transaction` indefinidamente
# y su xmin bloquea el vacuum de la base `keep`.
#
# No es código nuestro y la imagen es de terceros, así que la mitigación
# gestionable es cortarlo en el servidor. 5 minutos es dos órdenes de magnitud
# más que cualquier transacción legítima de Keep (todas sub-segundo) y coincide
# con el criterio de aceptación del incidente.
#
# Se aplica SOLO al rol `keep`. Deliberadamente no es un parámetro de cluster:
# `synapse_migration` / `synapse_owner` ejecutan migraciones que pueden quedar
# legítimamente en espera dentro de una transacción (pg_advisory_lock), y
# matarlas a media migración es peor que el problema que arregla.
#
# Requiere DATABASE_POOL_PRE_PING en Keep (KEEP_DB_PRE_PING_ENABLED=true, ya
# puesto en k8s-observability-pocharlies/keep/values.yaml): sin pre-ping, la
# primera reutilización de una conexión cortada por el servidor explota en la
# aplicación en vez de reponerse de forma transparente.
#
# --- INFRA-1295 (P1): idle_session_timeout = 15min por rol -------------------
#
# Segundo ajuste de este Job: `idle_session_timeout = '15min'` para los roles
# cubiertos. Corta en el servidor las conexiones `idle` (fuera de transacción)
# que los pools de los consumidores abandonan y que saturaron postgres-shared
# el 28-07 (~291 ociosas acumuladas, la de keep con 7 días). 15 min es el
# valor fijado por el architect (nota-architect-plan.md de INFRA-1295): dos
# órdenes de magnitud sobre cualquier hueco legítimo entre transacciones y
# margen suficiente para que ninguna ociosa sobreviva a los 30 min del
# criterio C1. El GUC se lee al abrir la sesión (`pg_db_role_setting`), así
# que no requiere restart ni cambia ninguna cadena de conexión.
#
# Limpieza única del backlog tras los ALTER: `ALTER ROLE SET` solo afecta a
# sesiones NUEVAS, así que las ociosas ya acumuladas no mueren sin el
# `pg_terminate_backend` final. Es idempotente (en syncs posteriores devuelve
# 0 filas) y solo mata `state='idle'` — nunca `idle in transaction` — y solo
# de los roles cubiertos. `pg_stat_activity` es vista de clúster desde PG 9.6,
# así que la limpieza alcanza a las sesiones de todas las bases.
#
# REGLA OBLIGATORIA (evita la regresión silenciosa): todo rol nuevo de
# `managed.roles` del cluster.yaml debe añadirse a la lista de ALTERs de este
# Job, o dejar aquí justificada su exclusión.
#
# Excluidos a propósito (ni ALTER ni terminate):
#   - synapse_dispatcher, synapse_adapter — mantienen conexiones LISTEN que
#     están en `state='idle'` por diseño; entrarán en P2 solo tras pasar la
#     prueba de reconexión (matar backend idle → siguiente unidad de trabajo
#     sin reinicio del pod).
#   - synapse_migration, synapse_owner — exclusión permanente: migraciones
#     con pg_advisory_lock (la razón ya documentada arriba).
#   - postgres (superuser: instance manager de CNPG y los propios Job
#     PostSync) y streaming_replica (walsender): nunca.
#
# Para revertir el mecanismo completo:
#   ALTER ROLE <rol> RESET idle_session_timeout;   (por cada rol cubierto)
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-shared-role-settings
  namespace: databases
  annotations:
    # PostSync y no Sync: el hook corre cuando el Cluster ya está aplicado y
    # sano. Si esto fuese un hook de Sync, un postgres caído bloquearía el
    # propio sync que tiene que levantarlo.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: shared-infrastructure
        app.kubernetes.io/component: postgres-role-settings
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:17.5
          env:
            - name: PGHOST
              value: postgres-shared-rw.databases.svc.cluster.local
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-shared-superuser, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-shared-superuser, key: password }
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            # ALTER ROLE ... SET es idempotente y persiste en el catálogo
            # (pg_db_role_setting), así que sobrevive a reinicio y failover.
            # Para revertir: ALTER ROLE keep RESET idle_in_transaction_session_timeout;
            - -c
            - ALTER ROLE keep SET idle_in_transaction_session_timeout = '5min';
            # idle_session_timeout por rol (INFRA-1295 P1, valor fijado por el
            # architect: 15min). La lista son los roles cubiertos; los
            # excluidos y su razón, en el comentario de cabecera. Todo rol
            # nuevo de managed.roles entra aquí o justifica su exclusión.
            - -c
            - |
              ALTER ROLE keep SET idle_session_timeout = '15min';
              ALTER ROLE keycloak SET idle_session_timeout = '15min';
              ALTER ROLE teslamate SET idle_session_timeout = '15min';
              ALTER ROLE langfuse SET idle_session_timeout = '15min';
              ALTER ROLE skirmbooks_ui_app SET idle_session_timeout = '15min';
              ALTER ROLE hindsight SET idle_session_timeout = '15min';
              ALTER ROLE litellm SET idle_session_timeout = '15min';
              ALTER ROLE synapse_engine SET idle_session_timeout = '15min';
              ALTER ROLE synapse_gateway SET idle_session_timeout = '15min';
              ALTER ROLE n8n SET idle_session_timeout = '15min';
              ALTER ROLE n8n_stg SET idle_session_timeout = '15min';
              ALTER ROLE aurora SET idle_session_timeout = '15min';
              ALTER ROLE horarios SET idle_session_timeout = '15min';
              ALTER ROLE sauvage_bot SET idle_session_timeout = '15min';
              ALTER ROLE dgxbench SET idle_session_timeout = '15min';
              ALTER ROLE company_crm SET idle_session_timeout = '15min';
              ALTER ROLE catalogo SET idle_session_timeout = '15min';
              ALTER ROLE analisis SET idle_session_timeout = '15min';
              ALTER ROLE opencode_archive SET idle_session_timeout = '15min';
              ALTER ROLE synapse_sre_m2m SET idle_session_timeout = '15min';
              ALTER ROLE synapse_sre_reporter SET idle_session_timeout = '15min';
              ALTER ROLE synapse_agent_m2m SET idle_session_timeout = '15min';
            # --- SC-6040: CONNECTION LIMIT del rol hindsight -------------------
            # El API de Hindsight abre dos pools (escritura 40 + lectura 40 = 80
            # conexiones, k8s-hindsight-pocharlies/k8s/values.yaml). El rol se
            # creó el 17-10 (INFRA-940) con CONNECTION LIMIT 50 sin hogar en
            # GitOps: en una ronda de consolidación el pool no puede crecer de
            # 50, el acquire de asyncpg agota su timeout (30 s), el poller se
            # auto-apaga ("shutting worker down so the task is recovered on
            # restart") y la API queda caída ~14 min por ciclo — 16 reinicios
            # del 17 al 19-11, causa de SC-6035 y SC-6031. 100 = 80 de los dos
            # pools + margen de los cron. Idempotente (atributo de rol, no GUC).
            # Para revertir: ALTER ROLE hindsight CONNECTION LIMIT -1;
            - -c
            - ALTER ROLE hindsight CONNECTION LIMIT 100;
            # Limpieza única del backlog tras los ALTER (INFRA-1295 P1): los
            # ALTER solo afectan a sesiones nuevas, así que las ociosas ya
            # acumuladas mueren aquí. Idempotente: en syncs posteriores
            # devuelve 0 filas. Solo state='idle' (nunca idle in transaction)
            # y solo roles cubiertos.
            - -c
            - |
              SELECT pg_terminate_backend(pid) FROM pg_stat_activity
              WHERE state = 'idle'
                AND state_change < now() - interval '15 minutes'
                AND usename = ANY (ARRAY[
                  'keep', 'keycloak', 'teslamate', 'langfuse',
                  'skirmbooks_ui_app', 'hindsight', 'litellm',
                  'synapse_engine', 'synapse_gateway', 'n8n', 'n8n_stg',
                  'aurora', 'horarios', 'sauvage_bot', 'dgxbench',
                  'company_crm', 'catalogo', 'analisis', 'opencode_archive',
                  'synapse_sre_reporter', 'synapse_agent_m2m']);
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
