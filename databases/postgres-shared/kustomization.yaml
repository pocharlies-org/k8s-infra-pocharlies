apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
resources:
  - namespace.yaml
  - priorityclass.yaml
  - ovh-credentials.yaml
  - app-credentials.yaml
  # SC-6611: credencial del rol synapse_reloj (generada aquí y copiada a 1Password).
  - synapse-reloj-credentials.yaml
  - cluster.yaml
  - services-alias.yaml
  - app-databases.yaml
  - agent-transcripts-schema.yaml
  - catalogo-schema.yaml
  - role-settings.yaml
  - monitoring.yaml
  - aurora-rca-coverage-queries.yaml
  - catalogo-freshness-queries.yaml
  - idle-sessions-queries.yaml
  - role-connections-queries.yaml
  - shared-rabbitmq.yaml
  - shared-rabbitmq-ext.yaml
  - synapse-rmq-sauvage.yaml
  - shared-valkey-secrets.yaml
  - shared-valkey.yaml
  - scheduledbackup.yaml
  - stuck-backup-guard.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: shared-infrastructure
      app.kubernetes.io/managed-by: argocd
