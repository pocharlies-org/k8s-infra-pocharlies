apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-shared-nvme
  namespace: databases
  annotations:
    # Bump only by PR after the corresponding ExternalSecrets are healthy.
    # This makes CNPG re-read passwordSecret when a role was first observed
    # before ESO had materialized its Secret.
    synapse.e-dani.com/agent-role-credentials-generation: "2"
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
    app.kubernetes.io/component: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true

  postgresql:
    parameters:
      # Resized 2026-06-08 for synapse-stack migration from docker shared-postgres
      # (see plans/shared-stores-migration-from-sauvage.md §1.1).
      # 41 synapse services × pool_size 5 = 205 connections projected; max_connections 400 = ×1.95 headroom.
      # shared_buffers 1Gi (12.5% of 8Gi mem limit) absorbs litellm full-scan working set
      # which was OOM-killing pod with 256MB / 2Gi (root cause documented in plan §12.2).
      # INFRA-942 (2026-10-19): 1GB -> 4GB. Hindsight (4.2 GB, pgvector) leía de disco (IO.DataFileRead) con el
      # bloqueo de su bank tomado; el límite sube a 10Gi para dejar a los backends el margen que tenían.
      max_connections: "400"
      shared_buffers: "4GB"
      effective_cache_size: "7GB"
      work_mem: "32MB"
      maintenance_work_mem: "256MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "32MB"
      default_statistics_target: "100"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      # Logical replication prerequisites (Fase 2 of synapse-stack migration).
      # max_replication_slots kept at upstream CNPG default (32) to avoid regression;
      # max_wal_senders bumped from default 10 to 20 to cover 7 synapse role PUBLICATIONs
      # + walreceivers (replica + barman archive) with headroom.
      wal_level: "logical"
      max_wal_senders: "20"
      max_replication_slots: "32"

      # ── Volumen de WAL (2026-08-11) ────────────────────────────────────
      # MEDIDO: 7.028 segmentos archivados en 7 días = ~16 GB/día de WAL
      # para una base de datos que ENTERA ocupa 15 GB. Por eso el archivo de
      # barman llegó a ~460 GB con 30 días de retención.
      #
      # No es volumen de datos, son imágenes de página completa. Con
      # full_page_writes=on, el primer cambio a una página DESPUÉS de cada
      # checkpoint mete los 8 KB enteros en el WAL. Con checkpoint_timeout a
      # 5 min y max_wal_size a 1 GB los checkpoints eran constantes, y la
      # carga es de UPDATE puro (competitor_intel 9,5 M updates, synapse
      # 3,2 M, back_in_stock 1,9 M sobre una base de 27 MB), así que se
      # reescribían las mismas páginas una y otra vez.
      #
      # Espaciar los checkpoints reduce cuántas páginas completas se emiten;
      # wal_compression las comprime antes de escribirlas, así que baja el
      # WAL en disco Y lo archivado. zstd está disponible en PG 17.
      # Los tres son SIGHUP: no reinician el cluster.
      wal_compression: "zstd"
      checkpoint_timeout: "15min"
      max_wal_size: "4GB"
      min_wal_size: "1GB"

  # INFRA-942 (2026-10-22): longhorn -> local-path-retain. Las réplicas de Longhorn
  # se morían y con ellas el volumen del cluster (postgres-shared-4 no pudo hacer
  # pg_rewind: WAL perdido), y todo el I/O de Hindsight (IO.DataFileRead) pasaba por
  # Longhorn. local-path-retain escribe en el NVMe del propio nodo (los ks5-cp tienen
  # un solo disco NVMe; /opt/local-path-provisioner está en él) y conserva el PV al
  # borrar el PVC. La HA no la da el disco sino la replicación en streaming de CNPG:
  # las 2 instancias siguen en nodos distintos por la anti-afinidad requerida de abajo.
  # Tamaños: 46 GB de bases hoy; 80Gi + 20Gi de WAL por instancia caben en cualquier
  # ks5-cp (cp-1 es el más justo: ~199 GB libres). Si un nodo se pierde, se recupera
  # del storage local del nodo o de barman; el PV se conserva al borrar el PVC.
  storage:
    storageClass: local-path-retain
    size: 80Gi

  walStorage:
    storageClass: local-path-retain
    size: 20Gi

  # INFRA-942 (2026-10-23): réplica en streaming del cluster viejo. Copia los
  # 46 GB con producción viva y se queda en streaming; al promoverlo (replica.enabled
  # a false) el corte son minutos en vez del restore de barman (~2 h).
  replica:
    enabled: true
    source: postgres-shared-primary

  bootstrap:
    pg_basebackup:
      source: postgres-shared-primary

  externalClusters:
    - name: postgres-shared-primary
      connectionParameters:
        host: postgres-shared-rw.databases.svc.cluster.local
        port: "5432"
        dbname: postgres
        user: streaming_replica
        sslmode: verify-full
      # El usuario streaming_replica se autentica con certificado de cliente
      # (el secreto postgres-shared-replication es kubernetes.io/tls, no tiene password).
      sslRootCert:
        name: postgres-shared-ca
        key: ca.crt
      sslCert:
        name: postgres-shared-replication
        key: tls.crt
      sslKey:
        name: postgres-shared-replication
        key: tls.key

  # 2026-08-07: after a cordon the primary took 123 min and 452 attempts to find
  # a node. Preempt ordinary workloads instead of queueing behind them.
  priorityClassName: data-critical

  affinity:
    # required: with only 2 instances, co-location turns one node failure into a
    # full outage with no failover target (incident 2026-07-20: both instances on
    # the frozen `ubuntu` node, 9h down). A visible Pending beats silent co-location.
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
    nodeSelector:
      kubernetes.io/arch: amd64
      # 2026-07-29: required anti-affinity (above) stopped co-location but still
      # allowed one instance — the primary — to sit on `ubuntu`, the dev box that
      # reboots. It did, and its 01:12 CEST reboot forced a failover. workload=core
      # keeps the cluster on the ks5 pool; dev/edge nodes are workload=cpu.
      workload: core
