# INFRA-942 (2026-10-23): CNPG no permite renombrar un Cluster, así que el cluster
# nuevo se llama postgres-shared-nvme y sus servicios también. Estos tres alias
# mantienen los nombres que ya usan ~30 consumidores (postgres-shared-rw sobre todo).
# Selectores y puertos copiados de los que crea el operador para el cluster.
apiVersion: v1
kind: Service
metadata:
  name: postgres-shared-rw
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgres-shared-nvme
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-shared-ro
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgres-shared-nvme
    cnpg.io/instanceRole: replica
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-shared-r
  namespace: databases
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgres-shared-nvme
    cnpg.io/podRole: instance
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
