# SC-6611 (SC-5806 ola 2, fase 0): credencial del rol CNPG `synapse_reloj`, el del reloj único
# synapse-reloj (repo synapse, migración 0124_reloj.sql; despliegue en k8s-synapse-pocharlies).
#
# La contraseña nace aquí, una sola vez (generador Password + ExternalSecret CreatedOnce, el
# patrón de k8s-synapse-pocharlies/k8s/synapse2/secretos.yaml): CNPG la lee de
# `synapse-reloj-db-credentials` (passwordSecret del rol en cluster.yaml) y la PushSecret la
# copia a 1Password (bóveda k8s-pocharlies, item `synapse-postgres-synapse_reloj`, campo
# DB_PASSWORD, `IfNotExists`: nunca pisa un valor que ya esté allí), de donde la lee el
# ExternalSecret del namespace synapse. No rota sola: una contraseña nueva es borrar este
# Secret y el item a la vez (CNPG reconcilia la contraseña del rol desde el Secret).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: synapse-reloj-clave
  namespace: databases
  annotations:
    # Antes que el ExternalSecret (onda -1): ArgoCD espera a que una onda esté sana antes de aplicar la
    # siguiente, y el ExternalSecret no lo está sin su generador (medido 25-11: «unable to get generator»).
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: postgres-role
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-reloj-db-credentials
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: postgres-role
spec:
  refreshInterval: "0"
  refreshPolicy: CreatedOnce
  target:
    name: synapse-reloj-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: synapse_reloj
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: synapse-reloj-clave
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: synapse-reloj-db-credentials
  namespace: databases
  labels:
    app.kubernetes.io/component: postgres-role
spec:
  refreshInterval: 24h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: synapse-reloj-db-credentials
  data:
    - conversionStrategy: None
      match:
        secretKey: password
        remoteRef:
          remoteKey: synapse-postgres-synapse_reloj
          property: DB_PASSWORD
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: concealed
          tags:
            - synapse
            - postgres
