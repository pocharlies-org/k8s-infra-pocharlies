apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-valkey-acl
  namespace: databases
  labels:
    app.kubernetes.io/name: shared-valkey
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: shared-valkey-acl
    # Adopt and reconcile the existing manually-created Secret without making
    # credential availability depend on deleting/recreating the StatefulSet's
    # mounted Secret during the migration.
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          # ESO otherwise copies the ExternalSecret tracking annotation to its
          # generated Secret. ArgoCD then mistakes that child for an extraneous
          # GitOps resource and reports the whole application OutOfSync.
          argocd.argoproj.io/tracking-id: ""
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  # Secret projection alone does not change the in-memory ACL of a running
  # Valkey process. After this ExternalSecret reports Ready for its current
  # generation, run scripts/valkey/activate-shared-valkey-acl.sh before any
  # workload starts using the newly provisioned account.
  data:
    - secretKey: users.acl
      remoteRef:
        key: databases/shared-valkey-acl
        property: users_acl
    - secretKey: replication-password
      remoteRef:
        key: databases/shared-valkey-acl
        property: replication_password
    - secretKey: sentinel-password
      remoteRef:
        key: databases/shared-valkey-acl
        property: sentinel_password
    - secretKey: sentinel-valkey-password
      remoteRef:
        key: databases/shared-valkey-acl
        property: sentinel_valkey_password
