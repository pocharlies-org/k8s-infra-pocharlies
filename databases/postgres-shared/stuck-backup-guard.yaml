# INFRA-1032: guardia anti-atasco de copias CNPG (patrón: kubernetes/workloads/sauvage-zombie-watchdog.yaml).
# Un Backup hijo del ScheduledBackup en fase no terminal corta el reconcile del ScheduledBackup entero
# (operador CNPG v1.29.1, scheduledbackup_controller.go; upstream #4361/#10385/#10745) y la copia diaria
# deja de salir días. Borrar el CR atascado NO recrea la franja del día (lastScheduleTime ya registrado),
# por eso la guardia borra el atasco Y crea un Backup suyo (guard-retry-*) que NO es hijo.
# SC-6476 (24-11-2026): el daily falló a las 09:06 (rollout de SC-6471 mató el instance manager que lo
# llevaba), la guardia lo borró a las 09:15 y NO creó retry: el cluster ya no tenía filas de hoy y el bucle
# nacía solo de los Backup existentes. Desde hoy los clusters debidos salen además de los ScheduledBackup que
# dispararon hoy, y los retries fallados del propio día se conservan (no se borran) para que el tope de 4
# intentos siga siendo real.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-scheduled-backup-guard
  namespace: databases
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-scheduled-backup-guard
  namespace: databases
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["scheduledbackups"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-scheduled-backup-guard
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-scheduled-backup-guard
subjects:
  - kind: ServiceAccount
    name: cnpg-scheduled-backup-guard
    namespace: databases
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-scheduled-backup-guard
  namespace: databases
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-scheduled-backup-guard
        spec:
          serviceAccountName: cnpg-scheduled-backup-guard
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: guard
              image: alpine/k8s:1.32.5
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  now="$(date -u +%s)"
                  # busybox date no parsea ISO con -d: el corte se calcula desde epoch y se compara lexicográficamente.
                  cut30="$(date -u -d "@$((now - 1800))" +%Y-%m-%dT%H:%M:%SZ)"
                  cut15="$(date -u -d "@$((now - 900))" +%Y-%m-%dT%H:%M:%SZ)"
                  cut7d="$(date -u -d "@$((now - 604800))" +%Y-%m-%dT%H:%M:%SZ)"
                  today="$(date -u +%Y-%m-%d)"
                  work="$(mktemp -d)"
                  trap 'rm -rf "$work"' EXIT

                  list_backups() {
                    kubectl get backups.postgresql.cnpg.io -n databases -l "$1" \
                      -o custom-columns=NAME:.metadata.name,CLUSTER:.spec.cluster.name,PHASE:.status.phase,CREATED:.metadata.creationTimestamp \
                      --no-headers 2>/dev/null || true
                  }

                  list_backups 'cnpg.io/scheduled-backup' > "$work/all"
                  list_backups 'cnpg.io/guard-retry=true' >> "$work/all"

                  # Atascos: walArchivingFailing > 30 min (terminal en la práctica, el operador no la despeja),
                  # failed > 15 min; y housekeeping de guard-retry-* de hace más de 7 días.
                  # SC-6476: los guard-retry-* nacidos HOY se conservan aunque fallen (solo se borran al
                  # housekeeping de 7 días): son la memoria de intentos del día; borrarlos dejaba al cluster
                  # sin filas de hoy y al bucle, sin nada que reintentar (el hueco de este incidente).
                  awk -v c30="$cut30" -v c15="$cut15" -v c7="$cut7d" -v today="$today" '
                    {
                      stuck = (($3=="walArchivingFailing" && $4!="" && $4<c30) || ($3=="failed" && $4!="" && $4<c15))
                      retry_today = ($1 ~ /^guard-retry-/ && $4!="" && substr($4,1,10)==today)
                      old_retry = ($1 ~ /^guard-retry-/ && $4!="" && $4<c7)
                      if ((stuck && !retry_today) || old_retry) print $1
                    }
                  ' "$work/all" > "$work/del"
                  while read -r name; do
                    [ -n "$name" ] || continue
                    kubectl delete backups.postgresql.cnpg.io -n databases "$name" --wait=false
                    echo "GUARD: deleted stuck backup $name"
                  done < "$work/del"

                  # SC-6476: estado del día tomado de $work/all (anterior a los borrados), para que un
                  # daily fallado borrado en este mismo tick cuente como intento y genere el retry en el
                  # acto. Debidos = clusters con filas hoy + clusters cuyo ScheduledBackup disparó hoy hace
                  # más de 15 min (si a los 15 min el operador no ha creado aún el hijo, algo no va; antes
                  # de eso no se crea: es la carrera SC-6103 con el nacimiento del daily).
                  awk -v today="$today" '$4 ~ "^"today {print $2}' "$work/all" > "$work/due"
                  kubectl get scheduledbackups.postgresql.cnpg.io -n databases \
                    -o custom-columns=CLUSTER:.spec.cluster.name,LAST:.status.lastScheduleTime \
                    --no-headers 2>/dev/null \
                    | awk -v today="$today" -v c15="$cut15" '$1!="" && $2!="" && $2 ~ "^"today && $2<c15 {print $1}' >> "$work/due"
                  sort -u "$work/due" -o "$work/due"
                  while read -r cluster; do
                    [ -n "$cluster" ] || continue
                    awk -v c="$cluster" -v today="$today" '$2==c && $4 ~ "^"today' "$work/all" > "$work/rows"
                    if awk '$3=="completed"{found=1} END{exit !found}' "$work/rows"; then
                      echo "GUARD: cluster $cluster already completed today, nothing to do"
                      continue
                    fi
                    # SC-6103: no crear un retry mientras el operador ya tiene un backup suyo en curso hoy.
                    # El 20-11-2026 la guardia corrió a las 05:00, justo cuando nacía el daily: creó un
                    # guard-retry 7 s después y el operador arrancó los dos a la vez (carrera). Dos
                    # barman-cloud-backup de 227 GB en paralelo sobre la misma réplica no acababan ninguno,
                    # saturaban el I/O (scrape del exporter con timeout, cola atascada) y cada tick de la
                    # guardia creaba otro retry: tormenta sobre el atasco. Un atasco real de fase terminal
                    # (failed) lo borra la regla de arriba y el retry nace en el acto (SC-6476); uno
                    # enquistado en pending/running/walArchivingFailing +26 h lo caza
                    # PostgresSharedBackupStale y lo despeja IT: hoy no se crean más retries sobre él.
                    if awk '$3=="pending" || $3=="running" || $3=="walArchivingFailing"{found=1} END{exit !found}' "$work/rows"; then
                      echo "GUARD: cluster $cluster has a backup in progress or wedged today, nothing to do"
                      continue
                    fi
                    attempts="$(wc -l < "$work/rows" | tr -d ' ')"
                    if [ "$attempts" -ge 4 ]; then
                      echo "GUARD: cluster $cluster has $attempts attempts today, not retrying"
                      continue
                    fi
                    stamp="$(date -u +%Y%m%d%H%M)"
                    name="guard-retry-$cluster-$stamp"
                    kubectl apply -f - <<EOF
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Backup
                  metadata:
                    name: $name
                    namespace: databases
                    labels:
                      cnpg.io/guard-retry: "true"
                  spec:
                    method: barmanObjectStore
                    cluster:
                      name: $cluster
                  EOF
                    echo "GUARD: created $name (cluster $cluster, attempts today before this one: $attempts)"
                  done < "$work/due"
