---
# The role wrote config.yaml but never restarted k3s, so any edit to the
# template was a silent no-op until someone rebooted the node. The playbook
# runs with serial: 1, so this restart is rolling across the control plane.
- name: Restart k3s after config change
  ansible.builtin.service:
    name: k3s
    state: restarted

# registries.yaml is read by the k3s agent only at startup (INFRA-1099).
# `sudo -n systemctl` is NOPASSWD on the KS-5 nodes, so no ansible become.
- name: Restart k3s after registries change
  ansible.builtin.command: sudo -n systemctl restart k3s
  changed_when: true
