---
# Harbor registries.yaml for OVH nodes (INFRA-1099). Gated by
# harbor_registries_enabled, so home nodes running this role are untouched.
- ansible.builtin.include_tasks: registries.yml
- ansible.builtin.include_tasks: config.yml

- name: Install k3s server
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server
    creates: /usr/local/bin/k3s

- name: Ensure k3s is running
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Wait for local API
  ansible.builtin.command: k3s kubectl get --raw=/readyz
  register: readyz
  retries: 30
  delay: 10
  until: readyz.rc == 0
  changed_when: false
