# KS-5 control planes reached over the tailnet. The generated inventory
# (generated/ks5.ini) carries the OVH public IPs, but public SSH (:22) is
# closed by the tailscale-only hardening (2026-05-30) — day-2 playbooks must
# connect through these FQDNs instead.
[ks5_control_plane]
ks5-cp-1 ansible_host=ks5-cp-1.taile0ad27.ts.net edge_wan_interface=enp3s0f0
ks5-cp-2 ansible_host=ks5-cp-2.taile0ad27.ts.net edge_wan_interface=enp3s0f0
ks5-cp-3 ansible_host=ks5-cp-3.taile0ad27.ts.net edge_wan_interface=eno1

[ks5_control_plane:vars]
ansible_user=ubuntu

# The guard is deployed only over the Tailnet. It never relies on direct
# public SSH. Sauvage is intentionally included because it also hosts k3s
# edge workloads and has exposed Kubernetes-managed ports in the past.
[edge_wan_workers]
sauvage ansible_host=100.109.183.9 edge_wan_interface=enp5s0f0

[edge_wan_workers:vars]
ansible_user=ubuntu

# Atlantic: OVH heavy CPU worker (joined 2026-10-24, INFRA-991). Reached over
# the tailnet; enable-atlantic-longhorn.yml targets this host. Sauvage joined
# this group with INFRA-1099: it is an OVH node too and must not pull Harbor
# images through the house LAN.
[ovh_workers]
atlantic ansible_host=100.124.19.90
# ubuntu@sauvage: full sudo requires a password not in 1Password (INFRA-937),
# but NOPASSWD `docker` and `systemctl` are granted. The registries role
# writes the file through a root docker container there (see
# ansible/roles/k3s_worker/tasks/registries.yml).
sauvage ansible_host=100.109.183.9 registries_write_via_docker=true

[ovh_workers:vars]
ansible_user=ubuntu

# Every node that must get /etc/rancher/k3s/registries.yaml with the Harbor
# mirrors to the edge (ansible/playbooks/apply-registries.yml, INFRA-1099).
# Home nodes (ubuntu, sparks) are deliberately NOT in this group: they reach
# harbor.lan.e-dani.com directly.
[ovh_nodes:children]
ks5_control_plane
ovh_workers


[edge_wan_firewall:children]
ks5_control_plane
edge_wan_workers
