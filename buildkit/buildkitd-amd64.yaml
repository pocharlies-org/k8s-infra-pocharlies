apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd-amd64
  namespace: buildkit
  labels:
    app: buildkitd
    arch: amd64
spec:
  replicas: 1
  # Recreate keeps a single builder: with two pods the Service would split
  # builds across two independent caches and halve the hit rate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buildkitd
      arch: amd64
  template:
    metadata:
      labels:
        app: buildkitd
        arch: amd64
      annotations:
        # Disable Vault agent injection: the injector's MutatingWebhook resets
        # allowPrivilegeEscalation to false on ALL containers, breaking rootlesskit.
        vault.hashicorp.com/agent-inject: "false"
    spec:
      # The production amd64 builder is part of the OpenClaw release path and
      # must not depend on the home/dev ubuntu node — sauvage is the same OVH
      # region (ovh-fr), so the intent of the original ks5-nvme pin is kept.
      # Moved off ks5-nvme (INFRA-42): the pool is only the three control-plane
      # nodes, all at ~99% CPU requests; the apt/npm layer of the synapse
      # release starved there and hit the 75m DOCKER_BUILD_TIMEOUT three times
      # on 2026-09-14/15 (run 34905054888 attempts 1-2, exit 124). savage has
      # 48 cores and ~38 CPU-requests free.
      # INFRA-475 (2026-10-15): the local-path cache landed on sauvage's only
      # disk — md3, RAID1 of two 7200 rpm HDDs at 100% util, ~320 ms await with
      # MinIO/k3s/containerd on the same array — so apt unpack ran at ~30 s per
      # package and `buildctl debug workers` blew the 1 s probe timeout (19
      # restarts). The disk is not fixable here (no SSD on the node); the cache
      # now lives in RAM (tmpfs emptyDir) — see the cache volume below.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: sauvage
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      automountServiceAccountToken: false
      # Pod-level seccomp Unconfined is required for rootlesskit user-namespace
      # setup. The container-level override alone is insufficient because k3s/runc
      # applies the seccomp profile before the container securityContext is merged.
      securityContext:
        # kubelet mounts fresh volumes owned by root; fsGroup gives the rootless
        # BuildKit process group access without a privileged chown init.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Unconfined
      containers:
        - name: buildkitd
          image: docker.io/moby/buildkit:v0.31.0-rootless@sha256:e335bfb48eec12110318aced51f75161f01e765dd13e6041c0f4600b7c93507f
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            # GC enabled, with NO --oci-worker-gc-keepstorage flag. Note on
            # --oci-worker-gc itself: in v0.31.0 it has Value: true by default
            # (cmd/buildkitd/main_oci_worker.go) and getGCPolicy only disables
            # GC on an explicit =false, so passing it or omitting it is
            # BEHAVIOUR-EQUIVALENT to arm64 (which passes no GC flag at all),
            # though the args are not literally identical. With no
            # [[worker.oci.gcpolicy]] in a buildkitd.toml (none is mounted) and
            # no flag, buildkitd v0.31.0 applies DefaultGCPolicy computed from
            # the REAL size of the cache volume (cmd/buildkitd/config/
            # gcpolicy.go): 4 policies, the last one `all = true`, with
            # reservedSpace = min(10%, 10GB), maxUsedSpace = min(80%, 100GB)
            # and minFreeSpace = 20% of the volume -> on this 30Gi tmpfs the GC
            # targets ~24Gi used / ~6Gi free and CAN reclaim.
            # History of this flag (third recurrence of the same mechanism):
            # - 2026-08-20: PVC was full at 98% on 25Gi; raised 25->50Gi and
            #   changed keepstorage 8192,8192,12288 -> 6144,6144,10240.
            # - 2026-09-05 (SC-285): full again, 48.9G/49.0G (142M free) and
            #   `buildctl du` reports a Total of 52.39GB.
            #   Cause: keepstorage sets reservedSpace on ALL FOUR default
            #   policies and calculateKeepBytes() floors each policy's keep at
            #   its reservedSpace (cache/manager.go) -> keep >= 6+6+10 GiB of
            #   guaranteed retention, above what the GC may drop; plus the
            #   60-day and 48h keepDuration windows are never crossed with
            #   active CI. The GC could therefore never fire at any number
            #   under ~52G: shrinking the flag further only moves the ceiling.
            #   Contrast buildkitd-arm64.yaml: same image, no GC flags at all,
            #   and its GC reclaims.
            #   Evidence: df 49.0G/48.9G used/142M free/100%; buildctl du
            #   --verbose: 132 records, all Type: regular, none shared; and
            #   the keepstorage math above. The du "Reclaimable" column is
            #   NOT valid evidence of anything: in v0.31.0 the CLI derives it
            #   per record as !InUse (cmd/buildctl/diskusage.go), so on this
            #   busy CI builder every record reads false and the summary
            #   shows Reclaimable: 0B even though the API has records to
            #   reclaim. Valid verification metrics after the sync: `df` on
            #   the PVC and the Total in `buildctl du` — never Reclaimable.
            # INFRA-937 (2026-10-18): finer control now exists — the
            # buildkitd-amd64-config ConfigMap below mounts a buildkitd.toml
            # with an explicit [[worker.oci.gcpolicy]]: GC fires only on
            # pressure (>8 GiB used or <2 GiB free on the tmpfs) and trims to
            # a 1 GiB floor. The flag cannot express per-policy rules; the toml
            # replaces the four default policies.
            # SC-2759 (2026-10-19): that policy first carried keepDuration =
            # "24h", and in v0.31.0 pruneOnce() skips every record used inside
            # keepDuration whatever the size limits say (cache/manager.go:
            # `if lastUsedAt.After(cutOff) { continue }`). A tmpfs cache is
            # born empty at every pod start and every record had been used in
            # the last 24 h, so the GC found nothing to delete and the 10 GiB
            # tmpfs filled up: ENOSPC on every amd64 build of the org. Same
            # mechanism as SC-285 above. Do not put a keepDuration in this
            # policy.
            - --oci-worker-gc
          # INFRA-475: timeoutSeconds was 1 (the default) — on a busy builder
          # the exec probe (fork + gRPC dial) exceeded it and kubelet killed a
          # healthy daemon (19 restarts).
          # DGX-1035 (2026-10-17): 5 s was still not enough. The LiteLLM image
          # build (build-litellm of dgx-infra: npm UI build + uv sync) kept the
          # daemon busy long enough to miss 3 probes in a row, and kubelet
          # killed it twice mid-build (19:47:01Z and 19:54:31Z, both builds
          # died with "graceful_stop"). Liveness now tolerates 5 minutes of
          # unresponsiveness (10 x 30 s) with a 30 s timeout: that still
          # restarts a truly wedged daemon, but not one that is just working.
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 10
          securityContext:
            # Rootless buildkit needs SETUID+SETGID so newuidmap/newgidmap can
            # configure the user-namespace UID/GID map. Not privileged; Kyverno
            # only blocks privileged:true, not specific Linux capabilities.
            # allowPrivilegeEscalation=true is required: with APE=false the kernel
            # strips the ambient+inheritable caps across exec(), which prevents
            # newuidmap from using its setuid bit even if SETUID is in add[].
            seccompProfile:
              type: Unconfined
            # Structured AppArmor replaced the deprecated beta annotation in
            # Kubernetes 1.30 and remains supported through the 1.35 target.
            appArmorProfile:
              type: Unconfined
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SETUID
                - SETGID
          resources:
            requests:
              # INFRA-42/INFRA-79 (2026-09-13): 500m -> 150m. p95 14d = 8m; build spikes
              # ride the limit (4 CPU), not the request.
              cpu: "150m"
              # INFRA-475: the cache is tmpfs now, and tmpfs pages count against
              # the pod's cgroup memory. INFRA-937: the toml gcpolicy keeps the
              # cache at <= 8 GiB between builds, so the request covers that
              # steady state; builds burst above it up to the limit.
              memory: 12Gi
            limits:
              cpu: "4"
              # sizeLimit (30 GiB) + build headroom (peak RSS of the daemon and
              # its builds: 5.7 GiB over 4 days); an OOM kill of the daemon is
              # visible and Recreate brings it back with an empty cache.
              # SC-2759: with 10Gi/16Gi the LiteLLM build was OOM-killed even on
              # an empty cache (INFRA-937 comment); 30Gi/36Gi ran the builds of
              # 2026-10-15..18.
              memory: 36Gi
          ports:
            - name: buildkit
              containerPort: 1234
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
            - name: harbor-push
              mountPath: /home/user/.docker
              readOnly: true
            - name: daemon-config
              mountPath: /home/user/.config/buildkit/buildkitd.toml
              subPath: buildkitd.toml
              readOnly: true
      volumes:
        - name: daemon-config
          configMap:
            name: buildkitd-amd64-config
        - name: cache
          # INFRA-475: tmpfs, not a disk volume. The local-path PVC (50Gi) sat on
          # sauvage's only array — RAID1 of two 7200 rpm HDDs, 100% util, ~320 ms
          # await under MinIO/k3s — and every uncached build paid it (apt unpack
          # ~30 s per package; the same build on the x86's NVMe: ~4 min). The
          # node has 125 GiB RAM with ~95 GiB free, and the cache is rebuildable:
          # losing it costs one slower build, never data (same ruling as the old
          # PVC's comment). SC-2759 (2026-10-19) re-measured md3 before keeping
          # this: still 100% util and 283 ms write await with no build cache on
          # it, so a PVC on sauvage is not an option until the node gets a fast
          # disk (INFRA-482). sizeLimit bounds the tmpfs: 30Gi leaves >= 22 GiB
          # for builds in flight on top of the <= 8 GiB the toml gcpolicy keeps
          # (10Gi left 2 GiB, and every large build — LiteLLM, Open WebUI,
          # dashboard, correo — hit ENOSPC). RAM is used only as it is written:
          # the GC trims to 8 GiB after each build. Verification after GC
          # changes is `df` on the volume and the Total in `buildctl du` —
          # NEVER the "Reclaimable" column (v0.31.0 derives it per record as
          # !InUse, so on a busy builder it always reads 0B; SC-285).
          emptyDir:
            medium: Memory
            sizeLimit: 30Gi
        - name: harbor-push
          secret:
            secretName: harbor-push
            items:
              - key: .dockerconfigjson
                path: config.json
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd-amd64
  namespace: buildkit
  labels:
    app: buildkitd
    arch: amd64
spec:
  type: ClusterIP
  selector:
    app: buildkitd
    arch: amd64
  ports:
    - name: buildkit
      port: 1234
      targetPort: 1234
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-amd64-config
  namespace: buildkit
  labels:
    app: buildkitd
    arch: amd64
data:
  # INFRA-937: GC a demanda y con tope. Una sola política (all=true) sustituye
  # a las cuatro por defecto: se dispara solo bajo presión (>8 GiB usados o
  # <2 GiB libres en el tmpfs) y poda hasta el suelo de 1 GiB. Antes el
  # default mantenía ~24 GiB de cache en RAM.
  # SC-2759: sin keepDuration. Con él, buildkit v0.31 no borra nada usado
  # dentro de esa ventana, y en una caché en RAM, que nace vacía en cada
  # arranque del pod, todo se había usado en las últimas 24 h: el GC no tenía
  # qué podar y el tmpfs se llenó. Lo que sí se poda va del menos al más
  # reciente y usado; lo que tiene un build en curso no se toca.
  buildkitd.toml: |
    [[worker.oci.gcpolicy]]
      all = true
      keepBytes = 1073741824
      maxUsedSpace = "8gb"
      minFreeSpace = "2gb"
