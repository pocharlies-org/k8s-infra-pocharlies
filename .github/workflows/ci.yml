name: CI

# Un solo run por PR: el push de ramas duplicaba el de pull_request (la
# concurrencia agrupa por github.ref, distinto en ambos eventos, y no se
# cancelaban). push queda solo para el tronco.
on:
  pull_request:
  push:
    branches: [main]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-ci.yml@96ec4d91e103d5b62159fe5ac3d5ae9f84340063
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: "."
    secrets: inherit

  keycloak-agentgateway-role-contract:
    runs-on: arc-k8s
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The impersonation-grant reconciler runs INSIDE the pinned keycloak
      # image, which is not a general-purpose shell (SC-1215: no awk, the
      # PostSync job died on "awk: command not found"). Its contract tests
      # execute the script inside that image, so CI pulls the exact pinned
      # reference from the Job manifest and REQUIRE_IMAGE_CONTRACT=1 turns a
      # missing image into a hard failure instead of a silent skip.
      - name: Pull the pinned Keycloak image for the in-image contract tests
        run: |
          set -eu
          image="$(python3 - <<'PY'
          import pathlib, re
          m = re.search(r"image: (\S+/keycloak:26\.6\.2@sha256:[0-9a-f]{64})",
                        pathlib.Path("platform/keycloak-next/admin-keycloack-impersonation-grant-job.yaml").read_text())
          assert m, "pinned keycloak image not found in the Job manifest"
          print(m.group(1))
          PY
          )"
          timeout 15m docker pull "$image"
      # test_dgx_messages_sso_contract.py parses the manifests with PyYAML.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.2
      - name: Validate Keycloak role reconciler contract
        env:
          REQUIRE_IMAGE_CONTRACT: "1"
        run: |
          sh -n platform/keycloak-next/scripts/agentgateway-write-role.sh
          sh -n platform/keycloak-next/scripts/openclaw-readonly-clients.sh
          sh -n platform/keycloak-next/scripts/agentgateway-domain-roles.sh
          sh -n platform/keycloak-next/scripts/chat-agentgateway-client.sh
          sh -n platform/keycloak-next/scripts/agentgateway-read-grants.sh
          sh -n platform/keycloak-next/scripts/agentgateway-social-mcp-client.sh
          sh -n platform/keycloak-next/scripts/agentgateway-chat-mcp-client.sh
          sh -n platform/keycloak-next/scripts/admin-keycloack-impersonation-grant.sh
          sh -n platform/keycloak-next/scripts/agentgateway-write-grant-daniel.sh
          sh -n platform/keycloak-next/scripts/dgx-messages-client.sh
          sh -n platform/keycloak-next/scripts/agentgateway-token-smoke.sh
          python3 -m unittest \
            tests/test_keycloak_agentgateway_role_contract.py \
            tests/test_openclaw_readonly_identity_contract.py \
            tests/test_keycloak_agentgateway_domain_roles_contract.py \
            tests/test_chat_agentgateway_identity_contract.py \
            tests/test_agentgateway_read_grants_contract.py \
            tests/test_agentgateway_social_mcp_identity_contract.py \
            tests/test_agentgateway_chat_mcp_identity_contract.py \
            tests/test_admin_keycloack_impersonation_grant_contract.py \
            tests/test_agentgateway_write_grant_daniel_contract.py \
            tests/test_dgx_messages_sso_contract.py \
            tests/test_agentgateway_token_smoke_contract.py

  # INFRA-219: realm RBAC catalog (ROLES.yaml) and its verifiers. Stdlib only:
  # no Keycloak image, no PyYAML; the verifiers run against a fake Keycloak
  # on 127.0.0.1. Later parts add tests with the same file pattern.
  keycloak-rbac-contract:
    runs-on: arc-k8s
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # INFRA-250: the auditor reconciler (fake kcadm) and the drift CronJob
      # entrypoint; their tests are test_keycloak_rbac_auditor_client_contract
      # and test_keycloak_rbac_drift_cron_contract, picked up by discover.
      - name: Syntax of the auditor reconciler and the drift CronJob entrypoint
        run: |
          sh -n platform/keycloak-next/scripts/keycloak-rbac-auditor-client.sh
          sh -n platform/keycloak-next/scripts/keycloak-role-drift.sh
      - name: Validate the realm role catalog and its verifiers
        run: python3 -m unittest discover -s tests -p 'test_keycloak_rbac_*.py' -v
      # C-2 registry contract: no trunk role is deleted from ROLES.yaml and no
      # trunk-deprecated role comes back as active.
      - name: Registry contract of ROLES.yaml against the trunk
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          catalog=platform/keycloak-next/ROLES.yaml
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if ! git cat-file -e "FETCH_HEAD:$catalog" 2>/dev/null; then
            echo "SKIP: origin/$GITHUB_BASE_REF no tiene $catalog; no hay catálogo previo contra el que comprobar borrados"
            exit 0
          fi
          git show "FETCH_HEAD:$catalog" > "$RUNNER_TEMP/ROLES.base.yaml"
          python3 platform/keycloak-next/scripts/check-catalog-evolution.py --base "$RUNNER_TEMP/ROLES.base.yaml" --head "$catalog"

  velero-operability-contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - name: Validate Velero operability contract
        run: python3 -m unittest tests/test_velero_operability_contract.py

  external-dns-contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - name: Validate external-dns ownership boundary
        run: python3 -m unittest tests/test_external_dns_contract.py

  private-service-exposure-contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.2
      - name: Validate private service exposure boundaries
        run: python3 -m unittest tests/test_private_service_exposure_contract.py

  sauvage-bot-contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.2
      - name: Validate Sauvage dashboard deployment contract
        run: python3 -m unittest tests/test_sauvage_bot_contract.py

  longhorn-systembackup-contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed Longhorn SystemBackup contract
        run: python3 -m unittest tests/test_longhorn_systembackup_contract.py

  synapse-sre-postgres-role-contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - name: Validate least-privilege SRE database roles
        run: python3 -m unittest tests/test_synapse_sre_postgres_roles.py

  shared-valkey-chatbot-contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.2
      - name: Validate shared Valkey ACL reconciliation and activation gate
        run: |
          bash -n scripts/valkey/activate-shared-valkey-acl.sh
          python3 -m unittest tests/test_shared_valkey_chatbot_contract.py
