# user: system:serviceaccount:kube-system:replicaset-controller
apiVersion: v1
kind: Pod
metadata:
  name: allow-comfyui-lane-pod
  namespace: comfyui
  labels:
    app: comfyui
    gpu.dgx-infra/role: on-demand
    gpu.dgx-infra/pool: gb10
  ownerReferences:
  - apiVersion: apps/v1
    kind: ReplicaSet
    name: allow-comfyui-lane-pod-owner
    uid: 00000000-0000-0000-0000-000000000001
    controller: true
spec:
  runtimeClassName: nvidia
  tolerations:
  - key: dedicated
    operator: Equal
    value: llm
    effect: NoSchedule
  containers:
  - name: c
    image: x
    resources:
      limits:
        nvidia.com/gpu: '1'
