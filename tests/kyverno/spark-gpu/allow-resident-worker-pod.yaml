# user: system:serviceaccount:kube-system:replicaset-controller
apiVersion: v1
kind: Pod
metadata:
  name: allow-resident-worker-pod
  namespace: llm
  labels:
    app: qwen38-flash-next-worker
  ownerReferences:
  - apiVersion: apps/v1
    kind: ReplicaSet
    name: allow-resident-worker-pod-owner
    uid: 00000000-0000-0000-0000-000000000001
    controller: true
spec:
  runtimeClassName: nvidia
  tolerations:
  - key: dedicated
    operator: Equal
    value: llm
    effect: NoSchedule
  containers:
  - name: c
    image: x
    resources:
      limits:
        nvidia.com/gpu: '1'
