apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: t-case
  namespace: dgx626-test
  labels:
    dgx-626-test: 'true'
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: t-case
  data:
  - secretKey: ALIBABA_API_KEY
    remoteRef:
      key: Alibaba-Model-Studio
      property: password
