---
# Public edge route for the Claude accounts panel (opencode-claude plugin),
# served by the opencode process on port 8799 of the x86 host.
#
# Same shape as opencode-public.yaml: Service without selector + EndpointSlice
# pointing at the x86 Tailscale IP. Published under the OpenCode host as
# code.e-dani.com/claude/ because e-dani.com has no wildcard DNS.
#
# Keycloak (sso-chain) is the authentication authority here exactly as it is for
# OpenCode itself. This panel manages Claude subscription credentials, so it must
# never be reachable on looser terms than the service it sits beside.
apiVersion: v1
kind: Service
metadata:
  name: opencode-claude-panel-edge-host
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: opencode-claude-panel-edge-host
    app.kubernetes.io/part-of: traefik-edge-cutover
spec:
  ports:
    - name: http
      port: 8799
      targetPort: 8799
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: opencode-claude-panel-edge-host
  namespace: traefik-edge
  labels:
    kubernetes.io/service-name: opencode-claude-panel-edge-host
    app.kubernetes.io/name: opencode-claude-panel-edge-host
    app.kubernetes.io/part-of: traefik-edge-cutover
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8799
endpoints:
  - addresses:
      - 100.83.56.98
    conditions: {}
---
# /claude → /claude/ so the page's <base href> is a directory. Without the
# trailing slash every relative fetch would resolve one level too high.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: claude-panel-slash
  namespace: traefik-edge
spec:
  redirectRegex:
    regex: ^https://code\.e-dani\.com/claude$
    replacement: https://code.e-dani.com/claude/
    permanent: false
---
# The plugin serves the panel at /, so strip the prefix. Traefik sets
# X-Forwarded-Prefix, which the panel turns into <base href="/claude/">.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: claude-panel-stripprefix
  namespace: traefik-edge
spec:
  stripPrefix:
    prefixes:
      - /claude
    forceSlash: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-opencode-claude-panel
  namespace: traefik-edge
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    # Priority above the catch-all OpenCode route (100) so /claude wins the host.
    - kind: Rule
      match: Host(`code.e-dani.com`) && PathPrefix(`/claude`)
      priority: 200
      middlewares:
        - name: sso-chain
          namespace: keycloak
        - name: claude-panel-slash
          namespace: traefik-edge
        - name: claude-panel-stripprefix
          namespace: traefik-edge
      services:
        - name: opencode-claude-panel-edge-host
          namespace: traefik-edge
          port: 8799
  tls:
    store:
      name: default
      namespace: traefik-edge
