---
# Public OpenChamber web UI backed by the x86 host over Tailscale.
# Cloudflare → traefik-edge (Keycloak SSO) → x86:3000.
# OpenCode remains independently available at code.e-dani.com: the web UI
# talks to that same local OpenCode runtime through OpenChamber's API gate.
#
# Argo CD excludes EndpointSlice discovery, so this selector-less Service uses
# a GitOps-managed Endpoints object. Kubernetes mirrors it to an EndpointSlice
# that Traefik consumes; do not add a hand-managed EndpointSlice with the same
# service label or it will create duplicate backends.
apiVersion: v1
kind: Service
metadata:
  name: openchamber-edge-host
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: openchamber-edge-host
    app.kubernetes.io/part-of: traefik-edge-cutover
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: openchamber-edge-host
  namespace: traefik-edge
subsets:
  - addresses:
      - ip: 100.83.56.98
    ports:
      - name: http
        port: 3000
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-openchamber-public
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: chamber.e-dani.com
    external-dns.alpha.kubernetes.io/target: 141.94.73.52,141.94.73.50,145.239.194.168,57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`chamber.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 200
      services:
        - name: openchamber-edge-host
          namespace: traefik-edge
          port: 3000
    # Authenticate API and application-auth requests without the generic
    # 401→SSO redirect middleware. OpenChamber intentionally uses 401 on these
    # paths to display and maintain its own UI-password session.
    - kind: Rule
      match: Host(`chamber.e-dani.com`) && (PathPrefix(`/api`) || PathPrefix(`/auth`))
      priority: 150
      middlewares:
        - name: sso-forward-auth
          namespace: keycloak
      services:
        - name: openchamber-edge-host
          namespace: traefik-edge
          port: 3000
    - kind: Rule
      match: Host(`chamber.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: openchamber-edge-host
          namespace: traefik-edge
          port: 3000
  tls:
    store:
      name: default
      namespace: traefik-edge
