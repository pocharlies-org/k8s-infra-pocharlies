---
# Acceso público (Cloudflare -> traefik-edge) a los enlaces de skirmshop-s3.e-dani.com que la
# gestoría y otros externos ya tienen. Desde INFRA-1175 el backend es el gateway de lectura de OVH
# Object Storage (objectstore-edge-ext.yaml), no el MinIO de backup-hub:
#   - Solo los prefijos que el MinIO servía sin credencial (mc anonymous list, 18-11):
#     skirmshop-drive/fiscal/aeat-369-presentados/ y las carpetas skirmshop-drive/gestoria/…, más
#     los artifacts/pub/ repartidos antes de DGX-936. El gateway repite la allowlist por prefijo
#     exacto; esta ruta no deja pasar /facturas (tiene basic auth en s3.e-dani.com) ni /artifacts/lan/.
#   - Ya no es una API S3: sin listado, sin escritura, sin URLs prefirmadas ni el usuario
#     `talenom-369` (muere con el MinIO; usuario OVH por consumidor = security, SC-5876). Los enlaces
#     temporales se firman contra https://s3.sbg.io.cloud.ovh.net (skill s3-drive-sharing).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: skirmshop-drive-s3-public
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: skirmshop-s3.e-dani.com
    external-dns.alpha.kubernetes.io/target: 57.129.17.172,141.94.73.52,145.239.194.168
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`skirmshop-s3.e-dani.com`) && (PathPrefix(`/skirmshop-drive/fiscal/aeat-369-presentados/`) || PathPrefix(`/skirmshop-drive/gestoria/`) || PathPrefix(`/artifacts/pub/`))
      services:
        - name: objectstore-edge-ext
          port: 8000
  tls:
    store:
      name: default
      namespace: traefik-edge
