---
# Acceso público (Cloudflare -> traefik-edge) a la carpeta de documentos
# fiscales del modelo 369, alojados en el Object Storage de OVH (proyecto
# 74858f325f3e49c4a3c6ae6ac70ae9a0, región SBG) — onda 4 de INFRA-1175.
#
# Diseño de seguridad:
#   - SOLO se expone la API S3. La consola MinIO (9001) desapareció con la
#     instancia; no hay superficie de fuerza bruta sobre usuario RW.
#   - Traefik reenvía a s3.sbg.io.cloud.ovh.net con `scheme: https` y el Host
#     intacto (passHostHeader por defecto): el cliente firma contra este host y
#     RGW verifica con el Host recibido; path-style (force_path_style) — probado
#     en vivo el 15-11 (INFRA-1175, comentario de estado).
#   - El acceso a los objetos es por:
#       (a) lectura anónima del prefijo fiscal/aeat-369-presentados/* (enlaces
#           directos permanentes que la gestoría abre en el navegador), y
#       (b) un usuario S3 de OVH read-only `talenom-369` con policy acotada SOLO
#           a ese prefijo (alta y policy: security, fuera de GitOps).
#       (c) DGX-892: lectura anónima de objetos del bucket `artifacts` (páginas
#           HTML que publica la tool `publish_html`, con caducidad). Solo
#           `artifacts/pub/` es para internet: esta ruta NO sirve
#           `/artifacts/lan/`, que se ve únicamente por LAN/tailnet
#           (traefik-lan/artifacts-lan.yaml). La política anónima de OVH debe
#           acotar el Resource a pub/* (decisión security, INFRA-1175).
#   - El resto del bucket NO es accesible: sin la lectura anónima de su prefijo
#     y sin credenciales, cualquier otra ruta devuelve AccessDenied.
#
# Cuando la gestoría confirme la descarga, este acceso público puede retirarse
# (borrar la IngressRoute + revocar usuario/anonymous) sin afectar al uso interno.
# El Service se queda: lo usan artifacts-public.yaml y facturas-public.yaml.
apiVersion: v1
kind: Service
metadata:
  name: skirmshop-drive-s3-ext
  namespace: traefik-edge
spec:
  type: ExternalName
  externalName: s3.sbg.io.cloud.ovh.net
  ports:
    - name: s3
      port: 443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: skirmshop-drive-s3-public
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: skirmshop-s3.e-dani.com
    external-dns.alpha.kubernetes.io/target: 57.129.17.172,141.94.73.52,145.239.194.168
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`skirmshop-s3.e-dani.com`) && !PathPrefix(`/artifacts/lan/`)
      services:
        - name: skirmshop-drive-s3-ext
          port: 443
          scheme: https
  tls:
    store:
      name: default
      namespace: traefik-edge
