# chat.e-dani.com (Open WebUI) en el edge. Fichero propio, igual que
# paperclip-public.yaml: la ruta LAN equivalente vive en dgx-infra
# (k8s/apps/chat/ingressroute.yaml, IngressRoute chat-lan).
#
# El DNS decide a dónde va: AdGuard reescribe el nombre a 192.168.50.240 (LB
# de traefik-lan) para los clientes de dentro; desde internet llega a
# traefik-edge, que sirve esta ruta. Ambas con el MISMO nombre de host y la
# MISMA cadena SSO.
#
# Cadena SSO = `sso-chat-chain` de la ns keycloak (proxy DEDICADO
# oauth2-proxy-chat). Se dejó de usar `sso-chain` el 2026-08-28: el proxy
# compartido solo admite /edani-admins y /edani-operators, dos grupos que
# abren ~90 rutas (Vault, ArgoCD, Longhorn...); para dar acceso al chat a
# alguien sin darle todo eso hace falta un proxy propio que acepte además
# /edani-users. Aquí SÍ vale una cadena SSO a secas, a
# diferencia de paperclip: Open WebUI va en modo trusted-header y NO devuelve
# 401 como respuesta normal de su SPA — el forwardAuth interviene ANTES de
# llegar a la app y la página de login de Open WebUI nunca se muestra (el botón
# de login dispara POST /auths/signin con los headers ya puestos). Validado con
# Open WebUI v0.11.0.
#
# Sin anotaciones de external-dns: el comodín manual *.e-dani.com ya resuelve
# este nombre (el `exclude: "true"` evita además publicar un registro por ruta).
#
# El edge (DaemonSet traefik-edge) arranca con
# `--providers.kubernetescrd.namespaces=traefik-edge` y no puede resolver un
# Service de otra namespace: un `name: chat / namespace: chat` directo en la
# IngressRoute falla en vivo con `failed to get service chat/chat: namespace is
# not within watched namespaces`. El patrón probado en este edge (langfuse-web-ext,
# minio-s3-ext, sauvage-bot-ext, openchamber-edge-x86) es un Service de tipo
# ExternalName DENTRO de la ns traefik-edge apuntando al FQDN del servicio real;
# la IngressRoute referencia ese Service (misma ns, sin namespace). El provider
# lo permite vía `allowExternalNameServices: true`.
apiVersion: v1
kind: Service
metadata:
  name: edge-chat-public
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: edge-chat-public
    app.kubernetes.io/part-of: traefik-edge-cutover
spec:
  type: ExternalName
  externalName: chat.chat.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
# El proxy SSO dedicado del chat (oauth2-proxy-chat, ns keycloak) necesita
# servir /oauth2/* en ESTE host: su redirect_url es
# https://chat.e-dani.com/oauth2/callback. Como el edge solo vigila su propia
# namespace, se referencia con el mismo patrón ExternalName de arriba.
apiVersion: v1
kind: Service
metadata:
  name: edge-oauth2-proxy-chat
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: edge-chat-public
    app.kubernetes.io/part-of: traefik-edge-cutover
spec:
  type: ExternalName
  externalName: oauth2-proxy-chat.keycloak.svc.cluster.local
  ports:
    - name: http
      port: 4180
      targetPort: 4180
      protocol: TCP
---
# Borra el header Authorization que inyecta oauth2-proxy (access_token de
# Keycloak) ANTES de que llegue a Open WebUI. OWUI en modo trusted-header
# autentica por su cookie `token` (JWT) + los X-Auth-Request-*; si ve un
# Authorization header ajeno, get_current_user (utils/auth.py) lo prefiere
# sobre la cookie y devuelve 401 en todos los endpoints autenticados tras el
# signin. Patrón idéntico a aurora-ws-drop-authorization (ns aurora) y a la
# ruta LAN equivalente (chat-drop-authorization, ns chat).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chat-drop-authorization
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: edge-chat-public
    app.kubernetes.io/part-of: traefik-edge-cutover
spec:
  headers:
    customRequestHeaders:
      Authorization: ""
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-chat-public
  namespace: traefik-edge
  labels:
    app.kubernetes.io/component: canonical-host-routing
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    # El endpoint del propio proxy: sign_in, callback y sign_out. NO lleva
    # cadena SSO (si la llevara, autenticarse exigiría estar autenticado).
    - kind: Rule
      match: Host(`chat.e-dani.com`) && PathPrefix(`/oauth2`)
      services:
        - name: edge-oauth2-proxy-chat
          port: 4180
    - kind: Rule
      match: Host(`chat.e-dani.com`)
      middlewares:
        # `sso-chat-chain`, no `sso-chain`: el proxy dedicado admite además
        # el grupo `/edani-users`, que da acceso a este host y a nada más.
        - name: sso-chat-chain
          namespace: keycloak
        - name: chat-drop-authorization
          namespace: traefik-edge
      services:
        - name: edge-chat-public
          port: 80
  tls:
    store:
      name: default
      namespace: traefik-edge
