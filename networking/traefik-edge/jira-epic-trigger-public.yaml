---
# Public ingress for the Jira → CTO trigger that runs on the x86 host.
#
# Jira Cloud POSTs `jira:issue_updated` for epics of project SC to
#   https://jira-webhook.e-dani.com/jira/epic?token=…
# and the receiver (`jira-epic-trigger.service`, systemd --user on x86, tailnet
# 100.83.56.98:19911, repo x86-host-runtime) launches a headless company-cto
# session when the epic has just moved to In Progress. It lives on the host,
# not in a pod, because it runs `claude` with the operator's config, router and
# skills; the cluster only tunnels to it over Tailscale.
#
# ExternalName, not Service+EndpointSlice: ArgoCD excludes EndpointSlice and
# Endpoints (`resource.exclusions` in argocd-cm), so a slice in Git is never
# applied — the one behind opencode-public.yaml was `kubectl apply`'d by hand on
# 2026-08-11 and ArgoCD does not know it exists. `x86.taile0ad27.ts.net` resolves
# in-cluster through networking/dns/coredns-custom.yaml (hosts entry →
# 100.83.56.98), which is the same mechanism openchamber-public.yaml relies on.
#
# No SSO middleware here: Jira cannot complete a Keycloak dance. The gate is the
# shared token in the URL (or an HMAC over the raw body), verified by the
# receiver, and only the two paths Jira needs are published — /state stays on
# the tailnet.
apiVersion: v1
kind: Service
metadata:
  name: jira-epic-trigger-edge-host
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: jira-epic-trigger-edge-host
    app.kubernetes.io/part-of: company
spec:
  type: ExternalName
  externalName: x86.taile0ad27.ts.net
  ports:
    - name: http
      port: 19911
      targetPort: 19911
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-jira-epic-trigger-public
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jira-webhook.e-dani.com
    external-dns.alpha.kubernetes.io/target: 141.94.73.52,141.94.73.50,145.239.194.168,57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`jira-webhook.e-dani.com`) && (Path(`/jira/epic`) || Path(`/healthz`))
      priority: 100
      services:
        - name: jira-epic-trigger-edge-host
          namespace: traefik-edge
          port: 19911
  tls:
    store:
      name: default
      namespace: traefik-edge
