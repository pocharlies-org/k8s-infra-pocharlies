---
# Public ingress for the Jira → company supervisor webhook.
#
# Jira Cloud POSTs to https://jira-webhook.e-dani.com/jira/epic?token=… and the
# supervisor (`jira-epic-trigger.py`, repo x86-host-runtime) answers it. Since
# SC-3961 it runs in pod paseo/company-0 behind Service paseo/company :19911
# (SC-5091: no longer through the x86 relay).
#
# ExternalName to the Service's cluster DNS name, not a cross-namespace service
# reference: traefik-edge already allows ExternalName services, and ArgoCD
# excludes Endpoints/EndpointSlice (`resource.exclusions` in argocd-cm).
#
# No SSO middleware here: Jira cannot complete a Keycloak dance. The gate is the
# shared token in the URL (or an HMAC over the raw body), verified by the
# receiver, and only the paths Jira and Hermes need are published — /state stays
# inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: jira-epic-trigger-edge-host
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: jira-epic-trigger-edge-host
    app.kubernetes.io/part-of: company
spec:
  type: ExternalName
  externalName: company.paseo.svc.cluster.local
  ports:
    - name: http
      port: 19911
      targetPort: 19911
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-jira-epic-trigger-public
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jira-webhook.e-dani.com
    external-dns.alpha.kubernetes.io/target: 141.94.73.52,141.94.73.50,145.239.194.168,57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`jira-webhook.e-dani.com`) && (Path(`/jira/epic`) || Path(`/healthz`))
      priority: 100
      services:
        - name: jira-epic-trigger-edge-host
          namespace: traefik-edge
          port: 19911
  tls:
    store:
      name: default
      namespace: traefik-edge
