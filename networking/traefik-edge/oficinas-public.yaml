---
# SC-5375: bunker navegable de proyectos y agentes, servido por la app ArgoCD oficinas.
# Backend independiente: no monta el home ni reinicia los pods de Paseo o company.
#
# Service ExternalName al DNS del svc, como jira-epic-trigger-public.yaml (SC-5091). NO EndpointSlice:
# argocd-cm excluye EndpointSlice/Endpoints de todo el clúster, así que ArgoCD no lo aplica y Traefik da 503.
# Keycloak (sso-chain) SIEMPRE: la vista enseña nombres de sesión y claves de Jira, y su
# /api/ask habla con Hermes. El oauth2-proxy de sso-chain usa el callback central de auth-next y la cookie de
# .e-dani.com, así que un host nuevo no necesita tocar el cliente de Keycloak.
apiVersion: v1
kind: Service
metadata:
  name: oficinas-edge-ext
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: oficinas-edge-ext
    app.kubernetes.io/part-of: traefik-edge-cutover
spec:
  type: ExternalName
  externalName: oficinas.oficinas.svc.cluster.local
  ports:
    - name: http
      port: 19930
      targetPort: 19930
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-oficinas
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: oficinas.e-dani.com
    external-dns.alpha.kubernetes.io/target: 141.94.73.52,141.94.73.50,145.239.194.168,57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`oficinas.e-dani.com`)
      priority: 200
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: oficinas-edge-ext
          namespace: traefik-edge
          port: 19930
  tls:
    store:
      name: default
      namespace: traefik-edge
