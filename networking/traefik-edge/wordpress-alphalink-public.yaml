# SC-2659 — la web pública de AlphaLink (WordPress) en el dominio del cliente.
#
# La zona `alphalinkcrossfit.com` está en Cloudflare desde el 17-10-2026, pero
# se edita a mano y NO entra en external-dns: aquí no hay anotaciones
# `external-dns.*` (A @ y www a las IPs del edge, sin proxy naranja: el
# rate-limit de wp-login del sidecar nginx necesita la IP real). El certificado
# se valida por DNS-01 con el solver `alphalinkcrossfit.com` de cluster-issuers.
#
# El hardening (xmlrpc, .php en uploads, rate-limit, cabeceras) va en el nginx
# del pod, no aquí: es del cliente, no del edge compartido. Precedente:
# `horarios-alphalink-public.yaml`, sin SSO porque es la web pública.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wordpress-alphalink-tls
  namespace: traefik-edge
spec:
  secretName: wordpress-alphalink-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "alphalinkcrossfit.com"
    - "www.alphalinkcrossfit.com"
  renewBefore: 720h
---
# El edge solo vigila sus propias namespaces: una IngressRoute que apunta a
# `alphalink/wordpress` se descarta entera («namespace is not within watched
# namespaces») y el host da 404 (le pasó al primer corte, 18-10). Patrón de la
# casa: ExternalName dentro de traefik-edge, como `edge-horarios-alphalink`.
apiVersion: v1
kind: Service
metadata:
  name: edge-wordpress-alphalink
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: edge-wordpress-alphalink
spec:
  type: ExternalName
  externalName: wordpress.alphalink.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-wordpress-alphalink
  namespace: traefik-edge
spec:
  entryPoints:
  - websecure
  ingressClassName: traefik-edge
  routes:
  - kind: Rule
    match: Host(`alphalinkcrossfit.com`) || Host(`www.alphalinkcrossfit.com`)
    services:
    - name: edge-wordpress-alphalink
      port: 80
  tls:
    secretName: wordpress-alphalink-tls
