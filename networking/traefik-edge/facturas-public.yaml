---
# Basic auth de https://s3.e-dani.com/facturas/<file> (IngressRoute en facturas-route.yaml).
# Este fichero NO está en kustomization.yaml: el Secret lleva el htpasswd en claro en git y se
# aplicó a mano el 09-06; pasarlo a ExternalSecret desde 1Password es de security (INFRA-1175).
apiVersion: v1
kind: Secret
metadata:
  name: facturas-basic-auth
  namespace: traefik-edge
  labels: {app.kubernetes.io/part-of: skirmshop, app.kubernetes.io/managed-by: gitops}
type: Opaque
data:
  users: c2tpcm1zaG9wOiRhcHIxJFBiZ3F3UmFtJFdkaTZBMUw0MVJuL2plb2ZBLlNXRy8=
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: facturas-auth
  namespace: traefik-edge
  labels: {app.kubernetes.io/part-of: skirmshop, app.kubernetes.io/managed-by: gitops}
spec:
  basicAuth:
    secret: facturas-basic-auth
    realm: Skirmshop Facturas
    removeHeader: true
