---
# Public, password-protected access to invoice/document PDFs in the OVH
# Object Storage bucket "facturas". URL: https://s3.e-dani.com/facturas/<file>
# Gated by Traefik BasicAuth. Anonymous read is enabled ONLY on the "facturas"
# bucket (policy en OVH: security). Onda 4 (INFRA-1175): Host conservado +
# path-style + scheme https, probado en vivo el 15-11.
apiVersion: v1
kind: Service
metadata:
  name: skirmshop-drive-s3-ext
  namespace: skirmshop
  labels: {app.kubernetes.io/part-of: skirmshop, app.kubernetes.io/managed-by: gitops}
spec:
  type: ExternalName
  externalName: s3.sbg.io.cloud.ovh.net
  ports:
    - name: s3
      port: 443
---
apiVersion: v1
kind: Secret
metadata:
  name: facturas-basic-auth
  namespace: traefik-edge
  labels: {app.kubernetes.io/part-of: skirmshop, app.kubernetes.io/managed-by: gitops}
type: Opaque
data:
  users: c2tpcm1zaG9wOiRhcHIxJFBiZ3F3UmFtJFdkaTZBMUw0MVJuL2plb2ZBLlNXRy8=
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: facturas-auth
  namespace: traefik-edge
  labels: {app.kubernetes.io/part-of: skirmshop, app.kubernetes.io/managed-by: gitops}
spec:
  basicAuth:
    secret: facturas-basic-auth
    realm: Skirmshop Facturas
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: facturas-public
  namespace: traefik-edge
  labels: {app.kubernetes.io/part-of: skirmshop, app.kubernetes.io/managed-by: gitops}
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`s3.e-dani.com`) && PathPrefix(`/facturas`)
      priority: 300
      middlewares:
        - name: facturas-auth
      services:
        - name: skirmshop-drive-s3-ext
          namespace: skirmshop
          port: 443
          scheme: https
  tls:
    store:
      name: default
      namespace: traefik-edge
