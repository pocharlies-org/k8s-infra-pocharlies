---
# Public edge route for the DGX Control Nexus dashboard.
# Cloudflare → traefik-edge (Keycloak SSO via sso-chain@keycloak) →
# Service dgx-dashboard-ui.control-nexus:80 (nginx UI pod) → host backend.
# Replaces the old docker api-gateway + oauth2-proxy path (home IP 83.46.66.146).
#
# SC-702 (SC-1191/SC-1192): the ClientIP bypass route (prio 200) used to serve
# the backend with no middlewares, so a tailnet/cluster caller could forge the
# X-Auth-Request-* identity headers the backend trusts. H1 strips the 7 identity
# headers on every route (before sso-chain where present); H2 puts the approved
# control set behind sso-chain with higher-priority routes. The /openchamber
# redirect (prio 300) is untouched; the new coverage sits above it in priority.
# dgx-strip-identity-headers is defined once per Traefik instance — this copy
# serves traefik-edge; the twin lives in networking/traefik-lan/.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-openchamber
  namespace: traefik-edge
spec:
  redirectRegex:
    regex: '^https?://dgx\.e-dani\.com/openchamber/?(.*)'
    replacement: 'https://chamber.e-dani.com/${1}'
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dgx-strip-identity-headers
  namespace: traefik-edge
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
      X-Auth-Request-Preferred-Username: ""
      X-Forwarded-User: ""
      X-Forwarded-Email: ""
      X-Forwarded-Groups: ""
---
# SC-1198/consola: la consola de mensajería vive en `messages/dgx-messages`
# (repo pocharlies-org/dgx-messages); el dashboard solo conserva una copia
# antigua de /messages. El edge solo vigila un allowlist de namespaces que no
# incluye `messages` (ver chat-public.yaml), así que se alcanza con el patrón
# ExternalName dentro de traefik-edge. La NetworkPolicy de ns messages admite
# las IPs de host del edge (hostNetwork) en el repo dgx-messages.
apiVersion: v1
kind: Service
metadata:
  name: edge-dgx-messages
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: edge-dgx-dashboard-public
spec:
  type: ExternalName
  externalName: dgx-messages.messages.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-dgx-dashboard-public
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dgx.e-dani.com
    external-dns.alpha.kubernetes.io/target: 141.94.73.52,141.94.73.50,145.239.194.168,57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    # Consola de mensajería (página, assets propios, API y SSE
    # /api/messages/stream) → dgx-messages, para TODO origen y siempre tras
    # sso-chain: la identidad X-Auth-Request-User la estampa el forwardAuth
    # (dgx-strip-identity-headers va antes y borra cualquier copia del
    # cliente). Prioridad 450: por encima del control set (400), que antes
    # mandaba /api/messages a la copia vieja del dashboard. Los assets
    # compartidos (/static/navbar.js, colors_and_type.css, vendor) siguen en el
    # dashboard: son los suyos y navbar.js llama a APIs del dashboard.
    - kind: Rule
      match: Host(`dgx.e-dani.com`) && (PathPrefix(`/messages`) || PathPrefix(`/static/messages/`) || PathPrefix(`/api/messages`))
      priority: 450
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-edge
        - name: sso-chain
          namespace: keycloak
      services:
        - name: edge-dgx-messages
          port: 80
    # SC-1192: control set behind sso-chain for LAN/tailnet/cluster callers.
    # SC-1316: la pagina /entregas del dashboard y sus assets propios van
    # tambien por sso-chain para LAN/tailnet/cluster (C3): sin esto, la lista
    # queda abierta mientras su API (/api/company/entregas) exige login.
    # dgx.app.pagos.v1 (03-10-2026): mismo control-set que traefik-lan para el
    # acceso LAN/tailnet al host publico (la app usa dgx.lan, pero un caller de
    # tailnet que entre por dgx.e-dani.com no debe saltarse el sso-chain que
    # estampa X-Auth-Request-Email que el backend exige como es_dani). Para el
    # publico real cubre ya la regla 100, que es sso-chain sin lista.
    - kind: Rule
      match: Host(`dgx.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`)) && (PathPrefix(`/api/company`) || PathPrefix(`/api/litellm/keys`) || PathPrefix(`/api/litellm/config`) || PathPrefix(`/api/messages`) || PathPrefix(`/api/autoreply`) || PathPrefix(`/api/claude-sessions`) || PathPrefix(`/api/app/secure`) || PathPrefix(`/api/app/pagos`) || PathPrefix(`/api/app/push`) || PathPrefix(`/api/email/state`) || PathPrefix(`/entregas`) || PathPrefix(`/static/entregas`) || PathPrefix(`/api/model-routing`))
      priority: 400
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-edge
        - name: sso-chain
          namespace: keycloak
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    # SC-1192: cluster/compute WRITES behind sso-chain, split by Method —
    # GET /api/cluster/state and /api/compute/mode stay open on the bypass.
    - kind: Rule
      match: Host(`dgx.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`)) && ((PathPrefix(`/api/cluster/apply`) || PathRegexp(`^/api/cluster/k8s/[^/]+/[^/]+/[^/]+/(scale|restart)$`) || PathRegexp(`^/api/cluster/argocd/[^/]+/(sync|rollback)$`) || Path(`/api/compute/mode`)) && Method(`POST`))
      priority: 350
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-edge
        - name: sso-chain
          namespace: keycloak
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      match: Host(`dgx.e-dani.com`) && PathPrefix(`/openchamber`)
      priority: 300
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-edge
        - name: redirect-openchamber
          namespace: traefik-edge
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      match: Host(`dgx.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 200
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-edge
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      match: Host(`dgx.e-dani.com`)
      priority: 100
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-edge
        - name: sso-chain
          namespace: keycloak
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
  tls:
    store:
      name: default
      namespace: traefik-edge
