---
# DGX-936: artifacts públicos de `publish_html` (ofimatica) en
#   https://s3.e-dani.com/artifacts/pub/<key>
# Bucket `artifacts` de OVH Object Storage servido por el gateway objectstore-edge
# (INFRA-1175; antes el MinIO skirmshop-drive): solo objetos, sin listado. Solo `pub/`: `/artifacts/lan/` no tiene ruta aquí y cae en el
# catch-all SSO de s3.e-dani.com. Priority 300 gana a ese catch-all (100) y al bypass
# LAN (200), como labs-public.yaml. El ExternalName está en objectstore-edge-ext.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: artifacts-public
  namespace: traefik-edge
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`s3.e-dani.com`) && PathPrefix(`/artifacts/pub/`)
      priority: 300
      services:
        - name: objectstore-edge-ext
          port: 8000
  tls:
    store:
      name: default
      namespace: traefik-edge
