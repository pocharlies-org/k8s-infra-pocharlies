# Paperclip en el edge. Fichero propio y no una entrada mas en
# canonical-hosts-public.yaml porque necesita TRES reglas, no una.
#
# Por que no vale `sso-chain` a secas (medido el 22-08-2026):
# `sso-chain` = `sso-errors` + `sso-forward-auth`, y `sso-errors` reescribe
# CUALQUIER 401 del backend a un 302 hacia /oauth2/sign_in. La SPA de Paperclip
# llama a /api/auth/get-session, que responde 401 mientras no hayas entrado en
# la app. Ese 401 legitimo se convertia en un salto a Keycloak, Keycloak decia
# "ya estas dentro", volvia, y otra vez:
#
#   /oauth2/auth -> 202 (AUTORIZADO)  |  /oauth2/sign_in -> 302  |  callback -> 302  | ...
#
# Bucle que acaba en el "403 Forbidden / Secured with OAuth2 Proxy".
#
# La solucion es la misma que ya usa openchamber-public.yaml, cuyo comentario
# dice exactamente esto: las rutas de API se autentican con `sso-forward-auth`
# SOLO, sin el reescritor de errores, para que sus 401 pasen limpios.
#
# Exposicion: queda accesible desde internet, detras de Keycloak, igual que
# grafana/argocd/vault. OJO con lo que es esta app en concreto: su execution
# target es SSH a dibanez@192.168.50.142, o sea shell en un nodo del plano de
# control con sudo, docker y kubeconfig cluster-admin, y su adapter de Claude
# trae `dangerouslySkipPermissions: true` por defecto. Keycloak es la unica
# puerta. Si algun dia se quiere cerrar, basta con borrar este fichero: la ruta
# de traefik-lan (dgx-infra, k8s/apps/paperclip) sigue sirviendo por LAN+tailnet.
#
# Sin anotaciones de external-dns: el comodin manual *.e-dani.com ya resuelve
# este nombre, y publicar un registro por ruta agota la zona de Cloudflare.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: paperclip-sso-auth
  namespace: traefik-edge
spec:
  # Copia de `sso-forward-auth` (ns keycloak) SIN `Authorization` en
  # authResponseHeaders. Todo lo demas identico.
  #
  # Por que: oauth2-proxy lleva `set_authorization_header = true`, asi que el
  # forwardAuth normal mete `Authorization: Bearer <token de Keycloak>` en la
  # peticion. Paperclip intenta validar ESE token como token suyo y responde
  # 401 en `GET /`. Medido dentro del pod, misma peticion:
  #     sin Authorization -> 200
  #     con Authorization -> 401
  # Con `sso-errors` delante, ese 401 se volvia un 302 a Keycloak, Keycloak
  # decia "ya estas dentro", volvia, y otra vez: bucle infinito de login.
  #
  # Y por que NO se vacia la cabecera con un middleware de headers, que es lo
  # que hace `aurora-ws-drop-authorization`: porque Paperclip usa esa MISMA
  # cabecera para sus API keys. Comprobado:
  #     Authorization: Bearer <clave falsa> -> 401 (token malo)
  #     sin cabecera                        -> 403 (no autenticado)
  # Vaciarla romperia el CLI y cualquier agente que hable con la API por el
  # edge. Lo correcto es no inyectarla, no borrarla.
  forwardAuth:
    address: http://oauth2-proxy.keycloak.svc.cluster.local:4180/oauth2/auth
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Forwarded-User
    maxResponseBodySize: 1048576
    trustForwardHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-paperclip-public
  namespace: traefik-edge
  labels:
    app.kubernetes.io/component: canonical-host-routing
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    # LAN y tailnet, directos: la app tiene su propio login.
    - kind: Rule
      match: Host(`paperclip.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 200
      services:
        - name: paperclip
          namespace: paperclip
          port: 3100
    # API: se autentica, pero SIN el reescritor de 401.
    - kind: Rule
      match: Host(`paperclip.e-dani.com`) && PathPrefix(`/api`)
      priority: 150
      middlewares:
        - name: paperclip-sso-auth
          namespace: traefik-edge
      services:
        - name: paperclip
          namespace: paperclip
          port: 3100
    # Navegacion normal: cadena completa, con su redireccion a Keycloak.
    - kind: Rule
      match: Host(`paperclip.e-dani.com`)
      priority: 100
      middlewares:
        # `sso-errors` da la pagina de login; el forwardAuth propio autentica
        # sin inyectar Authorization. Es `sso-chain` desmontado a mano.
        - name: sso-errors
          namespace: keycloak
        - name: paperclip-sso-auth
          namespace: traefik-edge
      services:
        - name: paperclip
          namespace: paperclip
          port: 3100
  tls:
    store:
      name: default
      namespace: traefik-edge
