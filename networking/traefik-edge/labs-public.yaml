---
# Public path carve-out for lab/demo artifacts in the OVH Object Storage bucket "labs",
# served by the objectstore-edge gateway since INFRA-1175 (before: the main MinIO):
#   https://s3.e-dani.com/labs/<key>
# NO auth middleware on purpose: the bucket holds only throwaway demos and the
# gateway allowlist serves it whole (objects only, no listing). Priority 300 beats the
# s3.e-dani.com SSO catch-all (100) and LAN bypass (200), same pattern as
# synapse-email-attachments-public.yaml and facturas-public.yaml.
# ExternalName hop: objectstore-edge-ext.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: labs-public
  namespace: traefik-edge
  labels: {app.kubernetes.io/part-of: synapse, app.kubernetes.io/managed-by: gitops}
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`s3.e-dani.com`) && PathPrefix(`/labs/`)
      priority: 300
      services:
        - name: objectstore-edge-ext
          namespace: traefik-edge
          port: 8000
  tls:
    store:
      name: default
      namespace: traefik-edge
