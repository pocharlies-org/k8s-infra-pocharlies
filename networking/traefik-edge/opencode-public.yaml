---
# Public edge route for the opencode web server (coding agent) running on x86 host.
# Cloudflare → traefik-edge → Service opencode-edge-host
# (ExternalName-less + EndpointSlice → x86 Tailscale IP).
# OpenCode's basic auth (OPENCODE_SERVER_PASSWORD) is the authentication authority
# on every path. Do not wrap this route in sso-chain: its error middleware rewrites
# OpenCode's legitimate 401 Basic challenge to the SSO login and creates a redirect loop.
apiVersion: v1
kind: Service
metadata:
  name: opencode-edge-host
  namespace: traefik-edge
  labels:
    app.kubernetes.io/name: opencode-edge-host
    app.kubernetes.io/part-of: traefik-edge-cutover
spec:
  ports:
    - name: http
      port: 19900
      targetPort: 19900
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: opencode-edge-host
  namespace: traefik-edge
  labels:
    kubernetes.io/service-name: opencode-edge-host
    app.kubernetes.io/name: opencode-edge-host
    app.kubernetes.io/part-of: traefik-edge-cutover
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 19900
endpoints:
  - addresses:
      - 100.83.56.98
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-opencode-public
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: code.e-dani.com
    external-dns.alpha.kubernetes.io/target: 141.94.73.52,141.94.73.50,145.239.194.168,57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`code.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 200
      services:
        - name: opencode-edge-host
          namespace: traefik-edge
          port: 19900
    - kind: Rule
      match: Host(`code.e-dani.com`)
      priority: 100
      services:
        - name: opencode-edge-host
          namespace: traefik-edge
          port: 19900
  tls:
    store:
      name: default
      namespace: traefik-edge
