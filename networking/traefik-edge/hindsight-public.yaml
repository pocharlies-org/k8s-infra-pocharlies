---
# Panel de Hindsight (memoria que sustituye al brain, INFRA-942) desde fuera: Cloudflare → traefik-edge →
# hindsight-control-plane (ns hindsight). Keycloak (sso-chain) SIEMPRE: el panel no tiene login propio y habla
# con la API con la key del tenant, o sea que enseña y edita todas las memorias (también las personales).
# ExternalName en el ns vigilado traefik-edge, como langfuse-public.yaml (el DaemonSet no vigila `hindsight`).
apiVersion: v1
kind: Service
metadata:
  name: hindsight-cp-ext
  namespace: traefik-edge
spec:
  type: ExternalName
  externalName: hindsight-control-plane.hindsight.svc.cluster.local
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-hindsight
  namespace: traefik-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hindsight.e-dani.com
    external-dns.alpha.kubernetes.io/target: 141.94.73.52,141.94.73.50,145.239.194.168,57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`hindsight.e-dani.com`)
      priority: 200
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: hindsight-cp-ext
          namespace: traefik-edge
          port: 3000
  tls:
    store:
      name: default
      namespace: traefik-edge
