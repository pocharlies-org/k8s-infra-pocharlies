---
# Credencial del scale set arc-skills-eval (SC-3635).
#
# El chart gha-runner-scale-set exige el githubConfigSecret DENTRO del namespace
# del scale set, asi que se materializa aqui el mismo item `arc-github-app` de
# 1Password que lee arc-runners (la App esta instalada a nivel de organizacion:
# cubre el repo del catalogo). Forma Connect (key: item + property: campo) y
# refreshPolicy OnChange, exigida por la Kyverno externalsecret-onepassword-onchange.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-skills-eval
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: arc-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
  data:
    - secretKey: github_app_id
      remoteRef:
        key: arc-github-app
        property: app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc-github-app
        property: installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: arc-github-app
        property: private_key
