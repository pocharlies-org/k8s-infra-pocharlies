apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.50.240-192.168.50.250
  autoAssign: true
  avoidBuggyIPs: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
  # RFC1918 VIPs are an x86 infrastructure responsibility. Both LoadBalancer
  # services use externalTrafficPolicy=Local and keep their endpoint on ubuntu.
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: ubuntu
