# SRE hygiene overlay for the live Helm release `metallb`.
# Use with post-renderer-sre.py so hostNetwork speaker pods use cluster DNS and
# do not emit DNSConfigForming warnings from long node resolver lists.
# Keeps Kyverno require-resource-limits from producing recurring warning noise.
controller:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi

speaker:
  # MetalLB only serves RFC1918 LAN VIPs, so speakers are needed solely on the
  # x86 infrastructure node. GPU workers must not carry network-plane pods.
  nodeSelector:
    kubernetes.io/hostname: ubuntu
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi
  frr:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  reloader:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
  frrMetrics:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 128Mi
  initContainers:
    cpFrrFiles:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi
    cpReloader:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
    cpMetrics:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
