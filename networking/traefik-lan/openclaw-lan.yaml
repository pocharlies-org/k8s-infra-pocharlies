apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openclaw-legacy-to-k8s
  namespace: traefik-lan
  labels:
    app.kubernetes.io/name: openclaw-legacy-redirect
    app.kubernetes.io/part-of: traefik-lan
spec:
  redirectRegex:
    regex: ^https://openclaw\.lan\.e-dani\.com/(.*)
    replacement: https://openclaw.e-dani.com/${1}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-openclaw
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`openclaw.lan.e-dani.com`)
      priority: 300
      middlewares:
        - name: openclaw-legacy-to-k8s
          namespace: traefik-lan
      # Traefik requires a service even though redirectRegex terminates the
      # request first. Use the active K8s OpenClaw backend, never Sauvage.
      services:
        - name: openclaw-qwen36-openclaw
          namespace: openclaw-qwen36
          port: 8080
  tls:
    store:
      name: default
      namespace: traefik-lan
