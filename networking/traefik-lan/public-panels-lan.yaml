---
# Split-horizon routes for human-facing panels. AdGuard sends these public
# names to Traefik LAN; Internet continues through traefik-edge + Keycloak.
#
# OJO: el Service de Chamber vive en networking/traefik-lan/openchamber-lan.yaml
# y se llama `openchamber-lan-stable` desde ff65fe0. Si se vuelve a renombrar,
# hay que tocar LOS DOS ficheros. Traefik no avisa con un backend caido: si el
# Service referenciado no existe, DESCARTA el router entero y la respuesta es un
# 404, no un 502 -- parece que la ruta no existe en vez de que el backend falle.
# El motivo real solo se ve en el log:
#   ERR "kubernetes service not found: traefik-lan/openchamber-lan-host"
#       ingress=lan-openchamber-public-host
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-openchamber-public-host
  namespace: traefik-lan
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      priority: 300
      match: Host(`chamber.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      services:
        - name: openchamber-lan-stable
          port: 3000
          serversTransport: openchamber-lan-transport
    - kind: Rule
      priority: 100
      match: Host(`chamber.e-dani.com`)
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: openchamber-lan-stable
          port: 3000
          serversTransport: openchamber-lan-transport
  tls:
    secretName: wildcard-edani-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-jarvis-public-host
  namespace: traefik-lan
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      priority: 400
      match: Host(`jarvis.e-dani.com`) && (Path(`/`) || Path(`/jarvis`) || Path(`/jarvis.html`)) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      middlewares:
        - name: jarvis-public-hud-shell
          namespace: jarvis
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      priority: 300
      match: Host(`jarvis.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
  tls:
    secretName: wildcard-edani-tls
