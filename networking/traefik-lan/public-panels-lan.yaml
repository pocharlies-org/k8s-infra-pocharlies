---
# Split-horizon routes for human-facing panels. AdGuard sends these public
# names to Traefik LAN; Internet continues through traefik-edge + Keycloak.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-jarvis-public-host
  namespace: traefik-lan
spec:
  entryPoints: [websecure]
  routes:
    # DGX-829, espejo de la 500 de lan-dgx-dashboard-public-host (INFRA-732): /api/interno/* solo por
    # el Service del clúster; 404 en el borde (edge-static-server), nunca al backend por este host.
    - kind: Rule
      priority: 500
      match: Host(`jarvis.e-dani.com`) && PathPrefix(`/api/interno`)
      services:
        - name: edge-static-server
          namespace: traefik-edge
          port: 8080
    - kind: Rule
      priority: 400
      match: Host(`jarvis.e-dani.com`) && (Path(`/`) || Path(`/jarvis`) || Path(`/jarvis.html`)) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: jarvis-public-hud-shell
          namespace: jarvis
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      priority: 300
      match: Host(`jarvis.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      # DGX-1314 (Dani, 27-10): LAN = Dani, como dgx.lan: todo el backend sin SSO con la identidad de Dani
      # estampada (sobrescribe cualquier cabecera forjada). Paridad: tests/test_jarvis_host_sso_parity_dgx_contract.py.
      middlewares:
        - name: dgx-lan-identidad-dani
          namespace: traefik-lan
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
  tls:
    secretName: wildcard-edani-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-bambulab-public-host
  namespace: traefik-lan
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      priority: 300
      match: Host(`bambulab.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      services:
        - name: bambulab
          namespace: bambulab
          port: 80
  tls:
    secretName: wildcard-edani-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-skirmbooks-public-host
  namespace: traefik-lan
spec:
  entryPoints: [websecure]
  # SKIRM-16 (decision D2 del CTO, 16-09-2026): se cierra el bypass LAN/tailnet
  # de skirmbooks (software fiscal con tenants y facturas). La regla del host
  # lleva ahora la cadena propia sso-skirmbooks-chain (ns keycloak, cookie
  # _skirmbooks_sso). El break-glass ya NO esta en el ingress: si el SSO falla,
  # acceso directo con
  #   kubectl -n skirmshop port-forward svc/skirmbooks-ui 8080:80
  # La regla /oauth2 (priority 310, SIN middleware) es imprescindible para que
  # el callback OAuth se complete desde LAN/tailnet; con forward-auth entraria
  # en bucle. Mismo patron que openclaw-k8s-readonly en canonical-hosts-lan.yaml.
  routes:
    - kind: Rule
      priority: 310
      match: Host(`skirmbooks.e-dani.com`) && PathPrefix(`/oauth2`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      services:
        - name: oauth2-proxy-skirmbooks
          namespace: keycloak
          port: 4180
    - kind: Rule
      priority: 300
      match: Host(`skirmbooks.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      middlewares:
        - name: sso-skirmbooks-chain
          namespace: keycloak
      services:
        - name: skirmbooks-ui
          namespace: skirmshop
          port: 80
  tls:
    secretName: wildcard-edani-tls
