---
# LAN split-horizon carve-out for lab/demo artifacts in the "labs" bucket.
# AdGuard rewrites s3.e-dani.com to the traefik-lan VIP (192.168.50.240), where
# lan-dgx-s3-media-public-host would otherwise swallow the path and hand it to
# the dashboard media gateway. Priority 400 wins for the bucket prefix so the
# SAME URL works on LAN/Tailscale and on the internet (traefik-edge carve-out
# at networking/traefik-edge/labs-public.yaml). No auth middleware: the labs
# bucket is anonymous-download on purpose (throwaway demos only).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-labs
  namespace: traefik-lan
  labels: {app.kubernetes.io/part-of: synapse, app.kubernetes.io/managed-by: gitops}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`s3.e-dani.com`) && PathPrefix(`/labs`)
      priority: 400
      services:
        - name: minio-s3
          namespace: minio
          port: 9000
  tls:
    store:
      name: default
      namespace: traefik-lan
