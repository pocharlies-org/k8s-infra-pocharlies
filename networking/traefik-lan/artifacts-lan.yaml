---
# DGX-936: artifacts de `publish_html` (ofimatica) en https://s3.e-dani.com/artifacts/
# desde la LAN, la tailnet y los pods. AdGuard y CoreDNS llevan s3.e-dani.com al VIP
# de traefik-lan, donde lan-dgx-s3-media-public-host (prio 300) se tragaría la ruta;
# priority 400 gana para el prefijo, como labs-lan.yaml. `pub/` es público (también
# en traefik-edge/artifacts-public.yaml); `lan/` solo con el ClientIP de la ruta
# skirmshop-s3.lan.e-dani.com que lo servía antes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-artifacts
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`s3.e-dani.com`) && PathPrefix(`/artifacts/pub/`)
      priority: 400
      services:
        - name: skirmshop-drive-s3
          namespace: backup-hub
          port: 9000
    - kind: Rule
      match: Host(`s3.e-dani.com`) && PathPrefix(`/artifacts/lan/`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 400
      services:
        - name: skirmshop-drive-s3
          namespace: backup-hub
          port: 9000
  tls:
    store:
      name: default
      namespace: traefik-lan
