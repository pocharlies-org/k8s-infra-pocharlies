---
# Direct LAN/Tailscale entrypoint for the OpenChamber runtime on x86.
# chamber.lan.e-dani.com resolves to the Traefik LAN VIP (192.168.50.240),
# while chamber.e-dani.com remains on the Cloudflare/Keycloak public route.
apiVersion: v1
kind: Service
metadata:
  name: openchamber-lan-stable
  namespace: traefik-lan
  labels:
    app.kubernetes.io/name: openchamber-lan-stable
    app.kubernetes.io/part-of: traefik-lan
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: openchamber-lan-stable
  namespace: traefik-lan
  labels:
    kubernetes.io/service-name: openchamber-lan-stable
    app.kubernetes.io/name: openchamber-lan-stable
    app.kubernetes.io/part-of: traefik-lan
# Argo CD excludes both Endpoints and EndpointSlice discovery. Keep the exact
# desired slice here and reconcile it explicitly after a rollout or restore.
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 3000
endpoints:
  # MagicDNS from the Traefik nodes is intermittent. Pin the stable x86
  # Tailscale address.
  - addresses: [100.83.56.98]
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: openchamber-lan-transport
  namespace: traefik-lan
spec:
  maxIdleConnsPerHost: 128
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-openchamber
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`chamber.lan.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 300
      services:
        - name: openchamber-lan-stable
          port: 3000
          serversTransport: openchamber-lan-transport
    # Keep a defensive SSO fallback if the private hostname is ever reached
    # from a source outside the explicitly trusted networks.
    - kind: Rule
      match: Host(`chamber.lan.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: openchamber-lan-stable
          port: 3000
          serversTransport: openchamber-lan-transport
  tls:
    store:
      name: default
      namespace: traefik-lan
