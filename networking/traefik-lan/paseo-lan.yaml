---
# Paseo en la LAN / tailnet (ver traefik-edge/paseo-public.yaml): AdGuard manda paseo.e-dani.com al VIP de
# traefik-lan y de aqui va al daemon Paseo, hoy en el pod paseo-0 de atlantic (Service paseo.paseo).
# El nombre del Service conserva -x86 por historia; el backend ya no es el x86. Si el host llega desde otra red, sso-chain.
apiVersion: v1
kind: Service
metadata:
  name: paseo-lan-x86
  namespace: traefik-lan
  labels:
    app.kubernetes.io/name: paseo-lan-x86
    app.kubernetes.io/part-of: traefik-lan
spec:
  type: ExternalName
  externalName: paseo.paseo.svc.cluster.local
  ports:
    - name: http
      port: 6767
      targetPort: 6767
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-paseo
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`paseo.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 300
      services:
        - name: paseo-lan-x86
          port: 6767
    - kind: Rule
      match: Host(`paseo.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: paseo-lan-x86
          port: 6767
  tls:
    secretName: wildcard-edani-tls
---
# Paseo del mac-cb (SC-2473): mismo montaje que paseo.e-dani.com pero contra el daemon launchd del
# MacBook CloudBlue (100.125.62.10:6767, PASEO_WEB_UI_ENABLED + contraseña). AdGuard manda
# paseocb.e-dani.com al VIP de traefik-lan.
apiVersion: v1
kind: Service
metadata:
  name: paseo-lan-maccb
  namespace: traefik-lan
