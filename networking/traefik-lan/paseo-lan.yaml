        - name: paseo-lan-maccb
          port: 6767
    - kind: Rule
      match: Host(`paseocb.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: paseo-lan-maccb
          port: 6767
  tls:
    secretName: wildcard-edani-tls
---
