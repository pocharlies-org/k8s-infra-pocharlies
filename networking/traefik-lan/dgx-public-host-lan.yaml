---
# Split-horizon LAN entrypoints for the public DGX hostnames.
#
# AdGuard rewrites these names to the Traefik LAN VIP (192.168.50.240), so LAN,
# Tailscale and in-cluster callers can use the same public URLs without hitting
# Cloudflare/Keycloak. Non-LAN callers should resolve the public Cloudflare route
# and remain protected by the traefik-edge SSO route.
#
# SC-702 (SC-1191/SC-1192): the ClientIP bypass routes below used to serve the
# dashboard backend with no middlewares at all, so a LAN caller could forge the
# X-Auth-Request-* identity headers the backend trusts (measured live: forged
# X-Auth-Request-Groups granted POST /api/company/control/on). Two fixes:
#   H1 — dgx-strip-identity-headers empties the 7 identity headers on EVERY
#        route, chained BEFORE sso-chain where present (never after: it would
#        wipe the headers oauth2-proxy injects and break login).
#   H2 — (retirado en DGX-1314, abajo) el control set iba tras sso-chain
#        también para LAN/tailnet/cluster.
# The same Middleware is defined once per Traefik instance (here and in
# networking/traefik-edge/dgx-dashboard-public.yaml) — traefik-lan and
# traefik-edge are separate instances and each resolves middlewares in the
# namespaces it watches. Precedent: sauvage-bot-strip-auth-headers.
#
# DGX-1314 (Dani, 27-10): en LAN y tailnet el dashboard no pide Keycloak: LAN = Dani.
# Las rutas con gate ClientIP estampan su identidad (dgx-lan-identidad-dani) en vez de
# pasar por sso-chain; la estampa SOBRESCRIBE las 7 cabeceras, así que una cabecera
# forjada no da más que eso. Riesgo aceptado por Dani: cualquier máquina o pod de esos
# rangos actúa como él. Desde fuera (borde y la regla 100) sigue sso-chain.
# INFRA-1321: excepción — lo que autoriza con el JWT verificado (DGX-807: `puede_operar`,
# `es_dani`, escrituras de clúster) no puede vivir en la 300, porque la estampa no lleva
# Bearer y todas daban 403 desde la LAN. Esas rutas vuelven a sso-chain en la 400/350,
# como /alarma en la 415 (SC-5366); la página y las lecturas siguen sin login.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dgx-strip-identity-headers
  namespace: traefik-lan
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
      X-Auth-Request-Preferred-Username: ""
      X-Forwarded-User: ""
      X-Forwarded-Email: ""
      X-Forwarded-Groups: ""
---
# Lo que oauth2-proxy estamparía para Dani (usuario me@e-dani.com del realm edani; sus
# grupos de Keycloak medidos el 27-10). Si cambian sus grupos, se cambian aquí.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dgx-lan-identidad-dani
  namespace: traefik-lan
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: me@e-dani.com
      X-Auth-Request-Email: me@e-dani.com
      X-Auth-Request-Groups: /company-operator,/edani-admins,/skirmbooks-admins
      X-Auth-Request-Preferred-Username: me@e-dani.com
      X-Forwarded-User: me@e-dani.com
      X-Forwarded-Email: me@e-dani.com
      X-Forwarded-Groups: /company-operator,/edani-admins,/skirmbooks-admins
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-dgx-dashboard-public-host
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    # DGX-1113: los endpoints del propio oauth2-proxy (sign_in, callback, sign_out) sobre
    # los hosts dgx, SIN cadena SSO (autenticarse exigiría estar autenticado). El enlace
    # «Sign Out» de la página 403 del proxy apunta a /oauth2/sign_out del host actual: sin
    # esta regla caía en el bypass (300) → dashboard → 404 y el 403 no tenía salida.
    # Precedentes: lan-skirmbooks-public-host (LAN) y edge-chat-public (edge).
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && PathPrefix(`/oauth2`)
      priority: 600
      services:
        - name: oauth2-proxy
          namespace: keycloak
          port: 4180
    # INFRA-732 (P6a-2): /api/interno/* son rutas internas del dashboard que solo debe
    # alcanzar el forwardAuth interno de Traefik, por el Service del clúster
    # (control-nexus/dgx-dashboard-ui), nunca por una IngressRoute. Sin esta regla caían
    # en el bypass LAN (300) o en la pública (100) y llegaban al backend. Prioridad 500:
    # por encima de /messages (450) y del control set (400), y por delante de las de
    # 200/400 (C1). Un solo prefijo cubre las rutas internas futuras: no una regla por
    # ruta (No construir). No se reenvía al backend: se responde 404 en el borde desde
    # edge-static-server (ns traefik-edge, referenciado cross-namespace como hacen ya las
    # rutas de este fichero con control-nexus/messages/keycloak), que devuelve 404 para
    # cualquier Host no incluido en su allowlist de ficheros (dgx.e-dani.com y
    # dgx.lan.e-dani.com no lo están). El 404 es del borde, no del backend (D2).
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && PathPrefix(`/api/interno`)
      priority: 500
      services:
        - name: edge-static-server
          namespace: traefik-edge
          port: 8080
    # Consola de mensajería → dgx-messages (ns messages), gemela de la ruta 450
    # del edge (networking/traefik-edge/dgx-dashboard-public.yaml): página,
    # assets propios, API y SSE, siempre tras sso-chain y con las cabeceras de
    # identidad borradas antes, para quien no venga de LAN/tailnet (DGX-1314: esos
    # entran por la 460 de abajo, con la identidad de Dani y sin login).
    # /static/vendor/react/ también: la consola carga su React de ahí y el dashboard ya no
    # lo tiene (INFRA-265 lo borró; sin esto /messages salía en blanco, DGX-1181).
    # DGX-291 (P4): entran además la consola de WhatsApp (/{whatsapp,whatsapp-console,
    # conversaciones}, /api/whatsapp/*) y la mensajería de autoreply; la partición ops
    # (telegram/* salvo conversations, brain, systems) se expresa por prioridad: esas
    # rutas no matchean aquí y siguen cayendo en la 300 (dashboard).
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`)) && (Path(`/messages`) || PathPrefix(`/messages/`) || PathPrefix(`/static/messages/`) || PathPrefix(`/static/vendor/react/`) || PathPrefix(`/api/messages`) || Path(`/whatsapp`) || PathPrefix(`/whatsapp/`) || Path(`/whatsapp-console`) || PathPrefix(`/whatsapp-console/`) || Path(`/conversaciones`) || PathPrefix(`/conversaciones/`) || PathPrefix(`/api/whatsapp`) || (PathPrefix(`/api/autoreply`) && ((!PathPrefix(`/api/autoreply/telegram`)) || Path(`/api/autoreply/telegram/conversations`)) && !PathPrefix(`/api/autoreply/brain`) && !PathPrefix(`/api/autoreply/systems`)))
      priority: 460
      middlewares:
        - name: dgx-lan-identidad-dani
          namespace: traefik-lan
      services:
        - name: dgx-messages
          namespace: messages
          port: http
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && (Path(`/messages`) || PathPrefix(`/messages/`) || PathPrefix(`/static/messages/`) || PathPrefix(`/static/vendor/react/`) || PathPrefix(`/api/messages`) || Path(`/whatsapp`) || PathPrefix(`/whatsapp/`) || Path(`/whatsapp-console`) || PathPrefix(`/whatsapp-console/`) || Path(`/conversaciones`) || PathPrefix(`/conversaciones/`) || PathPrefix(`/api/whatsapp`) || (PathPrefix(`/api/autoreply`) && ((!PathPrefix(`/api/autoreply/telegram`)) || Path(`/api/autoreply/telegram/conversations`)) && !PathPrefix(`/api/autoreply/brain`) && !PathPrefix(`/api/autoreply/systems`)))
      priority: 450
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
      services:
        - name: dgx-messages
          namespace: messages
          port: http
    # DGX-1539: /api/identidad (con qué usuario está la sesión) solo lee el Bearer verificado
    # (DGX-807) y la 300 de DGX-1314 estampa cabeceras, que el backend no cree: sin sso-chain el
    # chip de la app diría «cuenta» siempre. Como Nova (420): strip + sso-chain + prueba de borde.
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && Path(`/api/identidad`)
      priority: 430
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    # INFRA-1247 (Dani, 10-11): el panel de Nova sí pide Keycloak en LAN y tailnet, a diferencia del resto (DGX-1314).
    # Su backend (/api/nova, ESCRITURA_CLUSTER) solo cree en el JWT (DGX-807) y la 300 no lo trae; sso-chain lo pone.
    # Va la página (/nova, la pantalla Expo) para que la carga lleve al login, y la API entera (todos los métodos):
    # crea un pod que entra en un Meet con la cuenta de Google de Nova y el estado es la transcripción (security).
    # La app del iPhone manda su propio Bearer (cliente dgx-app), que oauth2-proxy acepta.
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && (Path(`/nova`) || PathPrefix(`/api/nova`))
      priority: 420
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    # SC-5366 (Dani, 11-11): la Alarma sí pide Keycloak en LAN y tailnet, como Nova (420).
    # Su guarda (`guarda_app`) lee la identidad solo del JWT verificado (DGX-807) y la 300 estampa
    # cabeceras, que el backend no cree: sin Bearer el email es vacío y `/api/app/alarma` daba 403
    # hasta a Dani (medido: /api/identidad 200 en la misma página y el mismo minuto). Va la página
    # (/alarma) para que la carga lleve al login, y la API entera: `PathPrefix` cubre las órdenes
    # (/confirmar, /desarmar), las cámaras (/directo, /foto, /eventos) y la planta. El borde ya la
    # tenía en su control set (networking/traefik-edge/dgx-dashboard-public.yaml); faltaba el espejo.
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && (Path(`/alarma`) || PathPrefix(`/api/app/alarma`))
      priority: 415
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    # DGX-1539 (Dani, 12-11): el control set vuelve íntegro tras sso-chain, lecturas incluidas.
    # INFRA-1321 subió solo las escrituras de /api/company y /api/model-routing, pero la puerta del
    # configurador la marca la LECTURA: GET /api/company/control devuelve `puede_operar`, que desde
    # DGX-807 solo sale del Bearer — sin él sale false para todos (también el operador) y alarma/
    # cuentas quedan en «tu usuario solo puede mirar». Con la cookie _edani_sso puesta sso-chain es
    # transparente; solo un anónimo sin cookie cae al login. Sustituye a la 400 estrecha de
    # INFRA-1321 (absorbida). Sin /api/messages ni /api/autoreply (los gana la 460) ni /api/app/alarma
    # (la gana la 415). Espejo en jarvis: tests/test_jarvis_host_sso_parity_dgx_contract.py.
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`)) && (PathPrefix(`/api/company`) || PathPrefix(`/api/litellm/keys`) || PathPrefix(`/api/litellm/config`) || PathPrefix(`/api/claude-sessions`) || PathPrefix(`/api/hermes-sessions`) || PathPrefix(`/api/app/secure`) || PathPrefix(`/api/app/pagos`) || PathPrefix(`/api/app/push`) || PathPrefix(`/api/email/state`) || PathPrefix(`/plaud`) || PathPrefix(`/api/plaud`) || PathPrefix(`/entregas`) || PathPrefix(`/static/entregas`) || PathPrefix(`/api/model-routing`) || PathPrefix(`/api/hermes-panel`) || (PathPrefix(`/api/secretaria`) && !PathRegexp(`^/api/secretaria/despacho(/secretaria(-[a-z]+)?)?/escalar$`)) || PathPrefix(`/despacho-secretaria`) || PathPrefix(`/cuentas`))
      priority: 400
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    # DGX-821: TODO POST /api/cluster/* (refresh y docker incluidos) va por SSO: el backend
    # exige en todas esas rutas la prueba de borde y el grupo /edani-admins (guarda_cluster, que
    # lee los grupos del JWT). DGX-1539: el resto de escrituras del panel vuelve también (ver 400)
    # — sin Bearer el guarda rechaza también al operador. Absorbe la 350 estrecha de INFRA-1321.
    # Las lecturas de estas rutas quedan en la 300 (son las LECTURAS_ABIERTAS del contrato de paridad).
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`)) && ((PathPrefix(`/api/cluster/`) || Path(`/api/compute/mode`) || Path(`/api/llm/dgx3/mode`) || Path(`/api/activity/power`) || Path(`/api/llm/uncensored`) || PathRegexp(`^/api/litellm/background-consumers/[^/]+/(block|unblock)$`)) && Method(`POST`))
      priority: 350
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    # dgx.lan.e-dani.com resolves publicly to the LAN VIP (DoH-proof, unlike the
    # AdGuard rewrite of dgx.e-dani.com that DoH clients skip), so LAN/Tailscale
    # browsers land here without Cloudflare/Keycloak. Same ClientIP gate.
    # DGX-1314: el resto del dashboard (lecturas sin decisión) entra aquí con la identidad de Dani
    # estampada; una cabecera forjada queda sobrescrita. DGX-1539: el control set y las escrituras NO
    # (suben a 400/350 con sso-chain) porque el backend no autoriza con cabeceras (DGX-807).
    - kind: Rule
      match: (Host(`dgx.e-dani.com`) || Host(`dgx.lan.e-dani.com`)) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 300
      middlewares:
        - name: dgx-lan-identidad-dani
          namespace: traefik-lan
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      match: Host(`dgx.e-dani.com`)
      priority: 100
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
  tls:
    store:
      name: default
      namespace: traefik-lan
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-dgx-s3-media-public-host
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    # DGX-1539: hermana del host dgx — el control set y las escrituras vuelven tras sso-chain (ver el
    # comentario de la regla 400 de lan-dgx-dashboard-public-host). Sin Bearer el backend no autoriza (DGX-807).
    - kind: Rule
      match: Host(`s3.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`)) && (PathPrefix(`/api/company`) || PathPrefix(`/api/litellm/keys`) || PathPrefix(`/api/litellm/config`) || PathPrefix(`/api/messages`) || PathPrefix(`/api/autoreply`) || PathPrefix(`/api/claude-sessions`) || PathPrefix(`/api/app/secure`) || PathPrefix(`/api/email/state`) || PathPrefix(`/plaud`) || PathPrefix(`/api/plaud`) || PathPrefix(`/entregas`) || PathPrefix(`/static/entregas`) || (PathPrefix(`/api/secretaria`) && !PathRegexp(`^/api/secretaria/despacho(/secretaria(-[a-z]+)?)?/escalar$`)) || PathPrefix(`/despacho-secretaria`))
      priority: 400
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      match: Host(`s3.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`)) && ((PathPrefix(`/api/cluster/`) || Path(`/api/compute/mode`) || Path(`/api/llm/dgx3/mode`) || Path(`/api/activity/power`) || Path(`/api/llm/uncensored`) || PathRegexp(`^/api/litellm/background-consumers/[^/]+/(block|unblock)$`)) && Method(`POST`))
      priority: 350
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      match: Host(`s3.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 300
      middlewares:
        - name: dgx-lan-identidad-dani
          namespace: traefik-lan
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
    - kind: Rule
      match: Host(`s3.e-dani.com`)
      priority: 100
      middlewares:
        - name: dgx-strip-identity-headers
          namespace: traefik-lan
        - name: sso-chain
          namespace: keycloak
        - name: dgx-edge-proof
          namespace: traefik-lan
      services:
        - name: dgx-dashboard-ui
          namespace: control-nexus
          port: 80
  tls:
    store:
      name: default
      namespace: traefik-lan
