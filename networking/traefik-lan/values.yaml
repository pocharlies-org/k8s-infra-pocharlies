# Traefik LAN values — internal ingress, exposed via MetalLB VIP 192.168.50.240
deployment:
  # LAN ingress is an x86 infrastructure responsibility. Keep GPU workers free
  # for GPU workloads and serve the RFC1918 VIP from the physical LAN host.
  replicas: 1

podDisruptionBudget:
  enabled: false

ingressClass:
  enabled: true
  name: traefik-lan
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: true

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    http3:
      enabled: false
  metrics:
    port: 9100
    expose:
      default: false
    exposedPort: 9100
    protocol: TCP

additionalArguments:
  # ":443" (client-facing port), NOT "websecure": the entrypoint name resolves
  # to the container port 8443, which is not reachable from LAN clients.
  - --entrypoints.web.http.redirections.entrypoint.to=:443
  - --entrypoints.web.http.redirections.entrypoint.scheme=https
  - --entrypoints.websecure.http.tls=true
  - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
  - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0

service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: 192.168.50.240
  spec:
    # MetalLB routes the VIP directly; the backing NodePorts are unnecessary.
    allocateLoadBalancerNodePorts: false
    # Preserve the original client address: several LAN routes use ClientIP()
    # authorization. MetalLB advertises only from Ready LAN nodes that have a
    # local endpoint, while cluster callers use the Service and can reach OVH.
    externalTrafficPolicy: Local

# Dashboard — internal only, will protect with SSO later
ingressRoute:
  dashboard:
    enabled: false   # enable later behind Keycloak

logs:
  access:
    enabled: true
    format: json
  general:
    level: INFO

metrics:
  prometheus:
    entryPoint: metrics
    # Chart 40.2.0 renders this as a dedicated ClusterIP Service.
    service:
      enabled: true

# Allow some resilience
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector:
  kubernetes.io/hostname: ubuntu
