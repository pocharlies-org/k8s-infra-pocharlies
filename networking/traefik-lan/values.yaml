# Traefik LAN values — internal ingress, exposed via MetalLB VIP 192.168.50.240
deployment:
  # LAN ingress is an x86 infrastructure responsibility. Keep GPU workers free
  # for GPU workloads and serve the RFC1918 VIP from the physical LAN host.
  replicas: 1

podDisruptionBudget:
  enabled: false

# Single pod pinned to ubuntu with pod anti-affinity: a surge pod can never
# schedule, so a rolling update with maxSurge 1 / maxUnavailable 0 hangs forever
# (01-10: the 1Gi rollout sat Pending). Same strategy as traefik-edge.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

ingressClass:
  enabled: true
  name: traefik-lan
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: true

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    http3:
      enabled: false
  metrics:
    port: 9100
    expose:
      default: false
    exposedPort: 9100
    protocol: TCP

additionalArguments:
  # ":443" (client-facing port), NOT "websecure": the entrypoint name resolves
  # to the container port 8443, which is not reachable from LAN clients.
  - --entrypoints.web.http.redirections.entrypoint.to=:443
  - --entrypoints.web.http.redirections.entrypoint.scheme=https
  - --entrypoints.websecure.http.tls=true
  - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
  - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0

service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: 192.168.50.240
  spec:
    # MetalLB routes the VIP directly; the backing NodePorts are unnecessary.
    allocateLoadBalancerNodePorts: false
    # Preserve the original client address: several LAN routes use ClientIP()
    # authorization. MetalLB advertises only from Ready LAN nodes that have a
    # local endpoint, while cluster callers use the Service and can reach OVH.
    externalTrafficPolicy: Local

# Dashboard — internal only, will protect with SSO later
ingressRoute:
  dashboard:
    enabled: false   # enable later behind Keycloak

logs:
  access:
    enabled: true
    format: json
  general:
    level: INFO

metrics:
  prometheus:
    entryPoint: metrics
    # Chart 40.2.0 renders this as a dedicated ClusterIP Service.
    service:
      enabled: true

# Allow some resilience. 512Mi was the ceiling it lived against (01-10: 511Mi
# used, GC burning 4 cores, liveness timeouts and a restart loop that took the
# whole *.lan.e-dani.com down, Harbor included).
# SC-1390: cpu request 100m left the /ping handler queued behind agentgateway-mcp
# traffic on a saturated ubuntu node (load ~11, peaks of 8 cores in GC storms),
# so the 2s liveness timeout fired and each Exit-137 restart dropped every LAN
# probe behind the VIP. 500m gives the pod a real CPU floor; the probes are
# relaxed to ride out GC pauses instead of killing the pod.
resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    memory: 1Gi

# Chart 40.2.0 renders these verbatim; the path stays /ping on the traefik
# (8080) port via deployment.livenessPath/readinessPath defaults.
livenessProbe:
  failureThreshold: 5
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5
readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

nodeSelector:
  kubernetes.io/hostname: ubuntu

# Repeat the x86 constraint in affinity so server-side apply overwrites the
# former multi-node required affinity owned by an older Helm deployment.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [ubuntu]
topologySpreadConstraints: []
tolerations:
  - key: pool
    operator: Equal
    value: dev
    effect: PreferNoSchedule
