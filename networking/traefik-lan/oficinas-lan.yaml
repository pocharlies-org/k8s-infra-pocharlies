---
# SC-5375: Las Oficinas en LAN/tailnet con el mismo SSO que el acceso edge.
# App ArgoCD independiente: oficinas.oficinas, sin reinicios de Paseo/company.
apiVersion: v1
kind: Service
metadata:
  name: oficinas-lan-host
  namespace: traefik-lan
  labels:
    app.kubernetes.io/name: oficinas-lan-host
    app.kubernetes.io/part-of: traefik-lan
spec:
  type: ExternalName
  externalName: oficinas.oficinas.svc.cluster.local
  ports:
    - name: http
      port: 19930
      targetPort: 19930
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-oficinas
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`oficinas.e-dani.com`)
      priority: 300
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: oficinas-lan-host
          port: 19930
  tls:
    secretName: wildcard-edani-tls
