---
# Las Oficinas en la LAN / tailnet (ver traefik-edge/oficinas-public.yaml). Con SSO también aquí: la vista
# enseña sesiones y claves de Jira y su /api/ask habla con Hermes.
# Backend: el Service del pod company (SC-5299, épica SC-3637). El panel queda caído hasta que el proceso
# entre en el pod y el svc `company` publique el 19930 (medido 12-11-2026: oficinas.service ya no existe).
apiVersion: v1
kind: Service
metadata:
  name: oficinas-lan-host
  namespace: traefik-lan
  labels:
    app.kubernetes.io/name: oficinas-lan-host
    app.kubernetes.io/part-of: traefik-lan
spec:
  type: ExternalName
  externalName: company.paseo.svc.cluster.local
  ports:
    - name: http
      port: 19930
      targetPort: 19930
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-oficinas
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`oficinas.e-dani.com`)
      priority: 300
      middlewares:
        - name: sso-chain
          namespace: keycloak
      services:
        - name: oficinas-lan-host
          port: 19930
  tls:
    secretName: wildcard-edani-tls
