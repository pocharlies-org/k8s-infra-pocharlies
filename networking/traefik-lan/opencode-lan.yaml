---
# Same-host LAN publication for OpenCode. Split DNS sends code.e-dani.com to
# Traefik LAN; Internet DNS remains on Cloudflare and the Keycloak-protected edge.
apiVersion: v1
kind: Service
metadata:
  name: opencode-lan-host
  namespace: traefik-lan
  labels:
    app.kubernetes.io/name: opencode-lan-host
    app.kubernetes.io/part-of: traefik-lan
spec:
  ports:
    - name: http
      port: 19900
      targetPort: 19900
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: opencode-lan-host
  namespace: traefik-lan
  labels:
    kubernetes.io/service-name: opencode-lan-host
    app.kubernetes.io/name: opencode-lan-host
    app.kubernetes.io/part-of: traefik-lan
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 19900
endpoints:
  - addresses:
      - 100.83.56.98
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-opencode-public-host
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`code.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`) || ClientIP(`10.43.0.0/16`))
      priority: 300
      services:
        - name: opencode-lan-host
          port: 19900
  tls:
    secretName: wildcard-edani-tls
