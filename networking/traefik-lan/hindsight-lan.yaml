---
# Panel de Hindsight en la LAN / tailnet (ver traefik-edge/hindsight-public.yaml). Desde la LAN, la tailnet y
# los pods entra sin login (Dani, 18-10-2026); cualquier otro origen pasa por sso-hindsight-chain (solo
# /edani-admins), como grafana con su bypass.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lan-hindsight
  namespace: traefik-lan
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`hindsight.e-dani.com`) && (ClientIP(`192.168.50.0/24`) || ClientIP(`100.64.0.0/10`) || ClientIP(`10.42.0.0/16`))
      priority: 300
      services:
        - {name: hindsight-control-plane, namespace: hindsight, port: 3000}
    - kind: Rule
      match: Host(`hindsight.e-dani.com`) && PathPrefix(`/oauth2`)
      priority: 110
      services:
        - {name: oauth2-proxy-hindsight, namespace: keycloak, port: 4180}
    - kind: Rule
      match: Host(`hindsight.e-dani.com`)
      priority: 100
      middlewares:
        - name: sso-hindsight-chain
          namespace: keycloak
      services:
        - {name: hindsight-control-plane, namespace: hindsight, port: 3000}
  tls:
    secretName: wildcard-edani-tls
