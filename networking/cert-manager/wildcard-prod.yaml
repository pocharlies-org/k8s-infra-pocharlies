---
# Wildcard cert for *.lan.e-dani.com (internal services)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lan
  namespace: traefik-lan
spec:
  secretName: wildcard-lan-tls
  # 2026-08-25: la clave privada de este certificado quedo expuesta en claro en
  # una transcripcion (volcado accidental de `kubectl get secret -o ...data`).
  # Sin rotationPolicy cert-manager REUTILIZA la clave en cada renovacion, asi
  # que renovar no habria rotado nada. Con `Always` cada emision genera clave
  # nueva, y este mismo cambio de spec fuerza una reemision inmediata.
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "adguard,argocd,harbor,longhorn-system,minio,monitoring,vault"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.lan.e-dani.com"
  dnsNames:
    - "*.lan.e-dani.com"
    - lan.e-dani.com
---
# Wildcard cert for *.e-dani.com (public services — will move to traefik-edge ns later)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-edani
  namespace: traefik-lan
spec:
  secretName: wildcard-edani-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.e-dani.com"
  dnsNames:
    - "*.e-dani.com"
    - e-dani.com
