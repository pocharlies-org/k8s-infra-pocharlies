---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  edani-public-lan.server: |
    e-dani.com:53 {
      errors
      # GENERATED by scripts/gen_coredns_edani.py -- do not edit by hand.
      # Every Host(`*.e-dani.com`) served by an IngressRoute under
      # networking/traefik-lan/ is pinned here so an in-cluster client always
      # reaches traefik-lan over the LAN instead of falling through to
      # `forward` and answering the node's MagicDNS -- which flips between the
      # LAN and the public Cloudflare edge per node (SC-2443/SC-2445: a >100 MB
      # Harbor layer got 413/502 through the Cloudflare proxy; INFRA-889: the
      # libreplay probe flipped to the edge).  A name that must NOT be pinned
      # goes in networking/dns/coredns-edani-exclusions.yaml with a one-line
      # reason; the CI job coredns-edani-guard fails if a Host is neither
      # pinned nor excluded.  dgx and s3 go to the `hosts` block below (a
      # rewrite runs before `hosts` and would leave the entry dead).
      rewrite name exact adguard-setup.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact adguard.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact agentgateway-mcp-stg.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact agentgateway-mcp.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact alertmanager.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact argocd.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact aurora-api.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact aurora.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact bambulab.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact borradores.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact borradores.lan.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact cine.lan.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact correo.lan.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact dgx-synapse-mcp.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact dgx.lan.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact firecrawl.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact grafana.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact ha-dashboard.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact harbor.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact harbor.lan.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact hindsight.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact home-assistant.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact jarvis.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact keep-api.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact keep.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact langfuse.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact libreplay.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact litellm.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact longhorn.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact mcp-socialmedia.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact minio-s3.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact minio.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact oficinas.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact openclaw-k8s-readonly.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact openclaw-k8s-webhooks.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact openclaw-k8s.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact openclaw.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact openclaw.lan.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact paseo.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact paseocasa.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact paseocb.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact picqer-mcp.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact pypi.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact sauvage-bot.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact sauvage-bot.lan.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact skirmbooks.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact skirmshop-s3-console.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact skirmshop-s3.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact stt-mcp.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact synapse.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact synapse.lan.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact teslamate.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact uriel.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact vm.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact whatsapp-pro.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      rewrite name exact whatsapp.e-dani.com traefik-lan.traefik-lan.svc.cluster.local
      kubernetes cluster.local in-addr.arpa ip6.arpa {
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
      }
      hosts {
        # Split-horizon for e-dani.com points at traefik-lan over the LAN
        # (metallb 192.168.50.240), which terminates TLS for *.e-dani.com.
        # The old pin to the x86 tailnet IP (100.83.56.98) broke TLS: only
        # tailscaled listens on that :443 (INFRA-588).
        192.168.50.240 dgx.e-dani.com
        192.168.50.240 s3.e-dani.com
        ttl 60
        fallthrough
      }
      forward . /etc/resolv.conf
      cache 30
    }
  x86-taile0ad27.server: |
    # This must be a dedicated zone: a hosts entry in e-dani.com does not
    # answer queries for x86.taile0ad27.ts.net.  Traefik ExternalName
    # backends use this pin rather than node-local MagicDNS.
    taile0ad27.ts.net:53 {
      errors
      hosts {
        100.83.56.98 x86.taile0ad27.ts.net
        100.125.62.10 mac-cb.taile0ad27.ts.net
        100.82.219.103 mac-casa.taile0ad27.ts.net
        ttl 60
        fallthrough
      }
      forward . /etc/resolv.conf
      cache 30
    }
