# CoreDNS de respaldo en sauvage (INFRA-923, 17-10-2026).
#
# Para qué: coredns-x86 le pregunta a él cuando la MagicDNS del x86 contesta
# SERVFAIL o REFUSED (su `forward` con `failover`). Pregunta a la MagicDNS de
# SAUVAGE, que no depende de las prefs de Tailscale del x86.
#
# Solo resuelve nombres externos: lo de *.cluster.local, NodeHosts y
# coredns-custom ya lo contesta coredns-x86 antes de reenviar. Sin
# `k8s-app: kube-dns` a propósito: no entra en el Service `kube-dns` ni cambia
# el DNS de los pods de sauvage.
#
# ClusterIP fija porque `forward` solo acepta IPs; si cambia, cambia también en
# el Corefile de coredns-x86.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-sauvage
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        cache 30
        loop
        reload
        forward . /etc/resolv.conf
    }
---
apiVersion: v1
kind: Service
metadata:
  name: coredns-sauvage
  namespace: kube-system
  labels:
    app.kubernetes.io/name: coredns-sauvage
spec:
  type: ClusterIP
  clusterIP: 10.43.0.11
  selector:
    app.kubernetes.io/name: coredns-sauvage
  ports:
    - { name: dns, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-sauvage
  namespace: kube-system
  labels:
    app.kubernetes.io/name: coredns-sauvage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: coredns-sauvage
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coredns-sauvage
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-cluster-critical
      nodeSelector:
        kubernetes.io/hostname: sauvage
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.100.100.100
      containers:
        - name: coredns
          # Misma imagen que coredns-x86 y el CoreDNS de k3s.
          image: rancher/mirrored-coredns-coredns:1.14.4
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - { name: dns, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
          resources:
            requests: { cpu: 50m, memory: 40Mi }
            limits: { memory: 170Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["all"]
          livenessProbe:
            httpGet: { path: /health, port: 8080, scheme: HTTP }
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 8181, scheme: HTTP }
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - { name: config-volume, mountPath: /etc/coredns, readOnly: true }
      volumes:
        - name: config-volume
          configMap:
            name: coredns-sauvage
            items:
              - { key: Corefile, path: Corefile }
