# INFRA-1412 (INFRA-902 S3): sonda de divergencia DNS de los nombres fijados de
# e-dani.com + alerta. Cada nombre que scripts/gen_coredns_edani.py --list-fixed fija
# debe responder desde CUALQUIER endpoint de kube-dns con IP privada (la VIP LAN
# 192.168.50.240 o un ClusterIP 10.43.0.0/16). Si alguno responde pública, está
# cayendo a `forward` y los clientes in-cluster vuelven al borde público (INFRA-896:
# capas de Harbor 413/502 vía Cloudflare, la sonda libreplay al edge). Este watch lo
# ve en un ciclo de sonda (5 min) sin esperar al incidente.
#
# Mecanismo decidido por el architect (nota-architect-plan.md de INFRA-902): CronJob +
# push a vmsingle /api/v1/import/prometheus + VMRule, patrón exacto de
# storage/longhorn/orphan-watch.yaml. NO VMProbe: el módulo dns de blackbox no puede
# afirmar la lista blanca de IPs de respuesta ni iterar los 10 endpoints por nombre.
# La lista de nombres es la del generador (names.txt generado con --list-fixed; el
# contrato tests/test_edani_dns_divergence_watch_contract.py falla en CI si deriva).
#
# Ejecución manual (tras el deploy):
#   kubectl create job -n monitoring --from=cronjob/edani-dns-divergence-watch edani-dns-manual-$(date +%s)
# Forzar divergencia (C3a, solo como prueba; NUNCA dejar el env puesto en producción):
#   editar el job creado con EXTRA_TEST_NAME=<nombre que responde pública> y verlo.
# Métrica: edani_dns_public_answer (0/1) + edani_dns_public_answer_offender por par
# divergente + edani_dns_probe_last_success_timestamp (diagnóstico de frescura).
# La divergencia es dato: el job sale 0 aunque encuentre divergencia (la alerta va por
# la VMRule); sale !=0 solo si no puede comprobar -> alarma K8sCronJobFailed (topic Crons).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edani-dns-divergence-watch
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
---
# El mínimo que necesita la sonda: leer los endpoints de kube-dns (10 réplicas).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edani-dns-divergence-watch
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: monitoring
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edani-dns-divergence-watch
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: monitoring
subjects:
  - kind: ServiceAccount
    name: edani-dns-divergence-watch
    namespace: monitoring
roleRef:
  kind: Role
  name: edani-dns-divergence-watch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edani-dns-divergence-watch
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
data:
  # GENERADO por scripts/gen_coredns_edani.py --list-fixed -- no editar a mano.
  # Regenerar: python3 scripts/gen_coredns_edani.py --list-fixed
  # El contrato de CI falla si esta lista deriva del generador (prohibida una lista
  # propia en la sonda: sería la misma clase de fallo que combate la épica).
  names.txt: |
