apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sauvage-bot-default-deny-ingress
  namespace: sauvage-bot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sauvage-bot-allow-traefik
  namespace: sauvage-bot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sauvage-bot
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-edge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-lan
        # Traefik Edge runs with hostNetwork, so the backend sees the exact
        # node addresses instead of a namespaced pod address.
        - ipBlock:
            cidr: 100.107.21.89/32
        - ipBlock:
            cidr: 100.71.117.127/32
        - ipBlock:
            cidr: 100.75.189.75/32
        - ipBlock:
            cidr: 100.109.183.9/32
      ports:
        - protocol: TCP
          port: 8080
