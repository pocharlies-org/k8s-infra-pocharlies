apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sauvage-bot-default-deny-ingress
  namespace: sauvage-bot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sauvage-bot-allow-traefik
  namespace: sauvage-bot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sauvage-bot
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-edge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-lan
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway
        # Traefik Edge runs with hostNetwork. Cross-node traffic is SNATed to
        # the source node's Flannel host address (the PodCIDR network address)
        # before it reaches the backend. Keep both the node InternalIPs and the
        # observed Flannel addresses explicit so this policy stays fail-closed.
        - ipBlock:
            cidr: 100.107.21.89/32
        - ipBlock:
            cidr: 100.71.117.127/32
        - ipBlock:
            cidr: 100.75.189.75/32
        - ipBlock:
            cidr: 100.109.183.9/32
        - ipBlock:
            cidr: 10.42.3.0/32
        - ipBlock:
            cidr: 10.42.4.0/32
        - ipBlock:
            cidr: 10.42.5.0/32
        - ipBlock:
            cidr: 10.42.6.0/32
      ports:
        - protocol: TCP
          port: 8080
