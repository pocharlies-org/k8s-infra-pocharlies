apiVersion: v1
kind: ServiceAccount
metadata:
  name: sauvage-bot
  namespace: sauvage-bot
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sauvage-bot-config
  namespace: sauvage-bot
data:
  INSTANCE_ID: sauvage
  FILES_DYNAMIC: /srv/data
  FILES_SAMPLES: /srv/data
  CONVERT: disabled
  MAX_BACKUPS: "0"

  SERVER_ENABLED: "true"
  SERVER_LISTEN: :8080
  SERVER_PROBE_LISTEN: :9090
  SERVER_AUTH: ""

  # Poll exactly this group with one replica. DRY and
  # COMMUNITY_APPLY_ACTIONS remain independent enforcement gates.
  TELEGRAM_GROUP: "-1003672565710"
  TELEGRAM_GROUPS: "-1003672565710"

  OPENAI_API_BASE: http://litellm.litellm.svc.cluster.local:4000/v1
  # Capability alias: LiteLLM resolves this to the current local tooling
  # resident and owns availability fallback independently of Shield.
  OPENAI_MODEL: qwen35-4b
  OPENAI_RETRY_COUNT: "1"
  OPENAI_CHECK_SHORT_MESSAGES: "true"
  LLM_MODE: always
  LLM_HISTORY_CONTEXT_SIZE: "8"
  LLM_REQUEST_TIMEOUT: 8s
  LLM_MIN_INPUT_CHARS: "3"

  PARANOID: "true"
  FIRST_MESSAGES_COUNT: "0"
  SIMILARITY_THRESHOLD: "0"
  MAX_EMOJI: "-1"
  CAS_API: ""

  COMMUNITY_ENABLED: "true"
  COMMUNITY_CHAT_ID: "-1003672565710"
  COMMUNITY_PRESENTATION_THREAD_ID: "3"
  COMMUNITY_CONTEST_THREAD_ID: "6"
  COMMUNITY_CONTEST_ID: rollout-2026-07-28
  COMMUNITY_DAILY_DIGEST: "false"
  COMMUNITY_DAILY_DIGEST_HOUR: "9"
  COMMUNITY_DAILY_DIGEST_TIMEZONE: Europe/Madrid
  COMMUNITY_DASHBOARD_URL: https://sauvage-bot.e-dani.com
  COMMUNITY_APPLY_ACTIONS: "false"

  DRY: "true"
  MODERATION_WARN_STRIKES: "1"
  MODERATION_FIRST_STRIKE: 1h
  MODERATION_SECOND_STRIKE: 24h
  MODERATION_WARN_DELETE_DURATION: 15m

  REPORT_ENABLED: "true"
  REPORT_THRESHOLD: "2"
  REPORT_AUTO_BAN_THRESHOLD: "0"
  REPORT_RATE_LIMIT: "10"
  REPORT_RATE_PERIOD: 1h

  RETENTION_ENABLED: "true"
  RETENTION_INCOMING_EVENTS_TTL: 720h
  RETENTION_MODERATION_ACTIONS_TTL: 2160h
  RETENTION_COMMUNITY_EVENTS_TTL: 2160h
  RETENTION_INCIDENTS_TTL: 2160h
  RETENTION_APPEALS_TTL: 2160h
  RETENTION_INTERVAL: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sauvage-bot
  namespace: sauvage-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sauvage-bot
  template:
    metadata:
      annotations:
        config.k8s.e-dani.com/revision: shield-qwen35-4b-20260820
      labels:
        app.kubernetes.io/name: sauvage-bot
        app.kubernetes.io/part-of: sauvage-moderation
    spec:
      serviceAccountName: sauvage-bot
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shield
          image: ghcr.io/pocharlies/shield@sha256:2072253e72059864f238416a8b459f574d4cfe6ea2b5a126dfa1796229c3dc18
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sauvage-bot-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sauvage-bot-runtime
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sauvage-bot-runtime
                  key: DB_PASSWORD
            - name: DB
              value: postgres://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/sauvage_bot?sslmode=disable
            - name: OPENAI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sauvage-bot-runtime
                  key: OPENAI_TOKEN
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sauvage-bot-runtime
                  key: TELEGRAM_TOKEN
            - name: SERVER_AUTH_HASH
              valueFrom:
                secretKeyRef:
                  name: sauvage-bot-runtime
                  key: SERVER_AUTH_HASH
            - name: SERVER_SAUVAGE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sauvage-bot-runtime
                  key: SAUVAGE_INTERNAL_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-data
              mountPath: /srv/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sauvage-bot
  namespace: sauvage-bot
spec:
  selector:
    app.kubernetes.io/name: sauvage-bot
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
