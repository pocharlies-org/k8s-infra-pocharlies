# company-dreaming — el pase diario que audita las memorias de Claude Code contra
# el código que corre (épica SC-711, núcleo SC-1208, despliegue original SC-1209).
#
# INFRA-349 (08-11): el CronJob se traslada de kube-system (disparador que entraba al
# host ubuntu con nsenter+privileged) a ns paseo, sobre el PVC paseo-home. Desde la
# migración de la compañía al pod company-0 (SC-3961, 07-11) las memorias
# (~/.claude/projects), los clones que se miden (~/k8s, ~/src) y el runtime
# (~/.local/libexec/x86-host-runtime, que sincroniza el sidecar company-cron con
# origin/main cada 2 min) viven EN ESE PVC; el host ya no tenía nada que auditar y
# cada pasada abortaba con check-links rc=2 → job Failed → app k8s-infra Degraded.
# El pod ya no es el disparador: es el entorno de ejecución — cero privileged, cero
# nsenter, cero hostPID.
#
# Por qué ya no hace falta entrar al host (el argumento del manifiesto viejo, muerto):
#   - el clasificador no lanza `claude -p` desde v14: llamada HTTP directa a LiteLLM
#     (company_env.abrir_litellm), alcanzable desde el clúster;
#   - `systemctl --user` no existe en el pod: cada claim de unidad queda SIN-DATO con
#     el motivo (el Medidor lo tolera por claim desde el defecto qa del 24-09) — no
#     aborta; medir unidades desde aquí es pérdida acotada y conocida del pase.
#   - nodeSelector atlantic: paseo-home es RWO (local-path) y company-0 lo tiene
#     montado; el Job ha de caer en el mismo nodo (co-mount RWO permitido).
#   - imagen: la misma que la sts company (k8s-paseo-pocharlies) — python3, bash, grep
#     y el home completo. Si la sts sube de imagen, subir aquí el digest a la par.
#
# Visibilidad (lo que justificó el paso a k8s en SC-1209, intacto): historial de Jobs
# en kubectl, métricas de CronJob/Job vía kube-state-metrics y ArgoCD dueño del
# estado deseado.
#
# Equivalencias con la unidad systemd que se retiró (x86-host-runtime-pocharlies, PR
# hermana #401) — intactas:
#   OnCalendar + Persistent   -> startingDeadlineSeconds 43200 (12 h).
#   TimeoutStartSec=21600     -> activeDeadlineSeconds 21600 (la pasada dura 3-5,5 h).
#   MemoryHigh/Max            -> requests 512Mi / limits 4Gi.
#   oneshot dueño único       -> concurrencyPolicy Forbid + backoffLimit 0.
#   --aplicar con guarda      -> intacto: la primera pasada y cualquier cambio de
#                                criterio siguen forzándose en seco dentro del script.
#
# HORA — 01:30 Europe/Madrid (desde 28-09): la ventana 03:00-04:00 está atestada de
# CronJobs y 01:30 es la hora más limpia; la pasada acaba antes del informe del VP
# (08:00) y mantiene la invariante de arrancar antes que blog-daily (05:00).
#
# Verificación (INFRA-349, 08-11, en el home real del pod company-0):
#   1. Pasada seca del lote synapse con el runtime arreglado: exit 0, 70 fuentes,
#      clasificador por LiteLLM (2011/710 tokens), 108 afirmaciones medidas, informe
#      en ~/.company/dreaming/informes/2026-11-08.md.
#   2. Sin árbol de memorias (CLAUDE_PROJECTS_DIR inexistente): exit 0 con «nada que
#      auditar» en el informe (antes: abort exit 2). Test en ci/test_dreaming_nucleo.py
#      de x86-host-runtime-pocharlies (INFRA-349).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: company-dreaming
  namespace: paseo
  labels:
    app.kubernetes.io/name: company-dreaming
    app.kubernetes.io/part-of: x86-host-runtime
    compania.sc/epic: SC-711
spec:
  schedule: "30 1 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 43200
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  suspend: false
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: company-dreaming
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: atlantic
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          volumes:
            - name: home
              persistentVolumeClaim:
                claimName: paseo-home
          containers:
            - name: dreaming
              image: harbor.lan.e-dani.com/homelab/paseo-atlantic@sha256:e8f28fe9c08c9274bc9c1f28ac0c5c0776d806604f87df4bdfb6adc26f3bc8e3
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 4Gi
              env:
                - name: HOME
                  value: /home/dibanez
                - name: PATH
                  value: "/home/dibanez/.npm-global/bin:/home/dibanez/.local/bin:/usr/local/bin:/usr/bin:/bin"
                - name: LANG
                  value: C.UTF-8
              command: ["/usr/bin/python3"]
              args:
                - /home/dibanez/.local/libexec/x86-host-runtime/company-dreaming.py
                - --aplicar
              volumeMounts:
                - name: home
                  mountPath: /home/dibanez
