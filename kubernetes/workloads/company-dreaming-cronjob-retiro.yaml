# company-dreaming (kube-system) — TUMBA para el pod-disparador del host ubuntu
# (INFRA-349, 08-11). El pase vive ahora en ns paseo sobre el PVC paseo-home
# (kubernetes/workloads/company-dreaming-cronjob.yaml); este CronJob quedó huérfano al
# trasladarlo y con prune:false (ARCHITECTURE.md §8) ArgoCD no lo borra solo: se queda
# OutOfSync pidiendo prune y dispararía cada noche contra un host sin memorias.
# El annotation sync-options Prune=true permite podarlo A PESAR de prune:false;
# suspend:true evita que dispare esta noche mientras se aplica. Se retira el fichero
# en la PR siguiente (segundo sync) y ArgoCD lo poda.
apiVersion: batch/v1apiVersion: batch/v1
kind: CronJob
metadata:
  name: company-dreaming
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=true
  labels:
    app.kubernetes.io/name: company-dreaming
    app.kubernetes.io/part-of: x86-host-runtime
    compania.sc/epic: SC-711
spec:
  schedule: "30 1 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 43200
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  suspend: true
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: company-dreaming
        spec:
          hostPID: true
          nodeName: ubuntu
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: dreaming
              image: ubuntu:24.04
              imagePullPolicy: IfNotPresent
              securityContext:
                privileged: true
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 4Gi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  exec nsenter -t 1 -m -u -i -n -p -- \
                    runuser -u dibanez -- env \
                      HOME=/home/dibanez USER=dibanez LOGNAME=dibanez \
                      XDG_RUNTIME_DIR=/run/user/1000 \
                      DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus \
                      PATH=/home/dibanez/.local/bin:/usr/local/bin:/usr/bin:/bin \
                      /usr/bin/python3 /home/dibanez/.local/libexec/x86-host-runtime/company-dreaming.py --aplicar
